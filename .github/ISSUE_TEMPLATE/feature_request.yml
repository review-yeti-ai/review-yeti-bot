name: Feature request
description: Propose a new capability, persona, config key, or CLI/MCP surface.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the gap or friction, not the solution yet.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: >-
        What you'd want the Action, CLI, config schema, or a persona to do. Link
        [docs/CONFIGURATION_REFERENCE.md](../../docs/CONFIGURATION_REFERENCE.md) or
        [docs/ARCHITECTURE.md](../../docs/ARCHITECTURE.md) if this touches existing keys or
        the review pipeline shape.
    validations:
      required: true

  - type: dropdown
    id: breaking
    attributes:
      label: Is this a breaking change for existing `@v1` consumers?
      description: >-
        See docs/RELEASING.md#versioning-policy. A breaking change ships on a new major
        channel, never as a v1 release.
      options:
        - "No — additive/backward compatible"
        - "Yes — changes existing input/output/default behavior"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
