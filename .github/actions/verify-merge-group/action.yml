name: Publish Review Yeti merge-group gate
description: Verify every constituent and publish the native Review Yeti App check on the synthetic head
inputs:
  review-yeti-token:
    description: Review Yeti App installation token with checks write access and queue read access
    required: true
  repository:
    description: Fully qualified exampleorg consumer repository
    required: true
  branch:
    description: Branch whose merge queue emitted the merge_group event
    required: true
runs:
  using: composite
  steps:
    - name: Verify constituents and publish native gate
      shell: bash
      env:
        INPUT_REVIEW_YETI_TOKEN: ${{ inputs.review-yeti-token }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_BRANCH: ${{ inputs.branch }}
      run: node "${{ github.action_path }}/verify-merge-group.mjs"
