name: Node dependencies (portable; sticky disk or Actions cache)
description: >-
  REL-1074 / REL-1250. Node 24 plus a lockfile-keyed node_modules. A warm cache
  skips `npm ci` entirely; a cold one installs from a warm npm cache.

  Portable across runner families. On a Blacksmith runner this mounts the
  Blacksmith sticky disk (multi-GB, writable on trusted refs, read-only on pull
  requests). On a GitHub-hosted runner it falls back to native actions/cache
  keyed on the same lockfile digest, so the SAME workflow file runs on either
  family and can be A/B measured without editing it.

  `runner.environment` is the discriminator: GitHub sets it to
  'github-hosted' for GitHub-hosted runners and 'self-hosted' for Blacksmith
  (Blacksmith registers as self-hosted).

runs:
  using: composite
  steps:
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      # Blacksmith's image caches an older Node 24 (24.13) than GitHub's (24.21), and node:sqlite
      # still warns as experimental there, which tests that assert an empty stderr notice.
      # Resolve the newest 24.x on every runner instead of whatever the image cached.
      with:
        node-version: "24"
        check-latest: true

    # The root package's own version is rewritten by every release-please PR but changes nothing
    # that is installed, so it is dropped from the key; every dependency entry still counts.
    - id: key
      shell: bash
      run: |
        set -euo pipefail
        deps="$(jq -S 'del(.version, .packages[""].version)' package-lock.json | sha256sum | cut -c1-24)"
        node_major="$(node -p 'process.versions.node.split(".")[0]')"
        echo "deps=${deps}" >> "$GITHUB_OUTPUT"
        echo "node=${node_major}" >> "$GITHUB_OUTPUT"
        if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
          echo "commit=false" >> "$GITHUB_OUTPUT"
        else
          echo "commit=on-change" >> "$GITHUB_OUTPUT"
        fi

    # ── Blacksmith path (sticky disk) ──────────────────────────────────────
    - name: Mount npm cache (Blacksmith sticky disk)
      if: runner.environment == 'self-hosted'
      uses: useblacksmith/stickydisk@94697d49e77d0dd78b77deb85ad3de63a28b4b8a # v1.7.1
      with:
        key: ${{ github.repository }}-npm-cache-${{ runner.os }}-${{ runner.arch }}
        path: ~/.npm
        commit: ${{ steps.key.outputs.commit }}

    - name: Mount node_modules (Blacksmith sticky disk)
      if: runner.environment == 'self-hosted'
      uses: useblacksmith/stickydisk@94697d49e77d0dd78b77deb85ad3de63a28b4b8a # v1.7.1
      with:
        key: ${{ github.repository }}-node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ steps.key.outputs.node }}-${{ steps.key.outputs.deps }}
        path: ./node_modules
        commit: ${{ steps.key.outputs.commit }}

    # ── GitHub-hosted path (native Actions cache) ──────────────────────────
    # Parity rules: the npm-cache keys are identical across both families, and the
    # node_modules keys are identical across both families. Neither is "same shape
    # in general" -- those two specific keys are shared by construction. Public
    # repositories get 10 GB per repository for free; node_modules here is
    # ~0.9 GB, so it fits comfortably.
    - name: Restore npm cache (Actions cache)
      if: runner.environment == 'github-hosted'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.npm
        # Deliberately the SAME key as the Blacksmith npm disk above: a package
        # download cache needs no node/deps granularity (npm itself validates the
        # tarballs), so both families share one coarse key. node_modules, by
        # contrast, IS keyed by node+deps on both families because it is an
        # installed tree. Those are the only two parity rules; keep them true.
        key: ${{ github.repository }}-npm-cache-${{ runner.os }}-${{ runner.arch }}
        restore-keys: |
          ${{ github.repository }}-npm-cache-${{ runner.os }}-${{ runner.arch }}

    - name: Restore node_modules (Actions cache)
      if: runner.environment == 'github-hosted'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ./node_modules
        key: ${{ github.repository }}-node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ steps.key.outputs.node }}-${{ steps.key.outputs.deps }}

    # The marker is written only after a successful `npm ci`, so an interrupted install is never
    # trusted. `npm ci` clears node_modules' contents itself, which works on a mount point.
    - name: Install dependencies unless the cache already holds this lockfile
      shell: bash
      env:
        DEPS_KEY: node${{ steps.key.outputs.node }}-${{ steps.key.outputs.deps }}
      run: |
        set -euo pipefail
        marker=node_modules/.review-yeti-deps-key
        if [ -f "$marker" ] && [ "$(cat "$marker")" = "$DEPS_KEY" ] && [ -f node_modules/.package-lock.json ]; then
          echo "node_modules is warm for ${DEPS_KEY}; skipping npm ci"
        else
          npm ci --prefer-offline --no-audit --no-fund
          printf '%s' "$DEPS_KEY" > "$marker"
        fi
