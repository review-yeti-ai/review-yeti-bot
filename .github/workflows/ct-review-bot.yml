name: Review Yeti

# Phase 1 of the self-review migration. Review implementation and policy live
# in the base-owned central repository. Keep review-bot.yaml active until this
# caller has produced a live exact-head Review Yeti result on a later PR.
on:
  pull_request_target:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    name: Review Yeti
    if: github.event.pull_request.draft == false
    # Immutable pin verified from the protected, fail-closed promoted v1 branch
    # after promotion run 34698121866.
    # v1 provenance: calltelemetry/ct-review-actions@d0f54d0dc80b6501d1652f73461f62983da0fe3b
    uses: calltelemetry/ct-review-actions/.github/workflows/review-yeti.yml@d0f54d0dc80b6501d1652f73461f62983da0fe3b
    secrets:
      CT_REVIEW_BOT_APP_ID: ${{ secrets.CT_REVIEW_BOT_APP_ID }}
      CT_REVIEW_BOT_APP_PRIVATE_KEY: ${{ secrets.CT_REVIEW_BOT_APP_PRIVATE_KEY }}
      OPENROUTER_REVIEW_FLEET_KEY: ${{ secrets.CT_REVIEW_OPENROUTER_API_KEY }}
