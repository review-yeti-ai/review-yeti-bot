name: Review Yeti

# Phase 1 of the self-review migration. Review implementation and policy live
# in the base-owned central repository. Keep review-bot.yaml active until this
# caller has produced a live exact-head Review Yeti result on a later PR.
on:
  pull_request_target:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    name: Review Yeti
    if: github.event.pull_request.draft == false
    # Immutable pin verified from the protected, fail-closed promoted v1 branch.
    # v1 provenance: calltelemetry/ct-review-actions@54a9ec171b5a8cbc90515ad3998b7c0a9ffb65ff
    uses: calltelemetry/ct-review-actions/.github/workflows/review-yeti.yml@54a9ec171b5a8cbc90515ad3998b7c0a9ffb65ff
    secrets: inherit
