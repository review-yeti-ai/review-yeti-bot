name: Review Yeti

# Phase 1 of the self-review migration. Review implementation and policy live
# in the base-owned central repository. Keep review-bot.yaml active until this
# caller has produced a live exact-head Review Yeti result on a later PR.
on:
  pull_request_target:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    name: Review Yeti
    if: github.event.pull_request.draft == false
    # v1 is the protected, fail-closed promotion branch required by the central
    # caller contract. It is not a floating release tag or a consumer-selected
    # dependency; promotion requires exact-head central validation receipts.
    uses: calltelemetry/ct-review-actions/.github/workflows/review-yeti.yml@v1
    secrets: inherit
