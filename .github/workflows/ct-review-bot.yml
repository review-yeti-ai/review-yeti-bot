name: Review Yeti

# Phase 1 of the self-review migration. Review implementation and policy live
# in the private, base-owned central repository. A public repository cannot
# resolve that private reusable workflow, so this caller submits immutable PR
# coordinates through the central dispatch boundary and exits without checking
# out PR code. Keep review-bot.yaml active until this path has produced a live
# exact-head Review Yeti result on a later PR.
on:
  pull_request_target:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: review-yeti-dispatch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: Dispatch Review Yeti
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CENTRAL_EVENT_TYPE: review-yeti-request
      TARGET_REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      REQUEST_ID: review-yeti-bot:${{ github.event.pull_request.number }}:${{ github.event.pull_request.head.sha }}:${{ github.run_id }}:${{ github.run_attempt }}
    steps:
      - name: Validate immutable review coordinates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${TARGET_REPOSITORY}" != "review-yeti-ai/review-yeti-bot" ]]; then
            echo "::error::Unexpected target repository: ${TARGET_REPOSITORY}"
            exit 1
          fi
          if [[ ! "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid pull request number."
            exit 1
          fi
          if [[ ! "${EXPECTED_BASE_SHA}" =~ ^[0-9a-f]{40}$ ]] ||
             [[ ! "${EXPECTED_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Base and head coordinates must be full lowercase Git SHAs."
            exit 1
          fi
          if [[ ! "${REQUEST_ID}" =~ ^review-yeti-bot:[1-9][0-9]*:[0-9a-f]{40}:[1-9][0-9]*:[1-9][0-9]*$ ]]; then
            echo "::error::Generated request id is outside the central contract."
            exit 1
          fi

          live_coordinates="$(
            gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}" \
              --jq '[.state, .base.sha, .head.sha] | @tsv'
          )"
          IFS=$'\t' read -r live_state live_base_sha live_head_sha <<<"${live_coordinates}"
          if [[ "${live_state}" != "open" ]] ||
             [[ "${live_base_sha}" != "${EXPECTED_BASE_SHA}" ]] ||
             [[ "${live_head_sha}" != "${EXPECTED_HEAD_SHA}" ]]; then
            echo "::error::Pull request coordinates changed before central dispatch."
            exit 1
          fi

      - name: Mint Review Yeti dispatch token
        id: ry_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.1
        with:
          # These literal scope fields and the dispatch URL below are one
          # contract. The central validator requires the exact endpoint marker;
          # the unit test locks both names together.
          app-id: ${{ secrets.CT_REVIEW_BOT_APP_ID }}
          private-key: ${{ secrets.CT_REVIEW_BOT_APP_PRIVATE_KEY }}
          owner: calltelemetry
          repositories: ct-review-actions
          permission-contents: write

      - name: Require Review Yeti dispatch identity
        if: steps.ry_token.outputs.token == ''
        run: |
          echo "::error::Review Yeti App token was not minted; the App credentials and central installation are required."
          exit 1

      - name: Dispatch central Review Yeti
        env:
          GH_TOKEN: ${{ steps.ry_token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          jq -nc \
            --arg event_type "${CENTRAL_EVENT_TYPE}" \
            --arg request_id "${REQUEST_ID}" \
            --arg repository "${TARGET_REPOSITORY}" \
            --argjson pr_number "${PR_NUMBER}" \
            --arg base_sha "${EXPECTED_BASE_SHA}" \
            --arg head_sha "${EXPECTED_HEAD_SHA}" \
            '{event_type: $event_type, client_payload: {request_id: $request_id, repository: $repository, pr_number: $pr_number, base_sha: $base_sha, head_sha: $head_sha}}' |
            gh api --method POST "repos/calltelemetry/ct-review-actions/dispatches" --input - --silent

          echo "Dispatched central Review Yeti for ${TARGET_REPOSITORY}#${PR_NUMBER} at ${EXPECTED_HEAD_SHA}."
