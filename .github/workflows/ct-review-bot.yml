name: Review Yeti

# Base-owned, dispatch-only self-review shim at the fleet-standard caller path.
# The same repository_dispatch
# boundary used by fleet consumers validates this caller, executes promoted v1,
# and lets the ct-review-bot App publish the authoritative exact-head raw check.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: review-yeti-dispatch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event.action != 'labeled' && github.event.action != 'unlabeled' }}

jobs:
  review:
    # Dispatch observability only. Protection and v1 promotion require the raw
    # Review Yeti check from App ID 4385771 on the exact PR head.
    name: Review Yeti / Review Yeti
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CENTRAL_REPOSITORY: exampleorg/example-review-actions
      CENTRAL_EVENT_TYPE: review-yeti-request
      TARGET_REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      REQUEST_ID: example-review-actions:${{ github.event.pull_request.number }}:${{ github.event.pull_request.head.sha }}:${{ github.run_id }}:${{ github.run_attempt }}
    steps:
      - name: Mint Review Yeti dispatch token
        id: ry_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.CT_REVIEW_BOT_APP_ID }}
          private-key: ${{ secrets.CT_REVIEW_BOT_APP_PRIVATE_KEY }}
          owner: exampleorg
          repositories: example-review-actions
          # This token may read the exact head and PR, and may dispatch through
          # the contents-scoped repository_dispatch API. It cannot write Checks,
          # so the base-owned caller cannot manufacture its own protected gate.
          permission-checks: read
          permission-contents: write
          permission-pull-requests: read

      - name: Report Review Yeti dispatch identity
        run: |
          if [[ -n "${{ steps.ry_token.outputs.token }}" ]]; then
            echo "Review Yeti dispatch identity: app-token"
          else
            echo "::error::Review Yeti App token was not minted; there is no credential fallback."
            exit 1
          fi

      - name: Decide whether this head still needs a panel
        id: trigger
        env:
          GH_TOKEN: ${{ steps.ry_token.outputs.token }}
          EVENT_ACTION: ${{ github.event.action }}
          REQUIRED_APP_ID: "4385771"
        shell: bash
        run: |
          set -euo pipefail

          fallback_for_unreadable_checks() {
            case "${EVENT_ACTION}" in
              labeled|unlabeled) echo "dispatch=false" >> "${GITHUB_OUTPUT}" ;;
              *) echo "dispatch=true" >> "${GITHUB_OUTPUT}" ;;
            esac
          }

          if ! checks="$(gh api --paginate "repos/${TARGET_REPOSITORY}/commits/${EXPECTED_HEAD_SHA}/check-runs?filter=all&per_page=100")"; then
            fallback_for_unreadable_checks
            echo "Could not read exact-head checks; label replay will not duplicate provider spend."
            exit 0
          fi

          if ! existing="$(printf '%s' "${checks}" | jq -e -s -r \
            --arg expected_head "${EXPECTED_HEAD_SHA}" \
            --arg app_id "${REQUIRED_APP_ID}" '
              def terminal_verdict:
                (.status == "completed")
                and ((.conclusion | type) == "string")
                and (((.output.title // "") == "Review Yeti: FIX_FIRST")
                  or ((.output.title // "") == "Review Yeti: BLOCK")
                  or ((.output.title // "") | startswith("Review Yeti: SHIP"))
                  or ((.output.title // "") | startswith("Review Yeti: PASSTHROUGH")));
              [.[].check_runs[]?
               | select(.name == "Review Yeti")
               | select((.app.id | tostring) == $app_id)
               | select(.head_sha == $expected_head)
               | select(.status != "completed" or terminal_verdict)]
              | length
            ')"; then
            fallback_for_unreadable_checks
            echo "Could not parse exact-head checks; label replay will not duplicate provider spend."
            exit 0
          fi

          if [[ "${existing}" -gt 0 ]]; then
            echo "dispatch=false" >> "${GITHUB_OUTPUT}"
            echo "The exact head already has an in-flight panel or terminal App verdict."
          else
            echo "dispatch=true" >> "${GITHUB_OUTPUT}"
            echo "The exact head has no in-flight panel or terminal App verdict; dispatching."
          fi

      - name: Validate immutable review coordinates
        env:
          GH_TOKEN: ${{ steps.ry_token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || { echo "::error::Review Yeti App token is required."; exit 1; }
          [[ "${TARGET_REPOSITORY}" == "exampleorg/example-review-actions" ]] || { echo "::error::Unexpected target repository."; exit 1; }
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid pull request number."; exit 1; }
          [[ "${EXPECTED_BASE_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid base SHA."; exit 1; }
          [[ "${EXPECTED_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid head SHA."; exit 1; }
          [[ "${REQUEST_ID}" =~ ^example-review-actions:[1-9][0-9]*:[0-9a-f]{40}:[1-9][0-9]*:[1-9][0-9]*$ ]] || { echo "::error::Invalid request identity."; exit 1; }

          live_coordinates="$(
            gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}" \
              --jq '[.state, .base.sha, .head.sha] | @tsv'
          )"
          IFS=$'\t' read -r live_state live_base_sha live_head_sha <<<"${live_coordinates}"
          [[ "${live_state}" == "open" ]] || { echo "::error::Pull request is no longer open."; exit 1; }
          [[ "${live_base_sha}" == "${EXPECTED_BASE_SHA}" ]] || { echo "::error::Pull request base changed."; exit 1; }
          [[ "${live_head_sha}" == "${EXPECTED_HEAD_SHA}" ]] || { echo "::error::Pull request head changed."; exit 1; }

      - name: Dispatch central Review Yeti
        if: steps.trigger.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ steps.ry_token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          jq -nc \
            --arg event_type "${CENTRAL_EVENT_TYPE}" \
            --arg request_id "${REQUEST_ID}" \
            --arg repository "${TARGET_REPOSITORY}" \
            --argjson pr_number "${PR_NUMBER}" \
            --arg base_sha "${EXPECTED_BASE_SHA}" \
            --arg head_sha "${EXPECTED_HEAD_SHA}" \
            '{event_type: $event_type, client_payload: {request_id: $request_id, repository: $repository, pr_number: $pr_number, base_sha: $base_sha, head_sha: $head_sha}}' |
            gh api --method POST "repos/exampleorg/example-review-actions/dispatches" --input - --silent

      - name: Confirm central Review Yeti dispatch
        if: steps.trigger.outputs.dispatch == 'true'
        run: |
          echo "Dispatched central Review Yeti for ${TARGET_REPOSITORY}#${PR_NUMBER} (${EXPECTED_HEAD_SHA}) to ${CENTRAL_REPOSITORY}."
          echo "repository-dispatch.yml executes asynchronously; App ID 4385771 publishes Review Yeti."
