name: Channel RC

# Fast-forwards the v1-rc floating tag to the latest main SHA on every push,
# giving consumers a "bleeding edge" channel distinct from the release-gated
# v1 tag that only release.yml moves.
on:
  push:
    branches: [main]

concurrency:
  group: channel-rc
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  move-rc-tag:
    name: Fast-forward v1-rc
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Fast-forward v1-rc to pushed SHA
        run: |
          git push origin "+${GITHUB_SHA}:refs/tags/v1-rc"

      - name: Post-verify v1-rc tag points at pushed SHA
        run: |
          resolved_sha="$(git ls-remote origin refs/tags/v1-rc | cut -f1)"
          if [ "$resolved_sha" != "$GITHUB_SHA" ]; then
            echo "::error::v1-rc resolved to ${resolved_sha}, expected ${GITHUB_SHA}"
            exit 1
          fi
          echo "v1-rc verified at ${resolved_sha}"
