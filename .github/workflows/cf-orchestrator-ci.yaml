name: Cloudflare Orchestrator CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cf-orchestrator/**"
      - "src/**"
      - ".github/workflows/cf-orchestrator-ci.yaml"
  pull_request:
    paths:
      - "cf-orchestrator/**"
      - "src/**"
      - ".github/workflows/cf-orchestrator-ci.yaml"

concurrency:
  group: cf-orchestrator-ci-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs only; never abort an in-flight push/dispatch deploy to main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  verify-orchestrator:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cf-orchestrator/package-lock.json

      - name: Install dependencies
        working-directory: cf-orchestrator
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Compile TypeScript
        working-directory: cf-orchestrator
        run: npm run build

      - name: Run Complete Test Suite (Unit, Contract & Adversarial)
        working-directory: cf-orchestrator
        run: npm test

      - name: Verify authenticated MCP credential sync contract
        working-directory: cf-orchestrator
        run: node --test scripts/sync-mcp-auth-secret.test.mjs

      - name: Run End-to-End Integration Suite
        working-directory: cf-orchestrator
        run: npm run test:e2e

  deploy-orchestrator:
    name: Deploy to Cloudflare Edge
    needs: verify-orchestrator
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      # Deterministic digest of every tracked file `npm run build:frontend` can read
      # (next build, tsc type-check, Tailwind/PostCSS, postbuild/clean/ensure scripts,
      # src/, public/, legacy_public/, assets/, lockfile). Only trees the frontend
      # build provably never reads are excluded. Computed before anything mutates the
      # checkout, and fail-closed: an empty file list or empty digest aborts the job.
      - name: Compute frontend input hash
        id: frontend_hash
        shell: bash
        run: |
          set -euo pipefail
          files="$(git ls-files -z -- . ':!cf-orchestrator' ':!docs' ':!k8s' ':!k8s-operator' ':!charts' ':!infra' ':!.github' | tr -cd '\0' | wc -c)"
          if [ "${files}" -lt 1 ]; then
            echo "::error::No frontend input files found; refusing to compute an empty hash" >&2
            exit 1
          fi
          hash="$(
            {
              git ls-files -z -- . ':!cf-orchestrator' ':!docs' ':!k8s' ':!k8s-operator' ':!charts' ':!infra' ':!.github' | xargs -0 sha256sum
              sha256sum .github/workflows/cf-orchestrator-ci.yaml
            } | sha256sum | cut -d' ' -f1
          )"
          if [ -z "${hash}" ] || [ "${#hash}" -ne 64 ]; then
            echo "::error::Frontend input hash is empty or malformed" >&2
            exit 1
          fi
          echo "hash=${hash}" >> "$GITHUB_OUTPUT"

      # Exact-match only (no restore-keys): a stale frontend bundle can never be deployed.
      - name: Restore built frontend assets (out/)
        id: frontend_out_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: out
          key: cf-orchestrator-frontend-out-v1-${{ steps.frontend_hash.outputs.hash }}

      - name: Setup Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cf-orchestrator/package-lock.json

      - name: Restore Next.js build cache
        if: steps.frontend_out_cache.outputs.cache-hit != 'true'
        id: next_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .next/cache
          key: cf-orchestrator-next-cache-v1-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            cf-orchestrator-next-cache-v1-${{ hashFiles('package-lock.json') }}-

      - name: Install root dependencies
        if: steps.frontend_out_cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build Next.js Frontend Static Assets
        if: steps.frontend_out_cache.outputs.cache-hit != 'true'
        env:
          PRESERVE_NEXT_CACHE: '1'
        run: npm run build:frontend

      - name: Save built frontend assets (out/)
        if: steps.frontend_out_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: out
          key: cf-orchestrator-frontend-out-v1-${{ steps.frontend_hash.outputs.hash }}

      - name: Save Next.js build cache
        if: steps.frontend_out_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .next/cache
          key: cf-orchestrator-next-cache-v1-${{ hashFiles('package-lock.json') }}-${{ github.sha }}

      # wrangler serves `[assets] directory = "../out"`; refuse to deploy without it.
      - name: Verify frontend assets are present
        shell: bash
        run: |
          set -euo pipefail
          test -d out && test -f out/index.html || {
            echo "::error::out/ is missing or incomplete; refusing to deploy" >&2
            exit 1
          }

      - name: Install cf-orchestrator dependencies & compile
        working-directory: cf-orchestrator
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npm run build

      - name: Project MCP auth token from Doppler
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: cf-orchestrator
        env:
          REVIEW_YETI_DOPPLER_TOKEN: ${{ secrets.REVIEW_YETI_DOPPLER_TOKEN }}
          REVIEW_YETI_DOPPLER_PROJECT: ${{ vars.REVIEW_YETI_DOPPLER_PROJECT }}
          REVIEW_YETI_DOPPLER_CONFIG: ${{ vars.REVIEW_YETI_DOPPLER_CONFIG }}
        run: node scripts/sync-mcp-auth-secret.mjs

      - name: Deploy to Cloudflare Edge
        uses: cloudflare/wrangler-action@v3
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALLOWED_ORIGINS: ${{ vars.CF_ALLOWED_ORIGINS }}
          ACCESS_AUD: ${{ vars.CF_ACCESS_AUD }}
          OPERATOR_GLOBAL_PASSTHROUGH: ${{ vars.REVIEW_YETI_PASSTHROUGH || 'true' }}
          OPERATOR_PASSTHROUGH_EXEMPT_REPOSITORIES: ${{ vars.OPERATOR_PASSTHROUGH_EXEMPT_REPOSITORIES }}
          REVIEW_RUN_USD_CAP: ${{ vars.REVIEW_RUN_USD_CAP || '0.50' }}
          LEGACY_SUNSET_HOSTS: ${{ vars.CF_LEGACY_SUNSET_HOSTS || 'disabled' }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'cf-orchestrator'
          # Deployment-specific origins and Access AUD lists live in repository variables.
          vars: |
            ALLOWED_ORIGINS
            ACCESS_AUD
            OPERATOR_GLOBAL_PASSTHROUGH
            OPERATOR_PASSTHROUGH_EXEMPT_REPOSITORIES
            REVIEW_RUN_USD_CAP
            LEGACY_SUNSET_HOSTS
          command: deploy
