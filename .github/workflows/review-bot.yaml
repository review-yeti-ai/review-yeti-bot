name: Review Bot

# Central review repository runner.
#
# Two entry points:
#   1. pull_request       — reviews PRs raised against this repository itself.
#   2. repository_dispatch — another repository dispatches here with a target_repo/pr_number
#                            client_payload; this repo holds the personas, prompts and keys and
#                            comments back on the originating PR.
#
# The review itself is delegated to this repository's own action.yml, so every run exercises the
# same code path third-party consumers get via `uses: review-yeti-ai/review-yeti-bot@v1`.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  repository_dispatch:
    types: [review-requested, re-review-requested, dispatch-review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: review-${{ github.event.client_payload.target_repo || github.repository }}-${{ github.event.client_payload.pr_number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Execute AI Review Pipeline
    runs-on: ubuntu-latest
    # Caller-side hard backstop: no direct self-review or repository-dispatch path may run
    # longer than the central Review Yeti contract's fifteen-minute ceiling.
    timeout-minutes: 15
    steps:
      - name: Checkout Review Runner (this repository)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      # "Central repo controls all personas and settings and each repo can override with a local
      # file." On the dispatch path the workspace holds this repository, so the target's override
      # is fetched in. On the pull_request path the workspace is already the repo under review.
      - name: Fetch Target Repository Override Config
        if: github.event_name == 'repository_dispatch'
        env:
          GH_TOKEN: ${{ secrets.REVIEW_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ github.event.client_payload.target_repo }}
        run: |
          for f in .ct-review.yaml .ct-review.yml .coderabbit.yaml .coderabbit.yml; do
            if gh api "repos/$TARGET_REPO/contents/$f" -H "Accept: application/vnd.github.raw" > "$f" 2>/dev/null; then
              echo "Applied override config $f from $TARGET_REPO."
              break
            fi
            rm -f "$f"
          done

      - name: Execute AI Review Panel
        id: review
        uses: ./
        with:
          repo: ${{ github.event.client_payload.target_repo || github.repository }}
          pr-number: ${{ github.event.client_payload.pr_number || github.event.pull_request.number }}
          personas: ${{ vars.ACTIVE_PERSONAS }}
          model: ${{ vars.OPENROUTER_MODEL || 'deepseek/deepseek-v4-flash-0731' }}
          # Use only the role-scoped review key; generic provider secrets are not admitted here.
          llm-api-key: ${{ secrets.CT_REVIEW_OPENROUTER_API_KEY }}
          # Optional direct fallbacks. They are only admitted when their own keys are present;
          # OpenRouter remains the primary direct DeepSeek -> GLM route.
          ollama-api-key: ${{ secrets.CT_REVIEW_OLLAMA_API_KEY || secrets.OLLAMA_API_KEY }}
          synthetic-api-key: ${{ secrets.CT_REVIEW_SYNTHETIC_API_KEY || secrets.SYNTHETIC_API_KEY }}
          llm-base-url: ${{ vars.OPENROUTER_BASE_URL || 'https://openrouter.ai/api/v1' }}
          # REVIEW_BOT_TOKEN is required for cross-repo dispatch: the default GITHUB_TOKEN is
          # scoped to this repository and cannot read or comment on another repository's PR.
          github-token: ${{ secrets.REVIEW_BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Report Verdict
        if: always()
        run: |
          echo "Verdict: ${{ steps.review.outputs.verdict }}"
          echo "Findings: ${{ steps.review.outputs.findings-count }} (P0: ${{ steps.review.outputs.p0-count }}, P1: ${{ steps.review.outputs.p1-count }}, P2: ${{ steps.review.outputs.p2-count }})"

      # REL-580: enforce the verdict. Until now this job only echoed it, so the required
      # "Execute AI Review Pipeline" check went green whenever the pipeline *ran* -- it meant
      # "the reviewer finished talking", not "the reviewer approved". PR #490 shipped a P1
      # regression (a types/live <-> liveStreamBus import cycle) on a green check carrying a
      # FIX_FIRST verdict, and was merged on that green. A required check that cannot go red on
      # its own conclusion is not a gate.
      #
      # DISPATCHED is the one non-terminal state: the App gate is still pending and a later run
      # on the same head decides. It stays neutral rather than passing or failing.
      # An empty or NO_VERDICT result fails: a review that could not complete safely is never an
      # implicit pass.
      #
      # REL-585: a SHIP verdict alone does not mean the exact head was fully covered. The
      # pipeline's own gate-decision/merge-eligible/files-omitted outputs (review-pipeline.js
      # writeStepOutputs) are the load-bearing signals that the diff budget did not omit files and
      # that arbitration considered the review merge-eligible; this step used to read none of
      # them, so a SHIP where the diff budget dropped files still passed. Mirror the central
      # gate's established contract (ct-review-actions' check-review-verdict.sh) instead of
      # re-deriving a weaker one here.
      #
      # REL-585 also removes the P2-blocking branch that used to live here. That policy belonged
      # to arbitration, not this workflow layer: the central gate treats P2 as advisory (same
      # file, same rationale), the App path treats P2 as advisory (src/app.ts, `ship = verdict ===
      # 'SHIP'`), and arbitration already encodes a P2 escalation threshold
      # (`fixP2 = max(5, panelSize)` in src/review/reviewCore.js) that promotes a P2-heavy review
      # to FIX_FIRST on its own. Duplicating a second, stricter opinion here had no suppression
      # path on this code path -- NitSuppressionEngine only exists in the App path
      # (src/github/commentPublisher.ts) and nothing in review-pipeline.js reads review threads,
      # so this step's own error message ("reply on the thread") did nothing. Worse,
      # sanitizeFindings maps any unrecognised severity to P2, so malformed model output could
      # block a merge outright. Leaving P2 enforcement solely to arbitration keeps one place that
      # owns the threshold and can actually act on it.
      - name: Enforce Verdict
        if: always()
        env:
          VERDICT: ${{ steps.review.outputs.verdict }}
          REVIEW_STATUS: ${{ steps.review.outputs.review-status }}
          GATE_DECISION: ${{ steps.review.outputs.gate-decision }}
          MERGE_ELIGIBLE: ${{ steps.review.outputs.merge-eligible }}
          FILES_OMITTED: ${{ steps.review.outputs.files-omitted }}
        run: |
          set -euo pipefail

          if [ "${REVIEW_STATUS}" = "DISPATCHED" ]; then
            echo "::notice::Review dispatched; the App gate is still pending on this head. Not gating."
            exit 0
          fi

          case "${VERDICT}" in
            SHIP)
              # A SHIP verdict only means the exact head is safe to merge if the pipeline's own
              # coverage/gate signals agree. Any of these not in its good state is a hard fail,
              # same semantics as the central gate.
              if [ "${GATE_DECISION:-}" != "PASS" ]; then
                echo "::error::Verdict is SHIP but gate-decision is '${GATE_DECISION:-}', not PASS."
                exit 1
              fi
              if [ "${MERGE_ELIGIBLE:-}" != "true" ]; then
                echo "::error::Verdict is SHIP but merge-eligible is '${MERGE_ELIGIBLE:-}', not true."
                exit 1
              fi
              if [ "${FILES_OMITTED:-0}" != "0" ]; then
                echo "::error::Verdict is SHIP but ${FILES_OMITTED:-0} changed file(s) were omitted from review. The verdict does not cover the full diff."
                exit 1
              fi
              echo "Verdict SHIP with gate-decision PASS, merge-eligible true, and no omitted files."
              ;;
            FIX_FIRST|BLOCK)
              echo "::error::Review verdict is ${VERDICT}. Resolve the findings in the review comment and push a fix."
              exit 1
              ;;
            NO_VERDICT|"")
              echo "::error::Review produced no usable verdict (verdict='${VERDICT}', review-status='${REVIEW_STATUS}'). Treating as blocked rather than passing."
              exit 1
              ;;
            *)
              echo "::error::Unrecognized verdict '${VERDICT}'. Failing closed."
              exit 1
              ;;
          esac

      # Session logs are uploaded rather than committed. Pushing back into the checked-out
      # repository fails on detached PR checkouts and cannot work for a cross-repo target.
      - name: Upload Session Ledger
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: session-ledger-${{ github.event.client_payload.pr_number || github.event.pull_request.number }}
          path: |
            sessions/
            review-comment.md
            ${{ steps.review.outputs.provider-telemetry-path }}
          if-no-files-found: ignore
          retention-days: 14
