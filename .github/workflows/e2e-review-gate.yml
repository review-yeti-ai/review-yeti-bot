name: E2E Review Gate

# API-2902: the live, model-backed release gate. `npm run test:all` (ci-cd.yaml, release.yml) is
# entirely credential-free by design (TEST_INFRA.md's fail-closed cassette-replay boundary) --
# none of it proves the panel still produces a real finding against a REAL provider today. This
# workflow runs scripts/e2e-review-gate.mjs: one `security`-persona review against a fixture diff
# with a known planted P0 (must produce >=1 finding on a completed lane) and one clean fixture
# (must produce 0 findings on a completed lane).
#
# Docs/RELEASING.md documents that the `v1` channel tag must not be advanced (via release.yml's
# `channel=v1` dispatch) unless this workflow is green for the candidate commit. `release.yml`
# calls this workflow directly (`workflow_call`, below) as a hard `needs:` dependency for
# `channel=v1` releases -- see release.yml's `e2e_gate` job. `workflow_dispatch` remains for
# ad hoc manual checks against an arbitrary ref outside a release.
#
# The `schedule` trigger is a credential canary, not a release event. Without it, a dead
# OPENROUTER_API_KEY is only ever discovered at release time, freezing `channel=v1` exactly when
# a release is wanted: measured 2026-08-20, run 32383353332 -- battery green, this gate 401'd,
# "Tag, release, and move channel" skipped, with release-please cutting releases all day against
# a key that had been dead since at least 04:18 UTC (run 32331379188). A twice-weekly scheduled
# run bounds that discovery latency to ~3.5 days and costs two trivial model calls per run.
# Scheduled runs execute against the default branch; a scheduled failure means "rotate the
# secret", never "the release already failed".
on:
  schedule:
    - cron: "17 12 * * 1,4" # Mon/Thu 12:17 UTC; offset avoids the top-of-hour Actions surge
  workflow_dispatch:
    inputs:
      ref:
        description: Commit/tag/branch to check out and gate (defaults to the branch this is dispatched against)
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        description: Commit/tag/branch to check out and gate
        required: true
        type: string
    secrets:
      OPENROUTER_API_KEY:
        required: true

concurrency:
  group: e2e-review-gate-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_PREFER_OFFLINE: "true"

jobs:
  e2e-review-gate:
    name: Live red/green fixture review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      # Confirmed (run 32331379188, 2026-08-20): OPENROUTER_API_KEY is provisioned to Actions in
      # this repository -- the gate step consumed it and reached the provider (HTTP 401, not a
      # "not configured" failure). A missing secret fails closed with an explicit
      # `OPENROUTER_API_KEY is not configured` reason, never a silent pass; an invalid/expired
      # key fails closed too (HTTP 401 from the provider), which is the same correct outcome:
      # this gate must not let `channel=v1` advance while its own credential is broken.
      - name: Run live E2E review gate (red/green fixtures)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.E2E_REVIEW_GATE_MODEL || 'deepseek/deepseek-v4-flash-0731' }}
        run: npm run test:e2e-review-gate
