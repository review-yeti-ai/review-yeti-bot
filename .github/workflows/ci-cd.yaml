name: Test, build, and deploy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ct-review-system-${{ github.ref }}
  cancel-in-progress: true

env:
  CLUSTER_NAME: cluster-ny1
  REGISTRY: registry.digitalocean.com/calltelemetry

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Node Modules & Vitest Results
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            node_modules/.vitest
          key: ${{ runner.os }}-vitest-cache-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vitest-cache-

      - run: npm ci
      
      # This replaces two steps that between them never ran a full suite:
      #
      #   `npm run test:changed || npm run test:unit` — `vitest run --changed=main`
      #   exits 0 when it selects no files ("No test files found, exiting with code
      #   0"), so the `||` fallback never fired and the job reported success having
      #   executed zero tests.
      #
      #   `npm run test:unit && test:integration && test:e2e`, gated on
      #   `github.event_name == 'push'` — unreachable, because this workflow has no
      #   `push:` trigger. Adding one is deliberately left out of this change: the
      #   build-and-deploy job below is gated on the same condition and would start
      #   deploying on every merge.
      - name: Run Full Test Suite
        run: npm test

      - name: Verify TypeScript Build
        run: npm run build

  build-and-deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: blacksmith-2vcpu-ubuntu-2204-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - run: doctl registry login

      - id: bot
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ env.REGISTRY }}/ct-review-bot:${{ github.sha }}
          cache-from: type=gha,mode=max,scope=bot-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=bot-${{ github.ref_name }}

      - id: omniroute
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.omniroute
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ env.REGISTRY }}/ct-review-bot:omniroute-3.8.48-${{ github.sha }}
          cache-from: type=gha,mode=max,scope=omniroute
          cache-to: type=gha,mode=max,scope=omniroute

      - name: Configure cluster and managed runtime secrets
        env:
          GITHUB_APP_ID_VALUE: ${{ secrets.CT_REVIEW_GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY_VALUE: ${{ secrets.CT_REVIEW_GITHUB_APP_PRIVATE_KEY }}
          GITHUB_INSTALLATION_ID_VALUE: ${{ secrets.CT_REVIEW_GITHUB_INSTALLATION_ID }}
          WEBHOOK_SECRET_VALUE: ${{ secrets.CT_REVIEW_WEBHOOK_SECRET }}
          OMNIROUTE_STORAGE_KEY_VALUE: ${{ secrets.CT_REVIEW_OMNIROUTE_STORAGE_KEY }}
          OPENROUTER_API_KEY_VALUE: ${{ secrets.CT_REVIEW_OPENROUTER_API_KEY }}
          OMNIROUTE_API_KEY_VALUE: ${{ secrets.CT_REVIEW_OMNIROUTE_API_KEY }}
        run: |
          set -euo pipefail
          doctl kubernetes cluster kubeconfig save "$CLUSTER_NAME"
          kubectl apply --server-side -f k8s/namespace.yaml
          kubectl -n ct-review-system create secret generic ct-review-bot-runtime \
            --from-literal=GITHUB_APP_ID="$GITHUB_APP_ID_VALUE" \
            --from-literal=GITHUB_APP_PRIVATE_KEY="$GITHUB_APP_PRIVATE_KEY_VALUE" \
            --from-literal=GITHUB_INSTALLATION_ID="$GITHUB_INSTALLATION_ID_VALUE" \
            --from-literal=WEBHOOK_SECRET="$WEBHOOK_SECRET_VALUE" \
            --from-literal=OPENROUTER_API_KEY="$OPENROUTER_API_KEY_VALUE" \
            --dry-run=client -o yaml | kubectl apply --server-side -f -
          kubectl -n ct-review-system create secret generic omniroute-runtime \
            --from-literal=STORAGE_ENCRYPTION_KEY="$OMNIROUTE_STORAGE_KEY_VALUE" \
            --from-literal=OMNIROUTE_API_KEY="$OMNIROUTE_API_KEY_VALUE" \
            --dry-run=client -o yaml | kubectl apply --server-side -f -

      - name: Deploy digest-pinned workloads
        env:
          CT_REVIEW_BOT_IMAGE: ${{ env.REGISTRY }}/ct-review-bot@${{ steps.bot.outputs.digest }}
          OMNIROUTE_IMAGE: ${{ env.REGISTRY }}/ct-review-bot@${{ steps.omniroute.outputs.digest }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext-base
          scripts/deploy-doks.sh
          scripts/verify-doks.sh
