name: Test, build, and deploy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # REL-1074: pull requests run only the tests their change reaches, so the whole suite also runs
  # every night against main, independent of whether anything merged.
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

concurrency:
  # The nightly run gets its own group. Sharing main's would let it replace a main push run that
  # is still pending behind a running one, and that push run is the one that publishes images.
  group: ct-review-system-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  # Cancel superseded runs on branches, never on main. Since releases became unattended
  # (ADR 0513) every merge to main is followed within seconds by a release-please commit, so
  # main's own post-merge validation was routinely cancelled mid-suite. A cancelled required
  # check reads as neither pass nor fail: it is exactly the shape that hides a real failure,
  # and it already did once here -- a genuine red on main was surrounded by cancellations and
  # looked like more of the same. Branch runs keep cancelling; that is free runner time and
  # nothing depends on their history.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # REL-1074. The required `test` check is an aggregator over parallel jobs:
  #
  #   test-plan        decides full vs incremental and which files run (scripts/ci/select-vitest-tests.mjs)
  #   vitest           the selected non-Postgres files, sharded across a matrix
  #   vitest-postgres  the Postgres-backed files and the REL-817 reaper harness, the only job with a DB
  #   worker-helper    scripts/advance-review-worker.test.sh
  #   build            npm run build
  #   test             fails unless every one of those succeeded (or was legitimately not needed)
  #
  # Pull requests run the tests the change reaches from its merge base. Push to main, the nightly
  # schedule and manual dispatch always run the full suite, and so does any PR that touches a
  # global input (lockfile, vitest/tsconfig, setup files, workflows, schemas, ...) or whose change
  # detection fails. The release-please PR already ran the suite, so release commits skip it;
  # typecheck still gates them.
  test-plan:
    if: "(github.event_name != 'pull_request' || github.event.pull_request.draft == false) && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(main): release'))"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      shards: ${{ steps.plan.outputs.shards }}
      shard-count: ${{ steps.plan.outputs.shard-count }}
      tests: ${{ steps.plan.outputs.tests }}
      postgres-tests: ${{ steps.plan.outputs.postgres-tests }}
      exclude-tests: ${{ steps.plan.outputs.exclude-tests }}
      reaper-acceptance: ${{ steps.plan.outputs.reaper-acceptance }}
    steps:
      # Full history, no blobs: enough to compute the merge base and list changed paths.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: ./.github/actions/node-deps

      - id: base
        name: Resolve the pull request merge base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --filter=blob:none origin "$BASE_SHA" "$HEAD_SHA" >/dev/null 2>&1 || true
          if merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"; then
            echo "merge-base=${merge_base}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not compute the merge base of ${BASE_SHA} and ${HEAD_SHA}; running the full suite"
          fi

      - id: plan
        name: Select the test files this run executes
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_BASE: ${{ steps.base.outputs.merge-base }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            node scripts/ci/select-vitest-tests.mjs --full "${EVENT_NAME} always runs the full suite" --out plan.json
          elif [ -z "$MERGE_BASE" ]; then
            node scripts/ci/select-vitest-tests.mjs --full "merge base unavailable" --out plan.json
          elif ! node scripts/ci/select-vitest-tests.mjs --base "$MERGE_BASE" --head "$HEAD_SHA" --out plan.json; then
            echo "::warning::Test selection failed; running the full suite"
            node scripts/ci/select-vitest-tests.mjs --full "test selection failed" --out plan.json
          fi
          node scripts/ci/plan-outputs.mjs plan.json >> "$GITHUB_OUTPUT"
          node scripts/ci/plan-outputs.mjs --summary plan.json >> "$GITHUB_STEP_SUMMARY"

  vitest:
    needs: test-plan
    if: needs.test-plan.outputs.shard-count != '0'
    name: vitest (${{ matrix.shard }}/${{ needs.test-plan.outputs.shard-count }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Headroom for a cold node_modules disk (a lockfile change) on top of a full shard.
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.test-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ./.github/actions/node-deps

      - name: Build the artifacts the suite reads (npm pretest)
        run: npm run test:artifacts

      - name: Run Vitest shard
        env:
          MODE: ${{ needs.test-plan.outputs.mode }}
          TESTS: ${{ needs.test-plan.outputs.tests }}
          EXCLUDE: ${{ needs.test-plan.outputs.exclude-tests }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.test-plan.outputs.shard-count }}
        run: |
          set -euo pipefail
          args=(run "--shard=${SHARD}/${SHARDS}")
          while IFS= read -r file; do args+=(--exclude "$file"); done < <(jq -r '.[]' <<<"$EXCLUDE")
          if [ "$MODE" != "full" ]; then
            while IFS= read -r file; do args+=("$file"); done < <(jq -r '.[]' <<<"$TESTS")
          fi
          npx vitest "${args[@]}"

  vitest-postgres:
    needs: test-plan
    if: needs.test-plan.outputs.postgres-tests != '[]'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      REVIEW_YETI_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ./.github/actions/node-deps

      - name: Build the artifacts the suite reads (npm pretest)
        run: npm run test:artifacts

      - name: Run the Postgres-backed test files
        env:
          TESTS: ${{ needs.test-plan.outputs.postgres-tests }}
        run: |
          set -euo pipefail
          mapfile -t files < <(jq -r '.[]' <<<"$TESTS")
          npx vitest run "${files[@]}"

      - name: Run REL-817 reaper acceptance harness
        if: needs.test-plan.outputs.reaper-acceptance == 'true'
        run: npm run test:acceptance:reaper

  # scripts/advance-review-worker.test.sh guards the only sanctioned writer of
  # the production worker pin, and was never wired into CI -- 88 tests that
  # only ran when someone remembered to. A guard whose tests do not run is a
  # guard nobody is checking. It needs node and jq, not node_modules.
  worker-helper:
    if: "(github.event_name != 'pull_request' || github.event.pull_request.draft == false) && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(main): release'))"
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          check-latest: true
      - name: Run worker-helper guard tests
        run: npm run test:worker-helper

  build:
    if: "(github.event_name != 'pull_request' || github.event.pull_request.draft == false) && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(main): release'))"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ./.github/actions/node-deps

      # Next.js' own content-hashed build cache; a stale entry is a miss, never a wrong build.
      - name: Mount the Next.js build cache
        uses: useblacksmith/stickydisk@94697d49e77d0dd78b77deb85ad3de63a28b4b8a # v1.7.1
        with:
          key: ${{ github.repository }}-next-cache-${{ runner.os }}-${{ runner.arch }}
          path: ./.next/cache
          commit: ${{ github.event_name == 'pull_request' && 'false' || 'on-change' }}

      - name: Verify TypeScript Build
        run: npm run build

  test:
    needs: [test-plan, vitest, vitest-postgres, worker-helper, build]
    if: "always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(main): release'))"
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions: {}
    steps:
      # A skipped shard or Postgres job is only acceptable when the plan said there was nothing
      # for it to run; a failed or cancelled plan can never be read as "nothing to run".
      - name: Require every test job to have passed
        env:
          PLAN: ${{ needs.test-plan.result }}
          MODE: ${{ needs.test-plan.outputs.mode }}
          SHARD_COUNT: ${{ needs.test-plan.outputs.shard-count }}
          POSTGRES_TESTS: ${{ needs.test-plan.outputs.postgres-tests }}
          VITEST: ${{ needs.vitest.result }}
          VITEST_POSTGRES: ${{ needs.vitest-postgres.result }}
          WORKER_HELPER: ${{ needs.worker-helper.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          failed=0
          require() { # name result allowed-results...
            local name="$1" result="$2"; shift 2
            for ok in "$@"; do [ "$result" = "$ok" ] && { echo "ok: ${name}=${result}"; return 0; }; done
            echo "::error::${name} is '${result}', expected one of: $*"; failed=1
          }
          require test-plan "$PLAN" success
          if [ "$PLAN" = success ]; then
            echo "plan mode: ${MODE}"
            if [ "$SHARD_COUNT" = "0" ]; then require vitest "$VITEST" skipped; else require vitest "$VITEST" success; fi
            if [ "$POSTGRES_TESTS" = "[]" ]; then require vitest-postgres "$VITEST_POSTGRES" skipped; else require vitest-postgres "$VITEST_POSTGRES" success; fi
          fi
          require worker-helper "$WORKER_HELPER" success
          require build "$BUILD" success
          exit "$failed"

  typecheck:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # REL-585. `tsconfig.json` stopped excluding `tests/` and `scripts/` (REL-570/REL-573), so
    # `npm run lint:src` (tsc --noEmit) now typechecks the whole tree -- but nothing in CI ran it,
    # so the 464 errors that were burned down to reach that state could silently return unnoticed.
    # `npm run build` does not cover this: it compiles `tsconfig.server.json`, whose `include` is
    # only `src/**/*`. Kept as its own job, not folded into `test`, so a type error is visible at a
    # glance and does not wait on the full suite. Deliberately runs only `lint:src`,
    # not the full `npm run lint`: `lint:tests` is `vitest list` and is documented in
    # scripts/check-test-files-parse.mjs as a local-only gate (~1m48s on CI, close to the full
    # suite's own runtime) that would erase the speed benefit of splitting this out. tsc --noEmit
    # alone is ~20-40s and already covers src, tests, and scripts because tsconfig.json's exclude
    # list no longer touches them.
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ./.github/actions/node-deps

      # REL-1074: incremental program state lives on the node_modules disk (so it is keyed by the
      # same lockfile and TypeScript version). tsc re-checks every file whose content hash changed
      # and everything that depends on it, so a stale file is re-checked, never trusted.
      - name: Typecheck (src, tests, scripts)
        run: npm run lint:src -- --incremental --tsBuildInfoFile node_modules/.cache/tsc/typecheck.tsbuildinfo

  operator-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # REL-896. `k8s-operator/` is a Go module with its own controller tests, but no workflow ever
    # ran them: the only place Go was touched in CI was the `go build` inside Dockerfile.operator,
    # so a reconciler regression could ship with a fully green PR. This job runs vet and the
    # operator tests in the SAME digest-pinned Go image Dockerfile.operator builds the shipped
    # binary with, so CI exercises the toolchain that ships and no separate Go version can drift
    # (tests/unit/ciOperatorTestEnforcement.test.ts pins both the commands and the image match).
    # The controller tests use controller-runtime's fake client: no cluster, no envtest binaries.
    timeout-minutes: 10
    permissions:
      contents: read
    container:
      image: golang:1.24-bookworm@sha256:1a6d4452c65dea36aac2e2d606b01b4a029ec90cc1ae53890540ce6173ea77ac
    defaults:
      run:
        working-directory: k8s-operator
    env:
      GOFLAGS: -buildvcs=false
      GOCACHE: /root/.cache/go-build
      GOMODCACHE: /go/pkg/mod
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      # REL-1074: the build and module caches persist (served by Blacksmith's colocated cache on
      # these runners; a sticky disk cannot be mounted into a job container). Keyed on every Go
      # input, so a TypeScript-only change restores an exact hit and saves nothing. With GOCACHE
      # persisted `go test` reuses a package's result only when its test binary, flags, the env
      # vars it read and the files it opened are all unchanged; checkout gives every file a fresh
      # mtime, so tests that read testdata or CRDs always re-run.
      - name: Restore Go build and module caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            /root/.cache/go-build
            /go/pkg/mod
          key: go-operator-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('k8s-operator/go.sum') }}-${{ hashFiles('k8s-operator/**/*.go', 'k8s-operator/**/testdata/**', 'k8s-operator/go.mod') }}
          restore-keys: |
            go-operator-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('k8s-operator/go.sum') }}-
            go-operator-${{ runner.os }}-${{ runner.arch }}-

      - name: Vet the operator module
        run: go vet ./...

      - name: Test the operator module
        run: go test ./...

  legacy-runtime:
    if: "(github.event_name != 'pull_request' || github.event.pull_request.draft == false) && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(main): release'))"
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          check-latest: true
          cache: npm
          cache-dependency-path: legacy-runtime/package-lock.json

      - name: Install lock-backed legacy graph
        run: npm ci --prefix legacy-runtime --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Verify the Action graph is not the application tree
        run: node scripts/verify-legacy-runtime-graph.mjs legacy-runtime

      - id: base
        name: Resolve reviewed Node base image
        run: |
          set -euo pipefail
          image="$(sed -n 's/^NODE_BASE_IMAGE=//p' .github/worker-image.env | head -n 1)"
          [[ "$image" =~ ^node:24-bookworm-slim@sha256:[a-f0-9]{64}$ ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.legacy-runtime
          load: true
          push: false
          build-args: |
            NODE_BASE_IMAGE=${{ steps.base.outputs.image }}
          tags: review-yeti-legacy-runtime:ci

      - name: Prove the baked image has the two packages and not Next.js
        run: node scripts/verify-legacy-runtime-image.mjs --image review-yeti-legacy-runtime:ci

  # OSS image publish. GHCR only: no Docker Hub, no DigitalOcean registry,
  # and no kubectl/doctl. CallTelemetry's cluster stays disconnected until a
  # later, explicit pull from these digests.
  #
  # cisco-cdr docker-backend-release pattern: native linux/amd64 and
  # native linux/arm64 on matching runners, then imagetools merge.
  # Never qemu. Never platforms: linux/amd64,linux/arm64 on one job.
  # review-yeti-ai has no live Blacksmith pool (2204-arm queued with no
  # runner), so GHCR uses GitHub-hosted ubuntu-latest (amd64) plus
  # ubuntu-24.04-arm. Do not retarget to Blacksmith until this org
  # actually assigns those labels.
  publish-ghcr-arch:
    # Release commits skip test and legacy-runtime. A skipped needed job
    # skips this job too unless the if uses always(), which is why 1.82.0
    # never published. The release PR already ran that suite. Typecheck
    # still has to succeed. Failure or cancellation does not publish.
    needs: [test, legacy-runtime, typecheck]
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.typecheck.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.legacy-runtime.result == 'success' || needs.legacy-runtime.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            # review-yeti-ai's Blacksmith org provisions ARM runners
            # (verified live: runner group 'blacksmith runners …' picked up in
            # ~1.5 min; x86 blacksmith labels stay queued, so amd64 keeps
            # ubuntu-latest).
            runner: blacksmith-2vcpu-ubuntu-2404-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      GHCR_REGISTRY: ghcr.io/review-yeti-ai
      OCI_SOURCE: https://github.com/review-yeti-ai/review-yeti-bot
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        if: matrix.arch == 'amd64'
      # Blacksmith persistent layer cache (docs.blacksmith.sh/blacksmith-caching/docker-builds):
      # bot, worker and legacy-runtime share their npm/base layers, so they share one
      # cache-key. Layer state lives on sticky disks; no cache blobs are exported.
      - name: Set up Blacksmith builder (node-family images)
        if: matrix.arch == 'arm64'
        uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2
        with:
          cache-key: review-yeti-node-images-arm64
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build bot dist for the context-copied image
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -f dist/index.js

      - id: worker-base
        name: Resolve reviewed worker base image
        run: |
          set -euo pipefail
          image="$(sed -n 's/^NODE_BASE_IMAGE=//p' .github/worker-image.env | head -n 1)"
          [[ "$image" =~ ^node:24-bookworm-slim@sha256:[a-f0-9]{64}$ ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - id: worker
        if: matrix.arch == 'amd64'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.worker
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: true
          sbom: true
          build-args: |
            NODE_BASE_IMAGE=${{ steps.worker-base.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ env.OCI_SOURCE }}
            org.opencontainers.image.description=Review Yeti public worker
          tags: |
            ${{ env.GHCR_REGISTRY }}/review-yeti-worker:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,mode=max,scope=ghcr-worker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ghcr-worker-${{ matrix.arch }}
      - id: worker-arm
        if: matrix.arch == 'arm64'
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: Dockerfile.worker
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: true
          sbom: true
          build-args: |
            NODE_BASE_IMAGE=${{ steps.worker-base.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ env.OCI_SOURCE }}
            org.opencontainers.image.description=Review Yeti public worker
          tags: |
            ${{ env.GHCR_REGISTRY }}/review-yeti-worker:${{ github.sha }}-${{ matrix.arch }}
      - id: bot
        if: matrix.arch == 'amd64'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.bot
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: true
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ env.OCI_SOURCE }}
          tags: |
            ${{ env.GHCR_REGISTRY }}/review-yeti-bot:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,mode=max,scope=ghcr-bot-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ghcr-bot-${{ matrix.arch }}
      - id: bot-arm
        if: matrix.arch == 'arm64'
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: Dockerfile.bot
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: true
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ env.OCI_SOURCE }}
          tags: |
            ${{ env.GHCR_REGISTRY }}/review-yeti-bot:${{ github.sha }}-${{ matrix.arch }}
      - id: legacy-runtime
        if: matrix.arch == 'amd64'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.legacy-runtime
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: true
          sbom: true
          build-args: |
            NODE_BASE_IMAGE=${{ steps.worker-base.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ env.OCI_SOURCE }}
          tags: |
            ${{ env.GHCR_REGISTRY }}/review-yeti-legacy-runtime:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,mode=max,scope=ghcr-legacy-runtime-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ghcr-legacy-runtime-${{ matrix.arch }}
      - id: legacy-runtime-arm
        if: matrix.arch == 'arm64'
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: Dockerfile.legacy-runtime
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: true
          sbom: true
          build-args: |
            NODE_BASE_IMAGE=${{ steps.worker-base.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ env.OCI_SOURCE }}
          tags: |
            ${{ env.GHCR_REGISTRY }}/review-yeti-legacy-runtime:${{ github.sha }}-${{ matrix.arch }}
      - id: resolve-digests
        name: Resolve the pushed image digests for either leg
        run: |
          set -euo pipefail
          legacy="${{ steps.legacy-runtime.outputs.digest || steps.legacy-runtime-arm.outputs.digest }}"
          worker="${{ steps.worker.outputs.digest || steps.worker-arm.outputs.digest }}"
          echo "LEGACY_DIGEST=$legacy" >> "$GITHUB_ENV"
          echo "WORKER_DIGEST=$worker" >> "$GITHUB_ENV"
      - name: Prove the published legacy-runtime image
        run: node scripts/verify-legacy-runtime-image.mjs --image ${{ env.GHCR_REGISTRY }}/review-yeti-legacy-runtime@${{ env.LEGACY_DIGEST }}

      - name: Run immutable worker self-test
        env:
          WORKER_IMAGE: ${{ env.GHCR_REGISTRY }}/review-yeti-worker@${{ env.WORKER_DIGEST }}
        run: |
          set -euo pipefail
          [[ "$WORKER_IMAGE" =~ ^${GHCR_REGISTRY}/review-yeti-worker@sha256:[a-f0-9]{64}$ ]]
          docker pull "$WORKER_IMAGE"
          docker run --rm --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            "$WORKER_IMAGE" --self-test

      - name: Set up Blacksmith builder (operator image)
        if: matrix.arch == 'arm64'
        uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2
        with:
          cache-key: review-yeti-operator-arm64
      - id: operator
        if: matrix.arch == 'amd64'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.operator
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: true
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ env.OCI_SOURCE }}
          tags: |
            ${{ env.GHCR_REGISTRY }}/review-yeti-operator:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,mode=max,scope=ghcr-operator-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ghcr-operator-${{ matrix.arch }}
      - id: operator-arm
        if: matrix.arch == 'arm64'
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: Dockerfile.operator
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: true
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ env.OCI_SOURCE }}
          tags: |
            ${{ env.GHCR_REGISTRY }}/review-yeti-operator:${{ github.sha }}-${{ matrix.arch }}

  publish-ghcr:
    needs: [publish-ghcr-arch]
    # Release commits intentionally skip test and legacy-runtime. Even though the
    # native publish job admits those skips with always(), GitHub's implicit
    # success() on this downstream job still sees the skipped ancestors and
    # suppresses the multi-arch merge unless this job also opts into always().
    if: >-
      always() &&
      needs.publish-ghcr-arch.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      GHCR_REGISTRY: ghcr.io/review-yeti-ai
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release version for this commit
        id: version
        run: |
          set -euo pipefail
          subject="$(git log -1 --format=%s)"
          tag="$(node scripts/resolve-release-image-tag.mjs "$subject")"
          if [[ -n "$tag" ]]; then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "Release commit detected; also publishing image tag $tag"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "Not a release commit; publishing SHA and latest tags only"
          fi

      - name: Merge native platform images into public multi-arch indexes
        id: merge
        env:
          BOT: ${{ env.GHCR_REGISTRY }}/review-yeti-bot:${{ github.sha }}
          WORKER: ${{ env.GHCR_REGISTRY }}/review-yeti-worker:${{ github.sha }}
          OPERATOR: ${{ env.GHCR_REGISTRY }}/review-yeti-operator:${{ github.sha }}
          LEGACY: ${{ env.GHCR_REGISTRY }}/review-yeti-legacy-runtime:${{ github.sha }}
        run: |
          set -euo pipefail

          platform_digest() {
            local image="$1"
            local arch="$2"
            docker buildx imagetools inspect --raw "$image" | python3 -c "
          import json, sys
          document = json.load(sys.stdin)
          arch = sys.argv[1]
          manifests = document.get('manifests') or []
          digest = next(
              item['digest']
              for item in manifests
              if item.get('platform', {}).get('os') == 'linux'
              and item.get('platform', {}).get('architecture') == arch
              and item.get('annotations', {}).get('vnd.docker.reference.type') != 'attestation-manifest'
          )
          print(digest)
          " "$arch"
          }

          {
            echo '## Public GHCR images'
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          for pkg in review-yeti-worker review-yeti-bot review-yeti-operator review-yeti-legacy-runtime; do
            amd64_digest="$(platform_digest "${GHCR_REGISTRY}/${pkg}:${GITHUB_SHA}-amd64" amd64)"
            arm64_digest="$(platform_digest "${GHCR_REGISTRY}/${pkg}:${GITHUB_SHA}-arm64" arm64)"
            version_args=()
            if [ -n "${{ steps.version.outputs.tag }}" ]; then
              version_args+=(-t "${GHCR_REGISTRY}/${pkg}:${{ steps.version.outputs.tag }}")
            fi
            docker buildx imagetools create \
              -t "${GHCR_REGISTRY}/${pkg}:${GITHUB_SHA}" \
              -t "${GHCR_REGISTRY}/${pkg}:latest" \
              "${version_args[@]}" \
              "${GHCR_REGISTRY}/${pkg}@${amd64_digest}" \
              "${GHCR_REGISTRY}/${pkg}@${arm64_digest}"
            echo "- \`${GHCR_REGISTRY}/${pkg}:${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
            if [ -n "${{ steps.version.outputs.tag }}" ]; then
              echo "- \`${GHCR_REGISTRY}/${pkg}:${{ steps.version.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          echo "- \`docker pull ghcr.io/review-yeti-ai/review-yeti-worker:latest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Make GHCR packages public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for pkg in review-yeti-worker review-yeti-bot review-yeti-operator review-yeti-legacy-runtime; do
            if gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              "/orgs/review-yeti-ai/packages/container/${pkg}/visibility" \
              -f visibility=public >/dev/null; then
              echo "Set ${pkg} public"
            else
              echo "::warning::Could not set ${pkg} public via API. Set it at https://github.com/orgs/review-yeti-ai/packages/container/${pkg}/settings"
            fi
          done

      - name: Enforce worker image size gates
        env:
          WORKER_IMAGE: ${{ env.GHCR_REGISTRY }}/review-yeti-worker:${{ github.sha }}
          SERVICE_IMAGE: ${{ env.GHCR_REGISTRY }}/review-yeti-bot:${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/verify-worker-image-size.mjs --worker "$WORKER_IMAGE" --service "$SERVICE_IMAGE"


  attest-published-indexes:
    needs: publish-ghcr
    if: >-
      always() &&
      needs.publish-ghcr.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Attest the multi-arch GHCR indexes
        run: |
          set -euo pipefail
          # Production rolls when calltelemetry/ct-infrastructure pins these
          # index digests. This public workflow only proves the indexes exist
          # and contain both platforms. It does not kubectl or doctl.
          index_digest() {
            local pkg="$1"
            local token digest body
            token="$(curl -fsS "https://ghcr.io/token?service=ghcr.io&scope=repository:review-yeti-ai/${pkg}:pull" | jq -er .token)"
            digest="$(curl -fsSI \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json" \
              "https://ghcr.io/v2/review-yeti-ai/${pkg}/manifests/${GITHUB_SHA}" \
              | awk 'tolower($1)=="docker-content-digest:" {gsub(/\r/,"",$2); print $2}' \
              | tail -n 1)"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            body="$(curl -fsS \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json" \
              "https://ghcr.io/v2/review-yeti-ai/${pkg}/manifests/${GITHUB_SHA}")"
            python3 -c '
          import json, sys
          document = json.loads(sys.argv[1])
          arches = {
              item.get("platform", {}).get("architecture")
              for item in document.get("manifests", [])
              if item.get("platform", {}).get("os") == "linux"
              and item.get("annotations", {}).get("vnd.docker.reference.type") != "attestation-manifest"
          }
          missing = {"amd64", "arm64"} - arches
          if missing:
              raise SystemExit("missing platforms: " + ",".join(sorted(missing)))
          ' "$body"
            printf '%s\n' "$digest"
          }
          {
            echo "## Published GHCR indexes"
            echo
            echo "Cluster rollout is the ct-infrastructure review-yeti-image-roll workflow."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for pkg in review-yeti-worker review-yeti-bot review-yeti-operator review-yeti-legacy-runtime; do
            digest="$(index_digest "$pkg")"
            echo "- \`ghcr.io/review-yeti-ai/${pkg}@${digest}\`" >> "$GITHUB_STEP_SUMMARY"
          done
