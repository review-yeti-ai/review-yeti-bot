name: Test, build, and deploy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ct-review-system-${{ github.ref }}
  # Cancel superseded runs on branches, never on main. Since releases became unattended
  # (ADR 0513) every merge to main is followed within seconds by a release-please commit, so
  # main's own post-merge validation was routinely cancelled mid-suite. A cancelled required
  # check reads as neither pass nor fail: it is exactly the shape that hides a real failure,
  # and it already did once here -- a genuine red on main was surrounded by cancellations and
  # looked like more of the same. Branch runs keep cancelling; that is free runner time and
  # nothing depends on their history.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    # The release-please PR already ran the full suite; a release commit only
    # bumps the version and changelog, so re-running the ~10-minute gate on
    # every release commit serialized the 1.81.5/1.81.6/1.81.7 publishes and
    # delayed each tag by a full gate. Typecheck still gates the commit.
    if: "(github.event_name != 'pull_request' || github.event.pull_request.draft == false) && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(main): release'))"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      REVIEW_YETI_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    # Keep required validation bounded alongside the review job; a stalled install or suite must
    # not turn CI into an unbounded review wait. 15 was too tight to be a stall detector: the
    # measured full suite plus `npm run build` runs ~9-13 minutes, so ordinary runs were landing
    # 2 minutes from the cap and two of them (including a post-merge run on main) were killed
    # mid-`npm run build` and reported as `cancelled`. A release-please PR is the worst case,
    # because its version bump rewrites package-lock.json and misses the npm/vitest cache key.
    # 25 keeps a real bound while leaving headroom for a cold cache.
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Node Modules & Vitest Results
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            node_modules
            node_modules/.vitest
          key: ${{ runner.os }}-${{ runner.arch }}-vitest-cache-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-vitest-cache-

      - run: npm ci
      
      # Runs on pull_request, on push to main, and on manual dispatch.
      #
      # History: this replaced `npm run test:changed || npm run test:unit`, which
      # never ran anything — `vitest run --changed=main` exits 0 when it selects no
      # files, so the `||` fallback never fired and the job reported success having
      # executed zero tests (#234). Its sibling step was gated on
      # `github.event_name == 'push'` while the workflow had no `push:` trigger, so
      # main was never verified after merge either. The trigger is added here.
      # Cluster rollout is not this workflow: Flux owns the pins in
      # calltelemetry/ct-infrastructure, and a kubectl apply from this public
      # repo cannot move them.
      - name: Run Full Test Suite
        run: npm test

      - name: Run REL-817 reaper acceptance harness
        run: npm run test:acceptance:reaper

      # scripts/advance-review-worker.test.sh guards the only sanctioned writer of
      # the production worker pin, and was never wired into CI -- 88 tests that
      # only ran when someone remembered to. A guard whose tests do not run is a
      # guard nobody is checking.
      - name: Run worker-helper guard tests
        run: npm run test:worker-helper

      - name: Verify TypeScript Build
        run: npm run build

  typecheck:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # REL-585. `tsconfig.json` stopped excluding `tests/` and `scripts/` (REL-570/REL-573), so
    # `npm run lint:src` (tsc --noEmit) now typechecks the whole tree -- but nothing in CI ran it,
    # so the 464 errors that were burned down to reach that state could silently return unnoticed.
    # `npm run build` does not cover this: it compiles `tsconfig.server.json`, whose `include` is
    # only `src/**/*`. Kept as its own job, not folded into `test`, so a type error is visible at a
    # glance and does not wait on the ~9-13 minute full suite. Deliberately runs only `lint:src`,
    # not the full `npm run lint`: `lint:tests` is `vitest list` and is documented in
    # scripts/check-test-files-parse.mjs as a local-only gate (~1m48s on CI, close to the full
    # suite's own runtime) that would erase the speed benefit of splitting this out. tsc --noEmit
    # alone is ~20-40s and already covers src, tests, and scripts because tsconfig.json's exclude
    # list no longer touches them.
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Node Modules & Vitest Results
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            node_modules
            node_modules/.vitest
          key: ${{ runner.os }}-${{ runner.arch }}-vitest-cache-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-vitest-cache-

      - run: npm ci

      - name: Typecheck (src, tests, scripts)
        run: npm run lint:src

  operator-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # REL-896. `k8s-operator/` is a Go module with its own controller tests, but no workflow ever
    # ran them: the only place Go was touched in CI was the `go build` inside Dockerfile.operator,
    # so a reconciler regression could ship with a fully green PR. This job runs vet and the
    # operator tests in the SAME digest-pinned Go image Dockerfile.operator builds the shipped
    # binary with, so CI exercises the toolchain that ships and no separate Go version can drift
    # (tests/unit/ciOperatorTestEnforcement.test.ts pins both the commands and the image match).
    # The controller tests use controller-runtime's fake client: no cluster, no envtest binaries.
    timeout-minutes: 10
    permissions:
      contents: read
    container:
      image: golang:1.24-bookworm@sha256:1a6d4452c65dea36aac2e2d606b01b4a029ec90cc1ae53890540ce6173ea77ac
    defaults:
      run:
        working-directory: k8s-operator
    env:
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Vet the operator module
        run: go vet ./...

      - name: Test the operator module
        run: go test -count=1 ./...

  legacy-runtime:
    if: "(github.event_name != 'pull_request' || github.event.pull_request.draft == false) && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(main): release'))"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: legacy-runtime/package-lock.json

      - name: Install lock-backed legacy graph
        run: npm ci --prefix legacy-runtime --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Verify the Action graph is not the application tree
        run: node scripts/verify-legacy-runtime-graph.mjs legacy-runtime

      - id: base
        name: Resolve reviewed Node base image
        run: |
          set -euo pipefail
          image="$(sed -n 's/^NODE_BASE_IMAGE=//p' .github/worker-image.env | head -n 1)"
          [[ "$image" =~ ^node:24-bookworm-slim@sha256:[a-f0-9]{64}$ ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.legacy-runtime
          load: true
          push: false
          build-args: |
            NODE_BASE_IMAGE=${{ steps.base.outputs.image }}
          tags: review-yeti-legacy-runtime:ci

      - name: Prove the baked image has the two packages and not Next.js
        run: node scripts/verify-legacy-runtime-image.mjs --image review-yeti-legacy-runtime:ci

  # OSS image publish. GHCR only: no Docker Hub, no DigitalOcean registry,
  # and no kubectl/doctl. CallTelemetry's cluster stays disconnected until a
  # later, explicit pull from these digests.
  #
  # cisco-cdr docker-backend-release pattern: native linux/amd64 and
  # native linux/arm64 on matching runners, then imagetools merge.
  # Never qemu. Never platforms: linux/amd64,linux/arm64 on one job.
  # review-yeti-ai has no live Blacksmith pool (2204-arm queued with no
  # runner), so GHCR uses GitHub-hosted ubuntu-latest (amd64) plus
  # ubuntu-24.04-arm. Do not retarget to Blacksmith until this org
  # actually assigns those labels.
  publish-ghcr-arch:
    # Release commits skip test and legacy-runtime. A skipped needed job
    # skips this job too unless the if uses always(), which is why 1.82.0
    # never published. The release PR already ran that suite. Typecheck
    # still has to succeed. Failure or cancellation does not publish.
    needs: [test, legacy-runtime, typecheck]
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.typecheck.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.legacy-runtime.result == 'success' || needs.legacy-runtime.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            # review-yeti-ai's Blacksmith org provisions ARM runners
            # (verified live: runner group 'blacksmith runners …' picked up in
            # ~1.5 min; x86 blacksmith labels stay queued, so amd64 keeps
            # ubuntu-latest).
            runner: blacksmith-4vcpu-ubuntu-2404-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      GHCR_REGISTRY: ghcr.io/review-yeti-ai
      OCI_SOURCE: https://github.com/review-yeti-ai/review-yeti-bot
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        if: matrix.arch == 'amd64'
      # Blacksmith persistent layer cache (docs.blacksmith.sh/blacksmith-caching/docker-builds):
      # bot, worker and legacy-runtime share their npm/base layers, so they share one
      # cache-key. Layer state lives on sticky disks; no cache blobs are exported.
      - name: Set up Blacksmith builder (node-family images)
        if: matrix.arch == 'arm64'
        uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: review-yeti-node-images-arm64
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build bot dist for the context-copied image
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -f dist/index.js

      - id: worker-base
        name: Resolve reviewed worker base image
        run: |
          set -euo pipefail
          image="$(sed -n 's/^NODE_BASE_IMAGE=//p' .github/worker-image.env | head -n 1)"
          [[ "$image" =~ ^node:24-bookworm-slim@sha256:[a-f0-9]{64}$ ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - id: worker
        if: matrix.arch == 'amd64'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.worker
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: true
          sbom: true
          build-args: |
            NODE_BASE_IMAGE=${{ steps.worker-base.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ env.OCI_SOURCE }}
            org.opencontainers.image.description=Review Yeti public worker
          tags: |
            ${{ env.GHCR_REGISTRY }}/review-yeti-worker:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,mode=max,scope=ghcr-worker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ghcr-worker-${{ matrix.arch }}
      - id: worker-arm
        if: matrix.arch == 'arm64'
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: Dockerfile.worker
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: true
          sbom: true
          build-args: |
            NODE_BASE_IMAGE=${{ steps.worker-base.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ env.OCI_SOURCE }}
            org.opencontainers.image.description=Review Yeti public worker
          tags: |
            ${{ env.GHCR_REGISTRY }}/review-yeti-worker:${{ github.sha }}-${{ matrix.arch }}
      - id: bot
        if: matrix.arch == 'amd64'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.bot
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: true
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ env.OCI_SOURCE }}
          tags: |
            ${{ env.GHCR_REGISTRY }}/review-yeti-bot:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,mode=max,scope=ghcr-bot-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ghcr-bot-${{ matrix.arch }}
      - id: bot-arm
        if: matrix.arch == 'arm64'
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: Dockerfile.bot
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: true
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ env.OCI_SOURCE }}
          tags: |
            ${{ env.GHCR_REGISTRY }}/review-yeti-bot:${{ github.sha }}-${{ matrix.arch }}
      - id: legacy-runtime
        if: matrix.arch == 'amd64'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.legacy-runtime
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: true
          sbom: true
          build-args: |
            NODE_BASE_IMAGE=${{ steps.worker-base.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ env.OCI_SOURCE }}
          tags: |
            ${{ env.GHCR_REGISTRY }}/review-yeti-legacy-runtime:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,mode=max,scope=ghcr-legacy-runtime-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ghcr-legacy-runtime-${{ matrix.arch }}
      - id: legacy-runtime-arm
        if: matrix.arch == 'arm64'
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: Dockerfile.legacy-runtime
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: true
          sbom: true
          build-args: |
            NODE_BASE_IMAGE=${{ steps.worker-base.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ env.OCI_SOURCE }}
          tags: |
            ${{ env.GHCR_REGISTRY }}/review-yeti-legacy-runtime:${{ github.sha }}-${{ matrix.arch }}
      - id: resolve-digests
        name: Resolve the pushed image digests for either leg
        run: |
          set -euo pipefail
          legacy="${{ steps.legacy-runtime.outputs.digest || steps.legacy-runtime-arm.outputs.digest }}"
          worker="${{ steps.worker.outputs.digest || steps.worker-arm.outputs.digest }}"
          echo "LEGACY_DIGEST=$legacy" >> "$GITHUB_ENV"
          echo "WORKER_DIGEST=$worker" >> "$GITHUB_ENV"
      - name: Prove the published legacy-runtime image
        run: node scripts/verify-legacy-runtime-image.mjs --image ${{ env.GHCR_REGISTRY }}/review-yeti-legacy-runtime@${{ env.LEGACY_DIGEST }}

      - name: Run immutable worker self-test
        env:
          WORKER_IMAGE: ${{ env.GHCR_REGISTRY }}/review-yeti-worker@${{ env.WORKER_DIGEST }}
        run: |
          set -euo pipefail
          [[ "$WORKER_IMAGE" =~ ^${GHCR_REGISTRY}/review-yeti-worker@sha256:[a-f0-9]{64}$ ]]
          docker pull "$WORKER_IMAGE"
          docker run --rm --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            "$WORKER_IMAGE" --self-test

      - name: Set up Blacksmith builder (operator image)
        if: matrix.arch == 'arm64'
        uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: review-yeti-operator-arm64
      - id: operator
        if: matrix.arch == 'amd64'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.operator
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: true
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ env.OCI_SOURCE }}
          tags: |
            ${{ env.GHCR_REGISTRY }}/review-yeti-operator:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,mode=max,scope=ghcr-operator-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ghcr-operator-${{ matrix.arch }}
      - id: operator-arm
        if: matrix.arch == 'arm64'
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: Dockerfile.operator
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: true
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ env.OCI_SOURCE }}
          tags: |
            ${{ env.GHCR_REGISTRY }}/review-yeti-operator:${{ github.sha }}-${{ matrix.arch }}

  publish-ghcr:
    needs: [publish-ghcr-arch]
    # Release commits intentionally skip test and legacy-runtime. Even though the
    # native publish job admits those skips with always(), GitHub's implicit
    # success() on this downstream job still sees the skipped ancestors and
    # suppresses the multi-arch merge unless this job also opts into always().
    if: >-
      always() &&
      needs.publish-ghcr-arch.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      GHCR_REGISTRY: ghcr.io/review-yeti-ai
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release version for this commit
        id: version
        run: |
          set -euo pipefail
          subject="$(git log -1 --format=%s)"
          if [[ "$subject" =~ ^chore\(main\):\ release\ ([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "tag=v${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "Release commit detected; also publishing image tag v${BASH_REMATCH[1]}"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "Not a release commit; publishing SHA and latest tags only"
          fi

      - name: Merge native platform images into public multi-arch indexes
        id: merge
        env:
          BOT: ${{ env.GHCR_REGISTRY }}/review-yeti-bot:${{ github.sha }}
          WORKER: ${{ env.GHCR_REGISTRY }}/review-yeti-worker:${{ github.sha }}
          OPERATOR: ${{ env.GHCR_REGISTRY }}/review-yeti-operator:${{ github.sha }}
          LEGACY: ${{ env.GHCR_REGISTRY }}/review-yeti-legacy-runtime:${{ github.sha }}
        run: |
          set -euo pipefail

          platform_digest() {
            local image="$1"
            local arch="$2"
            docker buildx imagetools inspect --raw "$image" | python3 -c "
          import json, sys
          document = json.load(sys.stdin)
          arch = sys.argv[1]
          manifests = document.get('manifests') or []
          digest = next(
              item['digest']
              for item in manifests
              if item.get('platform', {}).get('os') == 'linux'
              and item.get('platform', {}).get('architecture') == arch
              and item.get('annotations', {}).get('vnd.docker.reference.type') != 'attestation-manifest'
          )
          print(digest)
          " "$arch"
          }

          {
            echo '## Public GHCR images'
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          for pkg in review-yeti-worker review-yeti-bot review-yeti-operator review-yeti-legacy-runtime; do
            amd64_digest="$(platform_digest "${GHCR_REGISTRY}/${pkg}:${GITHUB_SHA}-amd64" amd64)"
            arm64_digest="$(platform_digest "${GHCR_REGISTRY}/${pkg}:${GITHUB_SHA}-arm64" arm64)"
            version_args=()
            if [ -n "${{ steps.version.outputs.tag }}" ]; then
              version_args+=(-t "${GHCR_REGISTRY}/${pkg}:${{ steps.version.outputs.tag }}")
            fi
            docker buildx imagetools create \
              -t "${GHCR_REGISTRY}/${pkg}:${GITHUB_SHA}" \
              -t "${GHCR_REGISTRY}/${pkg}:latest" \
              "${version_args[@]}" \
              "${GHCR_REGISTRY}/${pkg}@${amd64_digest}" \
              "${GHCR_REGISTRY}/${pkg}@${arm64_digest}"
            echo "- \`${GHCR_REGISTRY}/${pkg}:${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
            if [ -n "${{ steps.version.outputs.tag }}" ]; then
              echo "- \`${GHCR_REGISTRY}/${pkg}:${{ steps.version.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          echo "- \`docker pull ghcr.io/review-yeti-ai/review-yeti-worker:latest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Make GHCR packages public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for pkg in review-yeti-worker review-yeti-bot review-yeti-operator review-yeti-legacy-runtime; do
            if gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              "/orgs/review-yeti-ai/packages/container/${pkg}/visibility" \
              -f visibility=public >/dev/null; then
              echo "Set ${pkg} public"
            else
              echo "::warning::Could not set ${pkg} public via API. Set it at https://github.com/orgs/review-yeti-ai/packages/container/${pkg}/settings"
            fi
          done

      - name: Enforce worker image size gates
        env:
          WORKER_IMAGE: ${{ env.GHCR_REGISTRY }}/review-yeti-worker:${{ github.sha }}
          SERVICE_IMAGE: ${{ env.GHCR_REGISTRY }}/review-yeti-bot:${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/verify-worker-image-size.mjs --worker "$WORKER_IMAGE" --service "$SERVICE_IMAGE"


  attest-published-indexes:
    needs: publish-ghcr
    if: >-
      always() &&
      needs.publish-ghcr.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Attest the multi-arch GHCR indexes
        run: |
          set -euo pipefail
          # Production rolls when calltelemetry/ct-infrastructure pins these
          # index digests. This public workflow only proves the indexes exist
          # and contain both platforms. It does not kubectl or doctl.
          index_digest() {
            local pkg="$1"
            local token digest body
            token="$(curl -fsS "https://ghcr.io/token?service=ghcr.io&scope=repository:review-yeti-ai/${pkg}:pull" | jq -er .token)"
            digest="$(curl -fsSI \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json" \
              "https://ghcr.io/v2/review-yeti-ai/${pkg}/manifests/${GITHUB_SHA}" \
              | awk 'tolower($1)=="docker-content-digest:" {gsub(/\r/,"",$2); print $2}' \
              | tail -n 1)"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            body="$(curl -fsS \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json" \
              "https://ghcr.io/v2/review-yeti-ai/${pkg}/manifests/${GITHUB_SHA}")"
            python3 -c '
          import json, sys
          document = json.loads(sys.argv[1])
          arches = {
              item.get("platform", {}).get("architecture")
              for item in document.get("manifests", [])
              if item.get("platform", {}).get("os") == "linux"
              and item.get("annotations", {}).get("vnd.docker.reference.type") != "attestation-manifest"
          }
          missing = {"amd64", "arm64"} - arches
          if missing:
              raise SystemExit("missing platforms: " + ",".join(sorted(missing)))
          ' "$body"
            printf '%s\n' "$digest"
          }
          {
            echo "## Published GHCR indexes"
            echo
            echo "Cluster rollout is the ct-infrastructure review-yeti-image-roll workflow."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for pkg in review-yeti-worker review-yeti-bot review-yeti-operator review-yeti-legacy-runtime; do
            digest="$(index_digest "$pkg")"
            echo "- \`ghcr.io/review-yeti-ai/${pkg}@${digest}\`" >> "$GITHUB_STEP_SUMMARY"
          done
