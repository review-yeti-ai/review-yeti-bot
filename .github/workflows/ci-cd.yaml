name: Test, build, and deploy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Also build and deploy to the cluster (main only)"
        type: boolean
        default: false

concurrency:
  group: ct-review-system-${{ github.ref }}
  cancel-in-progress: true

env:
  CLUSTER_NAME: cluster-ny1
  REGISTRY: registry.digitalocean.com/calltelemetry

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Keep required validation bounded alongside the review job; a stalled install or suite must
    # not turn CI into an unbounded review wait.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Node Modules & Vitest Results
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            node_modules
            node_modules/.vitest
          key: ${{ runner.os }}-vitest-cache-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vitest-cache-

      - run: npm ci
      
      # Runs on pull_request, on push to main, and on manual dispatch.
      #
      # History: this replaced `npm run test:changed || npm run test:unit`, which
      # never ran anything — `vitest run --changed=main` exits 0 when it selects no
      # files, so the `||` fallback never fired and the job reported success having
      # executed zero tests (#234). Its sibling step was gated on
      # `github.event_name == 'push'` while the workflow had no `push:` trigger, so
      # main was never verified after merge either. The trigger is added here, and
      # build-and-deploy is re-gated below so that adding it does not silently start
      # deploying on every merge.
      - name: Run Full Test Suite
        run: npm test

      - name: Verify TypeScript Build
        run: npm run build

  build-and-deploy:
    needs: test
    # Deploy is opt-in, never automatic. This job has never run: it was gated on
    # `push` while the workflow had no `push:` trigger. Now that push to main runs
    # the suite, an unchanged condition would have started deploying on every merge.
    # Requiring an explicit dispatch input keeps deploy exactly as manual as it has
    # been in practice, while making it reachable on purpose rather than dead code.
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    runs-on: blacksmith-2vcpu-ubuntu-2204-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - run: doctl registry login

      - id: bot
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856 # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ env.REGISTRY }}/ct-review-bot:${{ github.sha }}
          cache-from: type=gha,mode=max,scope=bot-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=bot-${{ github.ref_name }}

      - id: worker-base
        name: Resolve reviewed worker base image
        run: |
          set -euo pipefail
          image="$(sed -n 's/^NODE_BASE_IMAGE=//p' .github/worker-image.env | head -n 1)"
          [[ "$image" =~ ^node:24-bookworm-slim@sha256:[a-f0-9]{64}$ ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - id: worker
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856 # v7.3.0
        with:
          context: .
          file: Dockerfile.worker
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          build-args: |
            NODE_BASE_IMAGE=${{ steps.worker-base.outputs.image }}
          tags: ${{ env.REGISTRY }}/review-yeti-worker:${{ github.sha }}
          cache-from: type=gha,mode=max,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Run immutable worker self-test
        env:
          WORKER_IMAGE: ${{ env.REGISTRY }}/review-yeti-worker@${{ steps.worker.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$WORKER_IMAGE" =~ ^${REGISTRY}/review-yeti-worker@sha256:[a-f0-9]{64}$ ]]
          docker pull "$WORKER_IMAGE"
          docker run --platform linux/amd64 --rm --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            "$WORKER_IMAGE" --self-test

      - name: Enforce worker image size gates
        env:
          WORKER_IMAGE: ${{ env.REGISTRY }}/review-yeti-worker@${{ steps.worker.outputs.digest }}
          SERVICE_IMAGE: ${{ env.REGISTRY }}/ct-review-bot@${{ steps.bot.outputs.digest }}
        run: |
          set -euo pipefail
          node scripts/verify-worker-image-size.mjs --worker "$WORKER_IMAGE" --service "$SERVICE_IMAGE"

      - id: omniroute
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856 # v7.3.0
        with:
          context: .
          file: Dockerfile.omniroute
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ env.REGISTRY }}/ct-review-bot:omniroute-3.8.48-${{ github.sha }}
          cache-from: type=gha,mode=max,scope=omniroute
          cache-to: type=gha,mode=max,scope=omniroute

      - name: Configure cluster and managed runtime secrets
        env:
          GITHUB_APP_ID_VALUE: ${{ secrets.CT_REVIEW_GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY_VALUE: ${{ secrets.CT_REVIEW_GITHUB_APP_PRIVATE_KEY }}
          GITHUB_INSTALLATION_ID_VALUE: ${{ secrets.CT_REVIEW_GITHUB_INSTALLATION_ID }}
          WEBHOOK_SECRET_VALUE: ${{ secrets.CT_REVIEW_WEBHOOK_SECRET }}
          OMNIROUTE_STORAGE_KEY_VALUE: ${{ secrets.CT_REVIEW_OMNIROUTE_STORAGE_KEY }}
          OPENROUTER_API_KEY_VALUE: ${{ secrets.CT_REVIEW_OPENROUTER_API_KEY }}
          OMNIROUTE_API_KEY_VALUE: ${{ secrets.CT_REVIEW_OMNIROUTE_API_KEY }}
        run: |
          set -euo pipefail
          doctl kubernetes cluster kubeconfig save "$CLUSTER_NAME"
          kubectl apply --server-side -f k8s/namespace.yaml
          kubectl -n ct-review-system create secret generic ct-review-bot-runtime \
            --from-literal=GITHUB_APP_ID="$GITHUB_APP_ID_VALUE" \
            --from-literal=GITHUB_APP_PRIVATE_KEY="$GITHUB_APP_PRIVATE_KEY_VALUE" \
            --from-literal=GITHUB_INSTALLATION_ID="$GITHUB_INSTALLATION_ID_VALUE" \
            --from-literal=WEBHOOK_SECRET="$WEBHOOK_SECRET_VALUE" \
            --from-literal=OPENROUTER_API_KEY="$OPENROUTER_API_KEY_VALUE" \
            --dry-run=client -o yaml | kubectl apply --server-side -f -
          kubectl -n ct-review-system create secret generic omniroute-runtime \
            --from-literal=STORAGE_ENCRYPTION_KEY="$OMNIROUTE_STORAGE_KEY_VALUE" \
            --from-literal=OMNIROUTE_API_KEY="$OMNIROUTE_API_KEY_VALUE" \
            --dry-run=client -o yaml | kubectl apply --server-side -f -

      - name: Deploy digest-pinned workloads
        env:
          CT_REVIEW_BOT_IMAGE: ${{ env.REGISTRY }}/ct-review-bot@${{ steps.bot.outputs.digest }}
          OMNIROUTE_IMAGE: ${{ env.REGISTRY }}/ct-review-bot@${{ steps.omniroute.outputs.digest }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext-base
          scripts/deploy-doks.sh
          scripts/verify-doks.sh
