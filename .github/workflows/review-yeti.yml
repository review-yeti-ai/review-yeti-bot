name: exampleorg Review Yeti

on:
  workflow_call: {}

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: exampleorg-review-yeti-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review Yeti
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 40
    env:
      REVIEW_REPOSITORY: ${{ github.repository }}
      REVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
      EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # Same-repository central PRs run the immutable PR-head policy so a policy change is
      # actually exercised. Fork PRs stay on trusted main to avoid executing fork code with
      # inherited provider secrets. Consumer repositories always run the promoted v1 line.
      CENTRAL_REF: ${{ github.repository == 'exampleorg/example-review-actions' && 'main' || 'v1' }}
    steps:
      - name: Checkout central workflow tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: exampleorg/example-review-actions
          ref: ${{ github.repository == 'exampleorg/example-review-actions' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha || github.repository == 'exampleorg/example-review-actions' && 'main' || 'v1' }}
          path: .exampleorg-review-actions
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
          persist-credentials: false
          fetch-depth: 1

      - name: Validate immutable caller pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: .exampleorg-review-actions/scripts/validate-caller-workflow.sh

      - name: Validate immutable review request
        env:
          GH_TOKEN: ${{ github.token }}
        run: .exampleorg-review-actions/scripts/validate-review-request.sh

      - name: Load central Review Yeti policy
        id: policy
        working-directory: .exampleorg-review-actions
        run: node scripts/emit-policy.mjs

      - name: Validate encoded transport handoff
        id: transport_handoff
        working-directory: .exampleorg-review-actions
        env:
          TRANSPORT_PLAN_B64: ${{ steps.policy.outputs.transport_plan_b64 }}
        run: node scripts/validate-transport-handoff.mjs

      - name: Smoke-test Review Yeti transports
        id: smoke
        working-directory: .exampleorg-review-actions
        env:
          FIREWORKS_PR_REVIEW_API_KEY: ${{ secrets.FIREWORKS_PR_REVIEW_API_KEY }}
          OLLAMA_PR_REVIEW_API_KEY: ${{ secrets.OLLAMA_PR_REVIEW_API_KEY }}
          OPENROUTER_PR_REVIEW_API_KEY: ${{ secrets.OPENROUTER_REVIEW_FLEET_KEY }}
          REVIEW_YETI_SMOKE_TIMEOUT_MS: 30000
        run: |
          echo "stream=${{ steps.policy.outputs.openrouter_stream }} ttft_ms=${{ steps.policy.outputs.openrouter_ttft_ms }} timeout_ms=${{ steps.policy.outputs.openrouter_timeout_ms }}"
          node scripts/review-yeti-smoke.mjs

      - name: Validate admitted transport handoff
        working-directory: .exampleorg-review-actions
        env:
          TRANSPORT_PLAN_B64: ${{ steps.smoke.outputs.healthy_transport_plan_b64 }}
          ALLOW_POLICY_SUBSET: 'true'
        run: node scripts/validate-transport-handoff.mjs

      - name: Resolve Review Yeti release channel
        id: resolved
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_YETI_REPOSITORY: ${{ steps.policy.outputs.repository }}
          REVIEW_YETI_ACTION_CHANNEL: ${{ steps.policy.outputs.action_ref }}
        run: .exampleorg-review-actions/scripts/resolve-release-channel.sh

      - name: Fetch Review Yeti action at resolved commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: ${{ steps.policy.outputs.repository }}
          ref: ${{ steps.resolved.outputs.sha }}
          path: .review-yeti-bot
          persist-credentials: false
          fetch-depth: 1

      - name: Validate Review Yeti release provenance
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_YETI_REPOSITORY: ${{ steps.policy.outputs.repository }}
          REVIEW_YETI_ACTION_CHANNEL: ${{ steps.policy.outputs.action_ref }}
          RESOLVED_SHA: ${{ steps.resolved.outputs.sha }}
          RESOLVED_REF_SHA: ${{ steps.resolved.outputs.ref_sha }}
        run: .exampleorg-review-actions/scripts/validate-release-provenance.sh

      # Preflight admission (QA-380): the smoke step proves which transports are healthy before
      # any persona runs. The highest-priority healthy transport seeds the panel, and the action
      # receives only the healthy subset in configured order for per-lane failover. This prevents
      # every lane from rediscovering the same known provider failure while retaining automatic
      # failover among the transports that passed the real request shape. Zero healthy transports
      # still hard-fails before this step.
      - name: Run Review Yeti review panel
        id: review
        uses: ./.review-yeti-bot
        env:
          FIREWORKS_PR_REVIEW_API_KEY: ${{ secrets.FIREWORKS_PR_REVIEW_API_KEY }}
          OLLAMA_PR_REVIEW_API_KEY: ${{ secrets.OLLAMA_PR_REVIEW_API_KEY }}
          OPENROUTER_PR_REVIEW_API_KEY: ${{ secrets.OPENROUTER_REVIEW_FLEET_KEY }}
          OPENROUTER_API_KEY: ${{ steps.smoke.outputs.resolved_transport == 'openrouter-fallback' && secrets.OPENROUTER_REVIEW_FLEET_KEY || steps.smoke.outputs.resolved_transport == 'ollama' && secrets.OLLAMA_PR_REVIEW_API_KEY || secrets.FIREWORKS_PR_REVIEW_API_KEY }}
        with:
          github-token: ${{ github.token }}
          repo: ${{ github.repository }}
          pr-number: ${{ github.event.pull_request.number }}
          llm-api-key: ${{ secrets.OPENROUTER_REVIEW_FLEET_KEY }}
          llm-base-url: https://openrouter.ai/api/v1
          action-sha: ${{ steps.resolved.outputs.sha }}
          model: openrouter/auto
          transports: ${{ steps.smoke.outputs.healthy_transports }}
          transport-plan-b64: ${{ steps.smoke.outputs.healthy_transport_plan_b64 }}
          openrouter-data-collection: ${{ steps.policy.outputs.openrouter_data_collection }}
          max-diff-chars: ${{ steps.policy.outputs.max_diff_chars }}
          personas: ${{ steps.policy.outputs.personas }}
          # Library-documentation evidence tool (review-yeti-bot#101). The
          # action forwards this to CONTEXT7_API_KEY in the panel env; the
          # model never sees the key and cannot control the request target —
          # it supplies only a library name and topic, and the URL is built
          # server-side. Absent secret degrades the tool to unavailable
          # rather than failing the review.
          context7-api-key: ${{ secrets.CONTEXT7_API_KEY }}

      # Loud, not silent: a degraded run must be visibly degraded on the PR, not just in Action
      # logs an operator has to go dig for.
      - name: Annotate degraded transport
        if: steps.smoke.outputs.resolved_degraded == 'true'
        run: |
          echo "::warning::Review Yeti ran this review on the fallback transport (${{ steps.smoke.outputs.resolved_transport }}); the primary transport was unhealthy."
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            echo "> ⚠️ Review Yeti ran on fallback transport **${{ steps.smoke.outputs.resolved_transport }}** this run (primary unhealthy)." >> "$GITHUB_STEP_SUMMARY"
          fi

      # The bot already writes per-lane telemetry (turnCount, failureClass,
      # resolved transport) to RUNNER_TEMP and exposes run-report-path, but
      # nothing consumed it — so the calls-per-lane distribution had to be
      # reconstructed by hand from PR-comment "Turns:" lines. That
      # distribution is what should size lane_call_budget; without it the
      # budget gets hand-picked, which is how it drifted out of step with
      # max_investigation_turns. Upload it so the number can be derived.
      - name: Upload Review Yeti run report
        if: always() && steps.review.outputs.run-report-path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review-yeti-run-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.review.outputs.run-report-path }}
          if-no-files-found: ignore
          retention-days: 14

      - name: Enforce exact-head Review Yeti verdict
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_STATUS: ${{ steps.review.outputs.review-status }}
          GATE_DECISION: ${{ steps.review.outputs.gate-decision }}
          MERGE_ELIGIBLE: ${{ steps.review.outputs.merge-eligible }}
          FILES_OMITTED: ${{ steps.review.outputs.files-omitted }}
          DISPATCH_REFLECTION_STATUS: ${{ steps.review.outputs.review-dispatch-reflection-status }}
          PROVIDER_RECEIPT_DIGEST: ${{ steps.review.outputs.review-dispatch-provider-receipt-digest }}
          RUN_REPORT_PATH: ${{ steps.review.outputs.run-report-path }}
        run: .exampleorg-review-actions/scripts/check-review-verdict.sh
