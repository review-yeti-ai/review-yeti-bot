name: exampleorg Review Yeti

on:
  workflow_call:
    inputs:
      central_execution:
        description: Run from the validated example-review-actions repository_dispatch boundary.
        required: false
        default: false
        type: boolean
      repository:
        required: false
        default: ''
        type: string
      pr_number:
        required: false
        default: 0
        type: number
      base_sha:
        required: false
        default: ''
        type: string
      head_sha:
        required: false
        default: ''
        type: string
      request_id:
        required: false
        default: ''
        type: string
      refresh_requested:
        description: Explicit same-head retry requested by review-yeti/refresh.
        required: false
        default: false
        type: boolean
      expected_generation:
        description: Exact worker generation admitted by the central check ledger.
        required: false
        default: 1
        type: number
      passthrough:
        description: Deliver SKIPPED passthrough semantics without LLM evaluation; DOKS remains blocked.
        required: false
        default: false
        type: boolean
      execution_backend:
        description: Review execution backend (local or doks).
        required: false
        default: ''
        type: string
      skills:
        description: Optional passthrough custom reviewer skills (JSON array or string).
        required: false
        default: ''
        type: string
      knowledge:
        description: Optional passthrough domain knowledge references (JSON array/object or string).
        required: false
        default: ''
        type: string
      metrics:
        description: Optional passthrough metrics/telemetry configuration (JSON object or string).
        required: false
        default: ''
        type: string
      retry_analysis:
        description: Optional passthrough retry and failure analysis policy (JSON object or string).
        required: false
        default: ''
        type: string
      policy_json:
        description: Optional raw JSON string of policy overrides passed to DOKS dispatch.
        required: false
        default: ''
        type: string
    secrets:
      CT_REVIEW_BOT_APP_ID:
        description: GitHub App id used for target validation and check publication.
        required: true
      CT_REVIEW_BOT_APP_PRIVATE_KEY:
        description: GitHub App private key used to mint repository-scoped installation tokens.
        required: true
      REVIEW_YETI_PUBLIC_TARGET_APP_ID:
        description: Dedicated App id installed only on review-yeti-ai/review-yeti-bot.
        required: false
      REVIEW_YETI_PUBLIC_TARGET_APP_PRIVATE_KEY:
        description: Dedicated target App key for review-yeti-ai/review-yeti-bot only.
        required: false
      REVIEW_YETI_BIFROST_API_KEY:
        description: Optional Bifrost provider credential.
        required: false
      OPENROUTER_REVIEW_FLEET_KEY:
        description: Optional OpenRouter provider credential.
        required: false
      GEMINI_API_KEY:
        description: Optional Gemini provider credential.
        required: false
      OLLAMA_PR_REVIEW_API_KEY:
        description: Optional Ollama provider credential.
        required: false
      HONCHO_BASE_URL:
        description: Optional Honcho endpoint override.
        required: false
      HONCHO_API_KEY:
        description: Optional Honcho memory credential.
        required: false
      CONTEXT7_API_KEY:
        description: Optional Context7 documentation credential.
        required: false

permissions:
  actions: read
  contents: read
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: exampleorg-review-yeti-${{ inputs.central_execution && inputs.repository || github.repository }}-${{ inputs.central_execution && inputs.pr_number || github.event.pull_request.number }}-${{ inputs.central_execution && inputs.head_sha || github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  review:
    name: Review Yeti
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    # Hard caller-side maximum: setup, live thinking (up to 15 minutes while SSE
    # chunks keep arriving), publication, and verdict enforcement. Silence still
    # fails at stall_ms; a healthy high-effort stream may use the full generation
    # ceiling.
    timeout-minutes: 20
    env:
      REVIEW_REPOSITORY: ${{ inputs.central_execution && inputs.repository || github.repository }}
      REVIEW_PR_NUMBER: ${{ inputs.central_execution && inputs.pr_number || github.event.pull_request.number }}
      EXPECTED_BASE_SHA: ${{ inputs.central_execution && inputs.base_sha || github.event.pull_request.base.sha }}
      EXPECTED_HEAD_SHA: ${{ inputs.central_execution && inputs.head_sha || github.event.pull_request.head.sha }}
      REVIEW_REQUEST_ID: ${{ inputs.central_execution && inputs.request_id || format('{0}-{1}', github.run_id, github.run_attempt) }}
      # Same-repository central PRs run the immutable PR-head policy so a policy change is
      # actually exercised. Every other path executes the exact reusable-workflow SHA
      # captured below; no consumer checkout races a floating release ref.
      CENTRAL_REF: ${{ inputs.central_execution && 'v1' || github.repository == 'exampleorg/example-review-actions' && 'main' || 'v1' }}
      # Resolve once so policy, execution and publication agree. Preserve existing
      # qualified central inputs; consumer override admission remains separately guarded.
      # Central admissions always cross the DOKS App-gate boundary. A repository
      # variable or reusable-workflow input cannot downgrade them to local mode.
      TRUSTED_EXECUTION_BACKEND: ${{ inputs.central_execution && 'doks' || inputs.execution_backend || vars.REVIEW_YETI_EXECUTION_BACKEND || 'local' }}
    steps:
      # Resolve only the existing exampleorg owner admission or the one
      # exact public repository boundary. The trusted reusable workflow performs
      # this before exposing either App private key to token minting.
      - name: Resolve target repository scope
        id: target
        env:
          TARGET_REPOSITORY: ${{ inputs.central_execution && inputs.repository || github.repository }}
        run: |
          set -euo pipefail
          case "${TARGET_REPOSITORY}" in
            exampleorg/*)
              target_name="${TARGET_REPOSITORY#exampleorg/}"
              if [[ ! "${target_name}" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,99}$ ]]; then
                echo "::error::invalid exampleorg repository name '${target_name}'"
                exit 1
              fi
              {
                echo "scope=exampleorg"
                echo "owner=exampleorg"
                echo "name=${target_name}"
                echo "repositories=${target_name}"
                echo "caller_workflow_path=.github/workflows/ct-review-bot.yml"
              } >> "$GITHUB_OUTPUT"
              ;;
            review-yeti-ai/review-yeti-bot)
              {
                echo "scope=review-yeti-public"
                echo "owner=review-yeti-ai"
                echo "name=review-yeti-bot"
                echo "repositories=review-yeti-bot"
                echo "caller_workflow_path=.github/workflows/ct-review-bot.yml"
              } >> "$GITHUB_OUTPUT"
              ;;
            *) echo "::error::target repository is not admitted: '${TARGET_REPOSITORY}'"; exit 1 ;;
          esac

      - name: Mint Review Yeti App token for exampleorg target
        id: target_token_exampleorg
        if: steps.target.outputs.scope == 'exampleorg'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2, SHA-pinned (secret-bearing step)
        with:
          app-id: ${{ secrets.CT_REVIEW_BOT_APP_ID }}
          private-key: ${{ secrets.CT_REVIEW_BOT_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.repositories }}
          permission-actions: write
          permission-checks: write
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      # This App is installed only on the exact public target. It cannot read
      # or write the private central repository and is never used for tooling.
      - name: Mint Review Yeti App token for exact public target
        id: target_token_public
        if: steps.target.outputs.scope == 'review-yeti-public'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2, SHA-pinned (secret-bearing step)
        with:
          app-id: ${{ secrets.REVIEW_YETI_PUBLIC_TARGET_APP_ID }}
          private-key: ${{ secrets.REVIEW_YETI_PUBLIC_TARGET_APP_PRIVATE_KEY }}
          owner: review-yeti-ai
          repositories: review-yeti-bot
          permission-actions: write
          permission-checks: write
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write

      - name: Mint Review Yeti App token for central tooling
        id: central_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2, SHA-pinned (secret-bearing step)
        with:
          app-id: ${{ secrets.CT_REVIEW_BOT_APP_ID }}
          private-key: ${{ secrets.CT_REVIEW_BOT_APP_PRIVATE_KEY }}
          owner: exampleorg
          repositories: example-review-actions
          permission-actions: read
          permission-contents: read

      # job.workflow_sha is the immutable commit GitHub selected when it
      # admitted this reusable workflow invocation. Capture it in trusted
      # inline code before checking out any central repository content. The
      # sole exception preserves the existing same-repository PR-head policy;
      # forks and external callers can never select their PR head here.
      - name: Resolve immutable central tooling source
        id: central_source
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          CENTRAL_EXECUTION: ${{ inputs.central_execution && 'true' || 'false' }}
          CALLER_REPOSITORY: ${{ github.repository }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          set -euo pipefail
          sha_re='^[0-9a-f]{40}$'
          source_sha="${WORKFLOW_SHA}"
          if [[ "${CENTRAL_EXECUTION}" != 'true' &&
                "${CALLER_REPOSITORY}" == 'exampleorg/example-review-actions' &&
                "${PR_HEAD_REPOSITORY}" == "${CALLER_REPOSITORY}" ]]; then
            source_sha="${PR_HEAD_SHA}"
          fi
          if [[ ! "${source_sha}" =~ ${sha_re} ]]; then
            echo "::error::resolved central tooling source is not a full commit SHA"
            exit 1
          fi
          echo "sha=${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Checkout central workflow tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: exampleorg/example-review-actions
          ref: ${{ steps.central_source.outputs.sha }}
          path: .exampleorg-review-actions
          token: ${{ steps.central_token.outputs.token }}
          persist-credentials: false
          fetch-depth: 1

      # legacy-runtime/package.json engines.node is >=24 (and pi-workflow requires
      # caller-provisioned Node 24). The composite cannot nest setup-node; this
      # job is the caller. Without this step the Blacksmith image's Node 20
      # produces npm EBADENGINE on `npm ci` in legacy-runtime/.
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Validate immutable caller pin
        if: ${{ !inputs.central_execution }}
        env:
          # The target token reads the caller workflow in the repository under
          # review. The immutable-pin compare hits the private central repository,
          # which the public target App cannot read, so that call uses the
          # central token inside the script.
          GH_TOKEN: ${{ steps.target_token_exampleorg.outputs.token || steps.target_token_public.outputs.token }}
          GH_CENTRAL_TOKEN: ${{ steps.central_token.outputs.token }}
        run: .exampleorg-review-actions/scripts/validate-caller-workflow.sh

      - name: Validate central dispatch boundary
        id: central_validation
        if: ${{ inputs.central_execution }}
        env:
          GH_TARGET_TOKEN: ${{ steps.target_token_exampleorg.outputs.token || steps.target_token_public.outputs.token }}
          GH_CENTRAL_TOKEN: ${{ steps.central_token.outputs.token }}
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          CENTRAL_DISPATCH_PAYLOAD: >-
            {"request_id":"${{ inputs.request_id }}","repository":"${{ inputs.repository }}","pr_number":${{ inputs.pr_number }},"base_sha":"${{ inputs.base_sha }}","head_sha":"${{ inputs.head_sha }}","refresh_requested":${{ inputs.refresh_requested && 'true' || 'false' }}}
        run: node .exampleorg-review-actions/scripts/validate-central-dispatch.mjs

      - name: Validate immutable review request
        env:
          GH_TOKEN: ${{ steps.target_token_exampleorg.outputs.token || steps.target_token_public.outputs.token }}
        run: .exampleorg-review-actions/scripts/validate-review-request.sh

      - name: Load central Review Yeti policy
        id: policy
        working-directory: .exampleorg-review-actions
        env:
          REVIEW_YETI_PASSTHROUGH: ${{ inputs.passthrough && 'true' || vars.REVIEW_YETI_PASSTHROUGH || '' }}
          # Use the same platform-owned backend for policy validation and the action. emit-policy.mjs
          # asserts review_yeti.incremental is only enabled when this resolves to "local" -- the
          # only backend that implements incremental review.
          REVIEW_YETI_RESOLVED_BACKEND: ${{ env.TRUSTED_EXECUTION_BACKEND }}
          # emit-policy.mjs refuses a "doks" backend whose publish mode is not
          # "app-gate": that combination accepts the dispatch and never reports a
          # verdict, so the run fails closed before it can leave incomplete evidence.
          REVIEW_YETI_DOKS_PUBLISH_MODE: ${{ inputs.central_execution && 'app-gate' || vars.REVIEW_YETI_DOKS_PUBLISH_MODE || 'disabled' }}
        run: node scripts/emit-policy.mjs

      - name: Validate encoded transport handoff
        id: transport_handoff
        working-directory: .exampleorg-review-actions
        env:
          TRANSPORT_PLAN_B64: ${{ steps.policy.outputs.transport_plan_b64 }}
        run: node scripts/validate-transport-handoff.mjs

      - name: Smoke-test Review Yeti transports
        id: smoke
        if: steps.policy.outputs.passthrough != 'true'
        working-directory: .exampleorg-review-actions
        env:
          REVIEW_YETI_BIFROST_API_KEY: ${{ secrets.REVIEW_YETI_BIFROST_API_KEY }}
          BIFROST_PR_REVIEW_API_KEY: ${{ secrets.REVIEW_YETI_BIFROST_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OLLAMA_PR_REVIEW_API_KEY: ${{ secrets.OLLAMA_PR_REVIEW_API_KEY }}
          OPENROUTER_REVIEW_FLEET_KEY: ${{ secrets.OPENROUTER_REVIEW_FLEET_KEY }}
          OPENROUTER_PR_REVIEW_API_KEY: ${{ secrets.OPENROUTER_REVIEW_FLEET_KEY }}
          REVIEW_YETI_SMOKE_TIMEOUT_MS: 90000
        run: |
          echo "stream=${{ steps.policy.outputs.openrouter_stream }} ttft_ms=${{ steps.policy.outputs.openrouter_ttft_ms }} timeout_ms=${{ steps.policy.outputs.openrouter_timeout_ms }}"
          node scripts/review-yeti-smoke.mjs

      - name: Validate admitted transport handoff
        if: steps.policy.outputs.passthrough != 'true'
        working-directory: .exampleorg-review-actions
        env:
          TRANSPORT_PLAN_B64: ${{ steps.smoke.outputs.healthy_transport_plan_b64 }}
          ALLOW_POLICY_SUBSET: 'true'
        run: node scripts/validate-transport-handoff.mjs

      - name: Resolve Review Yeti release channel
        id: resolved
        if: steps.policy.outputs.passthrough != 'true'
        env:
          GH_TOKEN: ${{ steps.target_token_exampleorg.outputs.token || steps.target_token_public.outputs.token }}
          REVIEW_YETI_REPOSITORY: ${{ steps.policy.outputs.repository }}
          REVIEW_YETI_ACTION_CHANNEL: ${{ steps.policy.outputs.action_ref }}
        run: .exampleorg-review-actions/scripts/resolve-release-channel.sh

      - name: Fetch Review Yeti action at resolved commit
        if: steps.policy.outputs.passthrough != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: ${{ steps.policy.outputs.repository }}
          ref: ${{ steps.resolved.outputs.sha }}
          path: .review-yeti-bot
          token: ${{ steps.target_token_exampleorg.outputs.token || steps.target_token_public.outputs.token }}
          persist-credentials: false
          fetch-depth: 1

      - name: Validate Review Yeti release provenance
        if: steps.policy.outputs.passthrough != 'true'
        env:
          GH_TOKEN: ${{ steps.target_token_exampleorg.outputs.token || steps.target_token_public.outputs.token }}
          REVIEW_YETI_REPOSITORY: ${{ steps.policy.outputs.repository }}
          REVIEW_YETI_ACTION_CHANNEL: ${{ steps.policy.outputs.action_ref }}
          RESOLVED_SHA: ${{ steps.resolved.outputs.sha }}
          RESOLVED_REF_SHA: ${{ steps.resolved.outputs.ref_sha }}
        run: .exampleorg-review-actions/scripts/validate-release-provenance.sh

      # The reusable-workflow identity fields belong to the runtime `job` context.
      # Capture them in a step before passing them to an action: GitHub rejects the
      # `job` context when it is referenced directly from an action `with:` block.
      - name: Resolve immutable reusable workflow identity
        id: workflow_identity
        env:
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: .exampleorg-review-actions/scripts/emit-workflow-identity.sh

      # Preflight admission (QA-380): the smoke step proves which transports are healthy before
      # any persona runs. The highest-priority healthy transport seeds legacy action fields, and the
      # action receives only the healthy subset for weighted per-lane primary assignment and failover. This prevents
      # every lane from rediscovering the same known provider failure while retaining automatic
      # failover among the transports that passed the real request shape. Zero healthy transports
      # still hard-fails before this step.
      - name: Initialize Review Yeti check run
        id: init_check
        if: inputs.central_execution && (steps.target_token_exampleorg.outputs.token != '' || steps.target_token_public.outputs.token != '') && env.TRUSTED_EXECUTION_BACKEND != 'doks'
        env:
          GH_TOKEN: ${{ steps.target_token_exampleorg.outputs.token || steps.target_token_public.outputs.token }}
          TARGET_REPO: ${{ inputs.repository }}
          HEAD_SHA: ${{ inputs.head_sha }}
          CENTRAL_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          echo "Initializing Check Run 'Review Yeti' (in_progress) on ${TARGET_REPO}@${HEAD_SHA}..."
          response="$(curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${TARGET_REPO}/check-runs" \
            -d "$(jq -nc \
              --arg name "Review Yeti" \
              --arg head_sha "${HEAD_SHA}" \
              --arg details_url "${CENTRAL_RUN_URL}" \
              '{
                name: $name,
                head_sha: $head_sha,
                status: "in_progress",
                details_url: $details_url,
                output: {
                  title: "Review Yeti: in progress",
                  summary: ("Review Yeti evaluation is running in central execution. See [central run](" + $details_url + ").")
                }
              }')" 2>/dev/null || true)"
          check_id="$(echo "$response" | jq -r '.id // empty' 2>/dev/null || true)"
          if [ -n "$check_id" ]; then
            echo "check_id=${check_id}" >> "$GITHUB_OUTPUT"
            echo "Created check-run ID: ${check_id}"
          else
            echo "::warning::Failed to initialize check-run: $(echo "$response" | head -c 200)"
          fi

      - name: Align panel seed key
        id: seed_key
        if: steps.policy.outputs.passthrough != 'true'
        working-directory: .exampleorg-review-actions
        env:
          RESOLVED_API_KEY_ENV: ${{ steps.smoke.outputs.resolved_api_key_env }}
          REVIEW_YETI_BIFROST_API_KEY: ${{ secrets.REVIEW_YETI_BIFROST_API_KEY }}
          BIFROST_PR_REVIEW_API_KEY: ${{ secrets.REVIEW_YETI_BIFROST_API_KEY }}
          OPENROUTER_REVIEW_FLEET_KEY: ${{ secrets.OPENROUTER_REVIEW_FLEET_KEY }}
          OPENROUTER_PR_REVIEW_API_KEY: ${{ secrets.OPENROUTER_REVIEW_FLEET_KEY }}
          OLLAMA_PR_REVIEW_API_KEY: ${{ secrets.OLLAMA_PR_REVIEW_API_KEY }}
        run: node scripts/align-panel-seed-key.mjs

      - name: Run Review Yeti review panel
        id: review
        if: steps.policy.outputs.passthrough != 'true'
        uses: ./.review-yeti-bot
        env:
          REVIEW_YETI_BIFROST_API_KEY: ${{ secrets.REVIEW_YETI_BIFROST_API_KEY }}
          BIFROST_PR_REVIEW_API_KEY: ${{ secrets.REVIEW_YETI_BIFROST_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OLLAMA_PR_REVIEW_API_KEY: ${{ secrets.OLLAMA_PR_REVIEW_API_KEY }}
          OPENROUTER_REVIEW_FLEET_KEY: ${{ secrets.OPENROUTER_REVIEW_FLEET_KEY }}
          OPENROUTER_PR_REVIEW_API_KEY: ${{ secrets.OPENROUTER_REVIEW_FLEET_KEY }}
          HONCHO_BASE_URL: ${{ secrets.HONCHO_BASE_URL || 'https://honcho.do.example.com' }}
          HONCHO_API_KEY: ${{ secrets.HONCHO_API_KEY }}
          HONCHO_WORKSPACE: ${{ vars.HONCHO_WORKSPACE || 'exampleorg' }}
          HONCHO_PEER: 'review-yeti'
          HONCHO_OBSERVED: ${{ vars.HONCHO_OBSERVED || 'jason' }}
          HONCHO_RECALL_PEERS: ${{ vars.HONCHO_RECALL_PEERS || 'review-yeti,codex' }}
          HONCHO_RECALL_DISTANCE: ${{ vars.HONCHO_RECALL_DISTANCE || '0.35' }}
          MEMORY_PROVIDER: 'composite'
          MCP_CONFIG_JSON: ${{ steps.policy.outputs.mcp_config_json }}
        with:
          check-id: ${{ env.TRUSTED_EXECUTION_BACKEND != 'doks' && steps.init_check.outputs.check_id || '' }}
          github-token: ${{ steps.target_token_exampleorg.outputs.token || steps.target_token_public.outputs.token }}
          repo: ${{ inputs.central_execution && inputs.repository || github.repository }}
          pr-number: ${{ inputs.central_execution && inputs.pr_number || github.event.pull_request.number }}
          expected-generation: ${{ inputs.expected_generation }}
          llm-api-key: ${{ steps.seed_key.outputs.llm_api_key }}
          llm-base-url: ${{ steps.smoke.outputs.resolved_base_url }}
          action-sha: ${{ steps.resolved.outputs.sha }}
          model: ${{ steps.smoke.outputs.resolved_model }}
          transports: ${{ steps.smoke.outputs.healthy_transports }}
          transport-plan-b64: ${{ steps.smoke.outputs.healthy_transport_plan_b64 }}
          dispatch-mode: ${{ steps.policy.outputs.dispatch_mode }}
          openrouter-data-collection: ${{ steps.policy.outputs.openrouter_data_collection }}
          max-diff-chars: ${{ steps.policy.outputs.max_diff_chars }}
          max-file-diff-chars: ${{ steps.policy.outputs.max_file_diff_chars }}
          incremental-review: ${{ steps.policy.outputs.incremental_enabled }}
          incremental-trusted-workflow: ${{ steps.workflow_identity.outputs.workflow_ref }}
          incremental-trusted-workflow-sha: ${{ steps.workflow_identity.outputs.workflow_sha }}
          # Production reviews execute as repository_dispatch runs inside this repository
          # (inputs.central_execution == true), so prior-run reports live in this repo's own
          # Actions artifacts, and the trusted parent event that dispatched this run is
          # repository_dispatch rather than the consumer's original pull_request(_target) event.
          # A non-central (local/self-review) run keeps looking at its own repository's
          # artifacts and only trusts the consumer pull_request(_target) events it can see.
          incremental-artifact-repo: ${{ github.repository }}
          incremental-trusted-events: ${{ inputs.central_execution && 'pull_request,pull_request_target,repository_dispatch' || 'pull_request,pull_request_target' }}
          max-incremental-diff-chars: ${{ steps.policy.outputs.max_incremental_diff_chars }}
          max-incremental-chain: ${{ steps.policy.outputs.max_incremental_chain }}
          max-review-assignments: ${{ steps.policy.outputs.max_review_assignments }}
          personas: ${{ steps.policy.outputs.personas }}
          max-investigation-turns: ${{ steps.policy.outputs.max_investigation_turns }}
          lane-call-budget: ${{ steps.policy.outputs.lane_call_budget }}
          execution-backend: ${{ env.TRUSTED_EXECUTION_BACKEND }}
          doks-dispatch-url: https://review-bot.example.com/api/dispatch/action
          doks-publish-mode: ${{ steps.policy.outputs.doks_publish_mode }}
          honcho-api-key: ${{ secrets.HONCHO_API_KEY }}
          honcho-base-url: ${{ secrets.HONCHO_BASE_URL || 'https://honcho.do.example.com' }}
          honcho-workspace: ${{ vars.HONCHO_WORKSPACE || 'exampleorg' }}
          honcho-peer: 'review-yeti'
          honcho-observed: ${{ vars.HONCHO_OBSERVED || 'jason' }}
          honcho-recall-peers: ${{ vars.HONCHO_RECALL_PEERS || 'review-yeti,codex' }}
          honcho-recall-distance: ${{ vars.HONCHO_RECALL_DISTANCE || '0.35' }}
          memory-provider: 'composite'
          context7-api-key: ${{ secrets.CONTEXT7_API_KEY }}
          skills: ${{ steps.policy.outputs.skills || inputs.skills }}
          knowledge: ${{ steps.policy.outputs.knowledge || inputs.knowledge }}
          metrics: ${{ steps.policy.outputs.metrics || inputs.metrics }}
          retry-analysis: ${{ steps.policy.outputs.retry_analysis || inputs.retry_analysis }}
          policy-json: ${{ steps.policy.outputs.policy_json || inputs.policy_json }}

      # Loud, not silent: a degraded run must be visibly degraded on the PR, not just in Action
      # logs an operator has to go dig for.
      - name: Annotate degraded transport
        if: steps.smoke.outputs.resolved_degraded == 'true'
        run: |
          echo "::warning::Review Yeti ran this review on the fallback transport (${{ steps.smoke.outputs.resolved_transport }}); the primary transport was unhealthy."
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            echo "> ⚠️ Review Yeti ran on fallback transport **${{ steps.smoke.outputs.resolved_transport }}** this run (primary unhealthy)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deliver Review Yeti passthrough verdict
        id: passthrough
        if: always() && steps.policy.outputs.passthrough == 'true'
        env:
          GH_TOKEN: ${{ steps.target_token_exampleorg.outputs.token || steps.target_token_public.outputs.token }}
          TARGET_REPO: ${{ inputs.central_execution && inputs.repository || github.repository }}
          PR_NUMBER: ${{ inputs.central_execution && inputs.pr_number || github.event.pull_request.number }}
          HEAD_SHA: ${{ inputs.central_execution && inputs.head_sha || github.event.pull_request.head.sha }}
          BASE_SHA: ${{ inputs.central_execution && inputs.base_sha || github.event.pull_request.base.sha }}
          REVIEW_YETI_EXECUTION_BACKEND: ${{ env.TRUSTED_EXECUTION_BACKEND }}
        run: .exampleorg-review-actions/scripts/deliver-passthrough.sh

      # The bot already writes per-lane telemetry (turnCount, failureClass,
      # resolved transport) to RUNNER_TEMP and exposes run-report-path, but
      # nothing consumed it — so the calls-per-lane distribution had to be
      # reconstructed by hand from PR-comment "Turns:" lines. That
      # distribution is what should size lane_call_budget; without it the
      # budget gets hand-picked, which is how it drifted out of step with
      # max_investigation_turns. Upload it so the number can be derived.
      - name: Upload Review Yeti run report
        if: always() && (steps.passthrough.outputs.run-report-path != '' || steps.review.outputs.run-report-path != '')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: review-yeti-run-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.passthrough.outputs.run-report-path || steps.review.outputs.run-report-path }}
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload Review Yeti provider telemetry
        if: always() && steps.review.outputs.provider-telemetry-path != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: review-yeti-provider-telemetry-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.review.outputs.provider-telemetry-path }}
          if-no-files-found: ignore
          retention-days: 14

      # REL-525: the engine already retries a malformed-output lane once with reasoning
      # disabled, then advances to the next enabled transport for that lane before failing it
      # (review-yeti-ai/review-yeti-bot's prepareDirectFormatRecovery/prepareOpenRouterFormatRecovery
      # plus its per-lane candidateTransports walk). That decision was previously visible only
      # inside raw provider-telemetry JSON. Surface it as loud, per-event log lines and a job
      # summary table so a malformed-output recovery -- or an exhausted lane with no alternative
      # transport -- is honest, reviewable evidence instead of a silent detail buried in an
      # artifact. This step only reads already-recorded telemetry; it makes no retry or failover
      # decision of its own and never touches the timeout/stall path ADR 0337 governs.
      - name: Annotate malformed-output transport failover
        if: always() && steps.review.outputs.provider-telemetry-path != ''
        working-directory: .exampleorg-review-actions
        run: node scripts/annotate-transport-failover.mjs "${{ steps.review.outputs.provider-telemetry-path }}"

      - name: Report Review Yeti Check Run to target repository
        if: always() && inputs.central_execution && (steps.target_token_exampleorg.outputs.token != '' || steps.target_token_public.outputs.token != '')
        env:
          GH_TOKEN: ${{ steps.target_token_exampleorg.outputs.token || steps.target_token_public.outputs.token }}
          TARGET_REPO: ${{ inputs.repository }}
          HEAD_SHA: ${{ inputs.head_sha }}
          REVIEW_STATUS: ${{ steps.passthrough.outputs.review-status || steps.review.outputs.review-status }}
          REVIEW_YETI_PASSTHROUGH: ${{ steps.policy.outputs.passthrough }}
          REVIEW_YETI_EXECUTION_BACKEND: ${{ env.TRUSTED_EXECUTION_BACKEND }}
          CENTRAL_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHECK_ID: ${{ steps.init_check.outputs.check_id || '' }}
        run: .exampleorg-review-actions/scripts/publish-review-check-run.sh

      - name: Trigger target repository CI validation on SHIP
        if: always() && inputs.central_execution && (steps.target_token_exampleorg.outputs.token != '' || steps.target_token_public.outputs.token != '') && (steps.passthrough.outputs.review-status == 'SHIP' || steps.review.outputs.review-status == 'SHIP')
        env:
          GH_TOKEN: ${{ steps.target_token_exampleorg.outputs.token || steps.target_token_public.outputs.token }}
          TARGET_REPO: ${{ inputs.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          echo "Review Yeti passed with SHIP. Admitting PR #${PR_NUMBER} to CI/CD validation..."
          head_ref="$(gh api "repos/${TARGET_REPO}/pulls/${PR_NUMBER}" --jq .head.ref)"
          if [ -z "$head_ref" ]; then
            echo "::error::Target PR source branch is unavailable; refusing to skip required CI dispatch."
            exit 1
          fi
          echo "Dispatching validate.yml on ${TARGET_REPO}@${head_ref}..."
          gh workflow run validate.yml --repo "${TARGET_REPO}" --ref "${head_ref}" -f pr_number="${PR_NUMBER}" -f head_sha="${HEAD_SHA}"

      - name: Enforce exact-head Review Yeti verdict
        if: always()
        env:
          GH_TOKEN: ${{ steps.target_token_exampleorg.outputs.token || steps.target_token_public.outputs.token }}
          REVIEW_STATUS: ${{ steps.passthrough.outputs.review-status || steps.review.outputs.review-status }}
          GATE_DECISION: ${{ steps.passthrough.outputs.gate-decision || steps.review.outputs.gate-decision }}
          MERGE_ELIGIBLE: ${{ steps.passthrough.outputs.merge-eligible || steps.review.outputs.merge-eligible }}
          FILES_OMITTED: ${{ steps.passthrough.outputs.files-omitted || steps.review.outputs.files-omitted }}
          DISPATCH_REFLECTION_STATUS: ${{ steps.passthrough.outputs.review-dispatch-reflection-status || steps.review.outputs.review-dispatch-reflection-status }}
          PROVIDER_RECEIPT_DIGEST: ${{ steps.passthrough.outputs.review-dispatch-provider-receipt-digest || steps.review.outputs.review-dispatch-provider-receipt-digest }}
          RUN_REPORT_PATH: ${{ steps.passthrough.outputs.run-report-path || steps.review.outputs.run-report-path }}
          REVIEW_YETI_PASSTHROUGH: ${{ steps.policy.outputs.passthrough }}
          REVIEW_YETI_EXECUTION_BACKEND: ${{ env.TRUSTED_EXECUTION_BACKEND }}
        run: .exampleorg-review-actions/scripts/check-review-verdict.sh
