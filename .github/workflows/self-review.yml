name: Review Yeti

# This workflow uses the platform-owned v1 contract. Review policy and budgets live in the
# private central repository; callers do not duplicate release SHAs or PR-body claims.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    uses: exampleorg/example-review-actions/.github/workflows/review-yeti.yml@v1
    secrets: inherit
