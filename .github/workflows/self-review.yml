name: Review Yeti

# Central self-review follows the development line. Consumer repositories use the promoted
# v1 release line; neither path carries a caller-supplied SHA or PR-body claim.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    uses: exampleorg/example-review-actions/.github/workflows/review-yeti.yml@main
    secrets: inherit
