name: Review Yeti

# This workflow is pinned to the current immutable release. A proposed change to the central
# workflow is still evaluated by the default branch's previous pin; after promotion, this caller
# advances together with the release so future PRs validate the same central SHA explicitly.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    uses: exampleorg/example-review-actions/.github/workflows/review-yeti.yml@721a866c40ec546c1611aec9b4c7d51d8dfacea7
    with:
      repository: ${{ github.repository }}
      pr-number: ${{ github.event.pull_request.number }}
      base-sha: ${{ github.event.pull_request.base.sha }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      central-sha: 721a866c40ec546c1611aec9b4c7d51d8dfacea7
    secrets: inherit
