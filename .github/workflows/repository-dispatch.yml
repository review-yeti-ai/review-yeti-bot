name: Central Review Yeti Dispatch
run-name: Review Yeti central / ${{ github.event.client_payload.request_id }}

on:
  repository_dispatch:
    types: [review-yeti-request]
  workflow_dispatch:
    inputs:
      repository:
        description: 'Target repository'
        required: true
        type: string
      pr_number:
        description: 'Pull request number'
        required: true
        type: number
      base_sha:
        description: 'Base commit SHA'
        required: true
        type: string
      head_sha:
        description: 'Head commit SHA'
        required: true
        type: string
      request_id:
        description: 'Request ID'
        required: true
        type: string
      refresh_requested:
        description: 'Explicit same-head retry requested by review-yeti/refresh'
        required: false
        default: false
        type: boolean

permissions:
  # A called reusable workflow may not request more than its caller grants; GitHub
  # rejects the run at startup ("workflow file issue") otherwise. review-yeti.yml
  # declares issues:write + pull-requests:write, so the caller must grant them too.
  actions: read
  contents: read
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  # This is the GitHub-side half of the generation reservation. Every admission
  # for one immutable PR head revalidates serially; the DOKS App-gate database
  # identity/CAS is the durable half that owns worker-attempt allocation.
  group: central-review-yeti-${{ github.event.client_payload.repository || inputs.repository }}-${{ github.event.client_payload.pr_number || inputs.pr_number }}-${{ github.event.client_payload.head_sha || inputs.head_sha }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate central request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      request_id: ${{ steps.request.outputs.request_id }}
      repository: ${{ steps.request.outputs.repository }}
      pr_number: ${{ steps.request.outputs.pr_number }}
      base_sha: ${{ steps.request.outputs.base_sha }}
      head_sha: ${{ steps.request.outputs.head_sha }}
      review_generation: ${{ steps.request.outputs.review_generation }}
      caller_workflow_sha256: ${{ steps.request.outputs.caller_workflow_sha256 }}
      refresh_requested: ${{ steps.request.outputs.refresh_requested }}
    steps:
      - name: Checkout promoted central validator
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: exampleorg/example-review-actions
          ref: v1
          path: .exampleorg-review-actions
          persist-credentials: false
          fetch-depth: 1

      # The validator reads target state with the App installation belonging to
      # that owner. Cross-owner targets get a second, repository-scoped token
      # for central capacity reads; an installation token never spans owners.
      - name: Resolve target repository scope
        id: target
        env:
          TARGET_REPOSITORY: ${{ github.event.client_payload.repository || inputs.repository }}
        run: |
          set -euo pipefail
          case "${TARGET_REPOSITORY}" in
            exampleorg/*)
              target_name="${TARGET_REPOSITORY#exampleorg/}"
              if [[ ! "${target_name}" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,99}$ ]]; then
                echo "::error::invalid exampleorg repository name '${target_name}'"
                exit 1
              fi
              repositories="${target_name}"
              if [[ "${target_name}" != "example-review-actions" ]]; then
                repositories="${target_name},example-review-actions"
              fi
              {
                echo "owner=exampleorg"
                echo "name=${target_name}"
                echo "repositories=${repositories}"
                echo "caller_workflow_path=.github/workflows/ct-review-bot.yml"
                echo "needs_central_token=false"
              } >> "$GITHUB_OUTPUT"
              ;;
            review-yeti-ai/review-yeti-bot)
              {
                echo "owner=review-yeti-ai"
                echo "name=review-yeti-bot"
                echo "repositories=review-yeti-bot"
                echo "caller_workflow_path=.github/workflows/ct-review-bot.yml"
                echo "needs_central_token=true"
              } >> "$GITHUB_OUTPUT"
              ;;
            *) echo "::error::target repository is not admitted: '${TARGET_REPOSITORY}'"; exit 1 ;;
          esac

      - name: Mint Review Yeti App token for target validation
        id: ry_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2, SHA-pinned (secret-bearing step)
        with:
          app-id: ${{ secrets.CT_REVIEW_BOT_APP_ID }}
          private-key: ${{ secrets.CT_REVIEW_BOT_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.repositories }}
          permission-actions: read
          permission-checks: read
          permission-contents: read
          permission-pull-requests: read

      - name: Mint Review Yeti App token for central validation
        id: central_token
        if: ${{ steps.target.outputs.needs_central_token == 'true' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2, SHA-pinned (secret-bearing step)
        with:
          app-id: ${{ secrets.CT_REVIEW_BOT_APP_ID }}
          private-key: ${{ secrets.CT_REVIEW_BOT_APP_PRIVATE_KEY }}
          owner: exampleorg
          repositories: example-review-actions
          permission-actions: read
          permission-contents: read

      - name: Validate payload, current PR, and immutable caller
        id: request
        working-directory: .exampleorg-review-actions
        env:
          GH_TARGET_TOKEN: ${{ steps.ry_token.outputs.token }}
          GH_CENTRAL_TOKEN: ${{ steps.central_token.outputs.token || steps.ry_token.outputs.token }}
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          CENTRAL_DISPATCH_PAYLOAD: ${{ toJSON(github.event.client_payload || inputs) }}
        run: node scripts/validate-central-dispatch.mjs

  review:
    name: Review Yeti at promoted v1
    needs: validate
    uses: exampleorg/example-review-actions/.github/workflows/review-yeti.yml@v1
    with:
      central_execution: true
      request_id: ${{ needs.validate.outputs.request_id }}
      repository: ${{ needs.validate.outputs.repository }}
      pr_number: ${{ fromJSON(needs.validate.outputs.pr_number) }}
      base_sha: ${{ needs.validate.outputs.base_sha }}
      head_sha: ${{ needs.validate.outputs.head_sha }}
      refresh_requested: ${{ needs.validate.outputs.refresh_requested == 'true' }}
      expected_generation: ${{ fromJSON(needs.validate.outputs.review_generation) }}
      passthrough: ${{ vars.REVIEW_YETI_PASSTHROUGH == 'true' }}
      execution_backend: doks
    secrets: inherit
