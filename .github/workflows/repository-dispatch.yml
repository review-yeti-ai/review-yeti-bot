name: Central Review Yeti Dispatch
run-name: Review Yeti central / ${{ github.event.client_payload.request_id || inputs.request_id || format('{0}:{1}:{2}', inputs.repository, inputs.pr_number, inputs.head_sha) }}

on:
  repository_dispatch:
    types: [review-yeti-request]
  workflow_dispatch:
    inputs:
      repository:
        description: 'Target repository'
        required: true
        type: string
      pr_number:
        description: 'Pull request number'
        required: true
        type: number
      base_sha:
        description: 'Base commit SHA'
        required: true
        type: string
      head_sha:
        description: 'Head commit SHA'
        required: true
        type: string
      request_id:
        description: 'Optional originating caller request ID; omitted manual runs bind to this central run'
        required: false
        default: ''
        type: string
      refresh_requested:
        description: 'Explicit same-head retry requested by review-yeti/refresh'
        required: false
        default: false
        type: boolean

permissions:
  # A called reusable workflow may not request more than its caller grants; GitHub
  # rejects the run at startup ("workflow file issue") otherwise. review-yeti.yml
  # declares issues:write + pull-requests:write, so the caller must grant them too.
  actions: read
  contents: read
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  # This is the GitHub-side half of the generation reservation. Every admission
  # for one immutable PR head revalidates serially; the DOKS App-gate database
  # identity/CAS is the durable half that owns worker-attempt allocation.
  group: central-review-yeti-${{ github.event.client_payload.repository || inputs.repository }}-${{ github.event.client_payload.pr_number || inputs.pr_number }}-${{ github.event.client_payload.head_sha || inputs.head_sha }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate central request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      request_id: ${{ steps.request.outputs.request_id }}
      repository: ${{ steps.request.outputs.repository }}
      pr_number: ${{ steps.request.outputs.pr_number }}
      base_sha: ${{ steps.request.outputs.base_sha }}
      head_sha: ${{ steps.request.outputs.head_sha }}
      review_generation: ${{ steps.request.outputs.review_generation }}
      refresh_execution_attempt: ${{ steps.request.outputs.refresh_execution_attempt }}
      caller_workflow_sha256: ${{ steps.request.outputs.caller_workflow_sha256 }}
      refresh_requested: ${{ steps.request.outputs.refresh_requested }}
    steps:
      # GitHub serializes workflow_dispatch number inputs as strings. Convert
      # only that manual boundary to the validator's typed contract; a
      # repository_dispatch payload remains strict and fail-closed.
      # Keep this small boundary workflow-owned: main can precede promotion of
      # v1, which may not export a normalizer. No checkout code or credentials
      # are used here; all secret-bearing validation still runs promoted v1.
      - name: Normalize central dispatch payload
        id: payload
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXECUTION_RUN_ID: ${{ github.run_id }}
          EXECUTION_RUN_ATTEMPT: ${{ github.run_attempt }}
          RAW_CENTRAL_DISPATCH_PAYLOAD: ${{ toJSON(github.event.client_payload || inputs) }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          function normalizeCentralDispatchPayload({ eventName, payload, runId, runAttempt }) {
            if (eventName !== 'workflow_dispatch') return payload;
            if (!payload || typeof payload !== 'object' || Array.isArray(payload)) {
              throw new Error('workflow_dispatch inputs must be an object');
            }

            const rawPrNumber = payload.pr_number;
            const prNumber = typeof rawPrNumber === 'number'
              ? rawPrNumber
              : typeof rawPrNumber === 'string' && /^[1-9][0-9]*$/u.test(rawPrNumber)
                ? Number(rawPrNumber)
                : NaN;
            if (!Number.isSafeInteger(prNumber) || prNumber < 1) {
              throw new Error('workflow_dispatch pr_number must be a positive safe integer');
            }

            const rawRefreshRequested = payload.refresh_requested;
            const refreshRequested = rawRefreshRequested === true || rawRefreshRequested === 'true'
              ? true
              : rawRefreshRequested === false || rawRefreshRequested === 'false'
                ? false
                : null;
            if (refreshRequested === null) {
              throw new Error('workflow_dispatch refresh_requested must be a boolean');
            }
            let requestId = payload.request_id;
            if (requestId === undefined || requestId === '') {
              const repositoryName = typeof payload.repository === 'string' ? payload.repository.split('/')[1] : '';
              const parseRunCoordinate = (value) => typeof value === 'number' ? value
                : typeof value === 'string' && /^[1-9][0-9]*$/u.test(value) ? Number(value) : NaN;
              const executionRunId = parseRunCoordinate(runId);
              const executionRunAttempt = parseRunCoordinate(runAttempt);
              if (!repositoryName || !/^[A-Za-z0-9_][A-Za-z0-9._-]{0,99}$/u.test(repositoryName)
                  || !Number.isSafeInteger(executionRunId) || executionRunId < 1
                  || !Number.isSafeInteger(executionRunAttempt) || executionRunAttempt < 1) {
                throw new Error('workflow_dispatch run identity is invalid');
              }
              requestId = `${repositoryName}:${prNumber}:${payload.head_sha}:${executionRunId}:${executionRunAttempt}`;
            }
            return { ...payload, request_id: requestId, pr_number: prNumber, refresh_requested: refreshRequested };
          }

          const payload = JSON.parse(process.env.RAW_CENTRAL_DISPATCH_PAYLOAD || '');
          const normalized = normalizeCentralDispatchPayload({
            eventName: process.env.EVENT_NAME,
            payload,
            runId: process.env.EXECUTION_RUN_ID,
            runAttempt: process.env.EXECUTION_RUN_ATTEMPT,
          });
          process.stdout.write(`payload=${JSON.stringify(normalized)}\n`);
          NODE

      - name: Checkout promoted central validator
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: exampleorg/example-review-actions
          ref: v1
          path: .exampleorg-review-actions
          persist-credentials: false
          fetch-depth: 1

      # The validator reads target state with the App installation belonging to
      # that owner. The public Review Yeti target is the one exact cross-owner
      # exception and uses a dedicated target App; the internal App remains
      # scoped to this private repository for central capacity/tooling reads.
      - name: Resolve target repository scope
        id: target
        env:
          TARGET_REPOSITORY: ${{ github.event.client_payload.repository || inputs.repository }}
        run: |
          set -euo pipefail
          case "${TARGET_REPOSITORY}" in
            exampleorg/*)
              target_name="${TARGET_REPOSITORY#exampleorg/}"
              if [[ ! "${target_name}" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,99}$ ]]; then
                echo "::error::invalid exampleorg repository name '${target_name}'"
                exit 1
              fi
              {
                echo "scope=exampleorg"
                echo "owner=exampleorg"
                echo "name=${target_name}"
                echo "repositories=${target_name}"
                echo "caller_workflow_path=.github/workflows/ct-review-bot.yml"
              } >> "$GITHUB_OUTPUT"
              ;;
            review-yeti-ai/review-yeti-bot)
              {
                echo "scope=review-yeti-public"
                echo "owner=review-yeti-ai"
                echo "name=review-yeti-bot"
                echo "repositories=review-yeti-bot"
                echo "caller_workflow_path=.github/workflows/ct-review-bot.yml"
              } >> "$GITHUB_OUTPUT"
              ;;
            *) echo "::error::target repository is not admitted: '${TARGET_REPOSITORY}'"; exit 1 ;;
          esac

      - name: Mint Review Yeti App token for exampleorg target validation
        id: target_token_exampleorg
        if: steps.target.outputs.scope == 'exampleorg'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2, SHA-pinned (secret-bearing step)
        with:
          app-id: ${{ secrets.CT_REVIEW_BOT_APP_ID }}
          private-key: ${{ secrets.CT_REVIEW_BOT_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.repositories }}
          permission-actions: read
          permission-checks: read
          permission-contents: read
          permission-pull-requests: read

      # The App may review multiple repositories in review-yeti-ai, but this
      # token is narrowed to review-yeti-bot. It is not the private
      # ct-review-bot App and has no access to central tooling.
      - name: Mint Review Yeti App token for exact public target validation
        id: target_token_public
        if: steps.target.outputs.scope == 'review-yeti-public'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2, SHA-pinned (secret-bearing step)
        with:
          app-id: ${{ secrets.REVIEW_YETI_PUBLIC_TARGET_APP_ID }}
          private-key: ${{ secrets.REVIEW_YETI_PUBLIC_TARGET_APP_PRIVATE_KEY }}
          owner: review-yeti-ai
          repositories: review-yeti-bot
          permission-actions: read
          permission-checks: read
          permission-contents: read
          permission-pull-requests: read

      - name: Mint Review Yeti App token for central validation
        id: central_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2, SHA-pinned (secret-bearing step)
        with:
          app-id: ${{ secrets.CT_REVIEW_BOT_APP_ID }}
          private-key: ${{ secrets.CT_REVIEW_BOT_APP_PRIVATE_KEY }}
          owner: exampleorg
          repositories: example-review-actions
          permission-actions: read
          permission-contents: read

      - name: Validate payload, current PR, and immutable caller
        id: request
        working-directory: .exampleorg-review-actions
        env:
          GH_TARGET_TOKEN: ${{ steps.target_token_public.outputs.token || steps.target_token_exampleorg.outputs.token }}
          GH_CENTRAL_TOKEN: ${{ steps.central_token.outputs.token }}
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          CENTRAL_DISPATCH_PAYLOAD: ${{ steps.payload.outputs.payload }}
        run: node scripts/validate-central-dispatch.mjs

  review:
    name: Review Yeti at promoted v1
    needs: validate
    uses: exampleorg/example-review-actions/.github/workflows/review-yeti.yml@v1
    with:
      central_execution: true
      request_id: ${{ needs.validate.outputs.request_id }}
      repository: ${{ needs.validate.outputs.repository }}
      pr_number: ${{ fromJSON(needs.validate.outputs.pr_number) }}
      base_sha: ${{ needs.validate.outputs.base_sha }}
      head_sha: ${{ needs.validate.outputs.head_sha }}
      refresh_requested: ${{ needs.validate.outputs.refresh_requested == 'true' }}
      refresh_execution_attempt: ${{ fromJSON(needs.validate.outputs.refresh_execution_attempt) }}
      expected_generation: ${{ fromJSON(needs.validate.outputs.review_generation) }}
      passthrough: ${{ vars.REVIEW_YETI_PASSTHROUGH == 'true' }}
      execution_backend: doks
    secrets: inherit
