name: Validate central review contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: review-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify exact Pi runtime closure
        working-directory: qualification/pi-runtime
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --silent
          node --input-type=module -e "const runtime = await import('@agwab/pi-workflow'); if (typeof runtime.runWorkflowSpec !== 'function' || typeof runtime.waitForRun !== 'function') process.exit(1);"
      - name: Validate policy and scripts
        run: |
          node --check scripts/emit-policy.mjs
          node --check scripts/emit-execution-plan.mjs
          node --check scripts/deliver-passthrough.test.mjs
          node --check scripts/emit-execution-plan.test.mjs
          node --check scripts/validate-central-dispatch.mjs
          node --check scripts/validate-central-dispatch.test.mjs
          node --check scripts/validate-central-dispatch.replay.test.mjs
          node --check scripts/review-readiness.mjs
          node --check scripts/review-check-contract.mjs
          node --check scripts/review-check-contract.test.mjs
          node --check scripts/review-readiness.test.mjs
          node --check scripts/verify-merge-group.test.mjs
          node --check .github/actions/verify-merge-group/verify-merge-group.mjs
          node --check scripts/validate-transport-handoff.mjs
          node --check scripts/review-yeti-local.mjs
          node --check scripts/review-yeti-mcp.mjs
          node --check scripts/ollama-qualification.mjs
          node --check scripts/openrouter-qualification.mjs
          node --check scripts/pi-openrouter-qualification.mjs
          node --check scripts/run-pi-qualification-row.mjs
          node --check scripts/transport-telemetry.mjs
          node --check scripts/transport-telemetry-report.mjs
          node --check scripts/annotate-transport-failover.mjs
          node --check scripts/annotate-transport-failover.test.mjs
          node --check scripts/align-panel-seed-key.mjs
          node --check scripts/align-panel-seed-key.test.mjs
          GITHUB_OUTPUT="$RUNNER_TEMP/policy-output" node scripts/emit-policy.mjs
          node scripts/emit-execution-plan.mjs --check
          grep -Eq '^action_ref<<' "$RUNNER_TEMP/policy-output" || { echo "::error::emit-policy.mjs did not emit action_ref"; exit 1; }
          bash -n scripts/validate-review-request.sh
          bash -n scripts/validate-caller-workflow.sh
          bash -n scripts/emit-workflow-identity.sh
          bash -n scripts/emit-workflow-identity.test.sh
          bash -n scripts/check-review-verdict.sh
          bash -n scripts/promote-v1.sh
          bash -n scripts/self-cancel-run.sh
          bash -n scripts/review-yeti-release.sh
          bash -n scripts/review-yeti-local
          bash -n scripts/resolve-release-channel.sh
          bash -n scripts/validate-release-provenance.sh
          bash -n scripts/doks-action-qualification.test.sh
          bash -n scripts/worker-parity-qualification.test.sh
          bash -n scripts/emit-policy.test.sh
          bash -n scripts/validate-caller-workflow.test.sh
          bash -n scripts/promote-v1.test.sh
          bash -n scripts/validate-review-request.test.sh
          bash -n scripts/check-review-verdict.test.sh
          bash -n scripts/publish-review-check-run.sh
          bash -n scripts/publish-review-check-run.test.sh
          bash -n scripts/hold-for-review.sh
          bash -n scripts/hold-for-review.test.sh
          bash -n .github/actions/hold-for-review/hold-for-review.sh
          bash -n scripts/self-cancel-run.test.sh
          bash scripts/validate-caller-workflow.test.sh
          bash scripts/emit-workflow-identity.test.sh
          bash scripts/promote-v1.test.sh
          bash scripts/validate-review-request.test.sh
          bash scripts/check-review-verdict.test.sh
          bash scripts/publish-review-check-run.test.sh
          bash scripts/hold-for-review.test.sh
          bash scripts/self-cancel-run.test.sh
          bash scripts/emit-policy.test.sh
          bash scripts/doks-action-qualification.test.sh
          bash scripts/worker-parity-qualification.test.sh
          bash scripts/release-channel.test.sh
          grep -Eq '^action_ref<<' "$RUNNER_TEMP/policy-output"
          grep -Eq '^repository<<' "$RUNNER_TEMP/policy-output"
          node --test scripts/deliver-passthrough.test.mjs
          node --test scripts/review-yeti-smoke.test.mjs
          node --test scripts/align-panel-seed-key.test.mjs
          node --test scripts/emit-execution-plan.test.mjs
          node --test scripts/validate-central-dispatch.test.mjs
          node --test scripts/validate-central-dispatch.replay.test.mjs
          node --test scripts/review-readiness.test.mjs
          node --test scripts/review-check-contract.test.mjs
          node --test scripts/verify-merge-group.test.mjs
          node --test scripts/validate-transport-handoff.test.mjs
          node --test scripts/review-yeti-local.test.mjs
          node --test scripts/review-yeti-mcp.test.mjs
          node --test scripts/ollama-qualification.test.mjs
          node --test scripts/openrouter-qualification.test.mjs
          node --test scripts/pi-openrouter-qualification.test.mjs
          node --test scripts/transport-telemetry.test.mjs
          node --test scripts/transport-telemetry-report.test.mjs
          node --test scripts/annotate-transport-failover.test.mjs
          test -s policy/review-yeti.json
          grep -Fq '"action_channel_pattern":' policy/review-yeti.json
          grep -Fq '"name": "gemini"' policy/review-yeti.json
          jq -e '.review_yeti.transports[] | select(.name == "gemini") | .enabled == false' policy/review-yeti.json >/dev/null
          grep -Fq '"name": "fireworks"' policy/review-yeti.json
          jq -e '.review_yeti.transports[] | select(.name == "fireworks") | .enabled == false' policy/review-yeti.json >/dev/null
          grep -Fq '"name": "ollama"' policy/review-yeti.json
          jq -e '.review_yeti.transports[] | select(.name == "ollama") | .enabled == false' policy/review-yeti.json >/dev/null
          grep -Fq '"name": "bifrost"' policy/review-yeti.json
          jq -e '.review_yeti.transports[] | select(.name == "bifrost") | .enabled == true' policy/review-yeti.json >/dev/null
          grep -Fq '"name": "synthetic"' policy/review-yeti.json
          grep -Fq '"name": "openrouter-primary"' policy/review-yeti.json
          grep -Fq '"model": "z-ai/glm-5.3-flash"' policy/review-yeti.json
          grep -Fq '"models": []' policy/review-yeti.json
          ! grep -Fqi 'deepseek' policy/review-yeti.json
          grep -Fq '"allow_fallbacks": true' policy/review-yeti.json
          grep -Fq '"sort": "throughput"' policy/review-yeti.json
          grep -Fq '"p90": 40' policy/review-yeti.json
          grep -Fq '"p99": 3' policy/review-yeti.json
          jq -e '.review_yeti.transports[] | select(.name == "openrouter-primary") | .enabled == true' policy/review-yeti.json >/dev/null
          jq -e '.review_yeti.transports[] | select(.name == "synthetic") | .enabled == false' policy/review-yeti.json >/dev/null
          jq -e '.review_yeti.transports[] | select(.name == "openrouter-primary") | .provider_routing.ignore == ["morph", "fireworks"]' policy/review-yeti.json >/dev/null
          jq -e '.review_yeti.transports[] | select(.name == "openrouter-primary") | .ignore_providers == ["morph", "fireworks"]' policy/review-yeti.json >/dev/null
          grep -Eq 'review-yeti.yml@main$' .github/workflows/self-review.yml
          grep -Fq 'OPENROUTER_REVIEW_FLEET_KEY:' .github/workflows/review-yeti.yml
          grep -Fq 'secrets.OPENROUTER_REVIEW_FLEET_KEY' .github/workflows/review-yeti.yml
          grep -Fq 'REVIEW_YETI_BIFROST_API_KEY:' .github/workflows/review-yeti.yml
          grep -Fq 'secrets.REVIEW_YETI_BIFROST_API_KEY' .github/workflows/review-yeti.yml
          if grep -E 'secrets\.[A-Z0-9_]+[[:space:]]*\|\|[[:space:]]*secrets\.' .github/workflows/review-yeti.yml .github/workflows/transport-telemetry.yml; then
            echo '::error::secret-key || fallback is forbidden; use a single canonical secret name'
            exit 1
          fi
          grep -Fq 'OLLAMA_PR_REVIEW_API_KEY:' .github/workflows/review-yeti.yml
          grep -Fq 'secrets.OLLAMA_PR_REVIEW_API_KEY' .github/workflows/review-yeti.yml
          # Policy-derived, not another hardcoded name: every ENABLED transport's api_key_env must
          # be wired into the telemetry probe. Hardcoded greps are what let this drift -- the five
          # disabled transports were all wired while `bifrost`, the only enabled one, was not, so
          # it recorded `skipped: no_credential` on every run and the ledger carried no evidence
          # for the transport actually serving reviews. Deriving the list from policy means
          # enabling a transport now fails CI until its credential reaches the probe.
          missing=""
          for env_name in $(jq -r '.review_yeti.transports[] | select(.enabled == true) | .api_key_env' policy/review-yeti.json); do
            grep -Fq "${env_name}:" .github/workflows/transport-telemetry.yml || missing="${missing} ${env_name}"
          done
          if [ -n "${missing}" ]; then
            echo "::error::enabled transport credential(s) not wired into transport-telemetry.yml:${missing}"
            exit 1
          fi
          grep -Fq 'GEMINI_API_KEY:' .github/workflows/review-yeti.yml
          grep -Fq 'secrets.GEMINI_API_KEY' .github/workflows/review-yeti.yml
          grep -Fq 'SYNTHETIC_API_KEY:' .github/workflows/review-yeti.yml
          grep -Fq 'secrets.SYNTHETIC_API_KEY' .github/workflows/review-yeti.yml
          resolved_base_url_marker='llm-base-url: $''{{ steps.smoke.outputs.resolved_base_url }}'
          resolved_model_marker='model: $''{{ steps.smoke.outputs.resolved_model }}'
          grep -Fq "$resolved_base_url_marker" .github/workflows/review-yeti.yml
          grep -Fq "$resolved_model_marker" .github/workflows/review-yeti.yml
          grep -Fq 'action-sha:' .github/workflows/review-yeti.yml
          grep -Fq 'openrouter-data-collection:' .github/workflows/review-yeti.yml
          grep -Fq 'max-diff-chars:' .github/workflows/review-yeti.yml
          grep -Fq 'personas:' .github/workflows/review-yeti.yml
          grep -Fq 'context7-api-key:' .github/workflows/review-yeti.yml
          test -f .github/workflows/repository-dispatch.yml
          grep -Fq 'types: [review-yeti-request]' .github/workflows/repository-dispatch.yml
          grep -Fq 'uses: exampleorg/example-review-actions/.github/workflows/review-yeti.yml@v1' .github/workflows/repository-dispatch.yml
          # ADR 0511 / REL-540: the receiver validates the target as the
          # ct-review-bot App; a PAT must never reappear here.
          grep -Fq 'app-id: $''{{ secrets.CT_REVIEW_BOT_APP_ID }}' .github/workflows/repository-dispatch.yml
          if grep -Fq 'secrets.CROSS_REPO_TOKEN' .github/workflows/repository-dispatch.yml; then
            echo "::error::the central receiver must not use the operator PAT (ADR 0511)"
            exit 1
          fi
          test -f .github/workflows/ollama-qualification.yml
          test -f .github/workflows/openrouter-qualification.yml
          grep -Fq 'workflow_dispatch:' .github/workflows/ollama-qualification.yml
          grep -Fq 'workflow_dispatch:' .github/workflows/openrouter-qualification.yml
          grep -Eq '^    timeout-minutes: 15$' .github/workflows/ollama-qualification.yml
          grep -Eq '^    timeout-minutes: 15$' .github/workflows/openrouter-qualification.yml
          if grep -Eq '^    timeout-minutes: (1[6-9]|[2-9][0-9]|[1-9][0-9]{2,})$' .github/workflows/ollama-qualification.yml; then
            echo "::error::qualification workflow may not exceed the 15-minute hard ceiling"
            exit 1
          fi
          if grep -Eq '^    timeout-minutes: (1[6-9]|[2-9][0-9]|[1-9][0-9]{2,})$' .github/workflows/openrouter-qualification.yml; then
            echo "::error::OpenRouter qualification workflow may not exceed the 15-minute hard ceiling"
            exit 1
          fi
          if grep -Eq '^  (schedule|pull_request|pull_request_target|repository_dispatch|workflow_run):' .github/workflows/ollama-qualification.yml; then
            echo "::error::Fireworks/Ollama comparison must remain manual and non-recurring"
            exit 1
          fi
          if grep -Eq '^  (schedule|pull_request|pull_request_target|repository_dispatch|workflow_run):' .github/workflows/openrouter-qualification.yml; then
            echo "::error::OpenRouter qualification must remain manual and non-recurring"
            exit 1
          fi
          test -f .github/workflows/transport-telemetry.yml
          grep -Fq 'schedule:' .github/workflows/transport-telemetry.yml
          grep -Fq 'workflow_dispatch:' .github/workflows/transport-telemetry.yml
          grep -Eq '^    timeout-minutes: 15$' .github/workflows/transport-telemetry.yml
          if grep -Eq '^    timeout-minutes: (1[6-9]|[2-9][0-9]|[1-9][0-9]{2,})$' .github/workflows/transport-telemetry.yml; then
            echo "::error::transport telemetry workflow may not exceed the 15-minute hard ceiling"
            exit 1
          fi
          grep -Eq '^permissions:$' .github/workflows/transport-telemetry.yml
          grep -Fq 'contents: read' .github/workflows/transport-telemetry.yml
          if grep -Eq '^  (pull_request|pull_request_target):' .github/workflows/transport-telemetry.yml; then
            echo "::error::transport telemetry must never trigger on a pull request event"
            exit 1
          fi
          if grep -Fq 'refs/heads/main' .github/workflows/transport-telemetry.yml; then
            echo "::error::transport telemetry must never push to main"
            exit 1
          fi
          grep -Fq 'refs/heads/telemetry' .github/workflows/transport-telemetry.yml
          grep -Fq "publication: 'none'" scripts/transport-telemetry.mjs
          grep -Fq "production_authority: 'unchanged'" scripts/transport-telemetry.mjs
          grep -Fq 'publication=none' scripts/ollama-qualification.mjs
          grep -Fq 'authoritative_arm: '\''none'\''' scripts/ollama-qualification.mjs
          grep -Fq 'production_authority: '\''unchanged'\''' scripts/ollama-qualification.mjs
          grep -Fq "publication: 'none'" scripts/openrouter-qualification.mjs
          grep -Fq "authoritative_arm: 'none'" scripts/openrouter-qualification.mjs
          grep -Fq "production_authority: 'unchanged'" scripts/openrouter-qualification.mjs
          if grep -Fq 'continue-on-error: true' .github/workflows/ollama-qualification.yml; then
            echo "::error::comparison integrity failures must fail the workflow"
            exit 1
          fi
          grep -Fq 'healthy_transports' .github/workflows/review-yeti.yml
          grep -Fq 'transport-plan-b64:' .github/workflows/review-yeti.yml
          grep -Fq 'transport_plan_b64' scripts/emit-policy.mjs
          grep -Fq 'github.event.pull_request.head.sha' .github/workflows/review-yeti.yml
          grep -Fq 'github.event.pull_request.head.repo.full_name' .github/workflows/review-yeti.yml
          if grep -Eq '"action_sha(_override)?"|central-sha:' policy/review-yeti.json .github/workflows/self-review.yml; then
            echo "::error::per-repository SHA claims are forbidden; use the central release channel"
            exit 1
          fi
      - name: Reject malformed action_channel policy
        run: |
          tmp_negative="$(mktemp -d)"
          mkdir -p "$tmp_negative/scripts" "$tmp_negative/policy"
          cp scripts/emit-policy.mjs "$tmp_negative/scripts/emit-policy.mjs"
          jq '.review_yeti.action_channel = "main"' policy/review-yeti.json > "$tmp_negative/policy/review-yeti.json"
          if GITHUB_OUTPUT="$RUNNER_TEMP/policy-output-negative" node "$tmp_negative/scripts/emit-policy.mjs"; then
            echo "::error::emit-policy.mjs accepted a malformed action_channel (expected non-zero exit)"
            exit 1
          fi
          echo "Negative test passed: malformed action_channel was rejected."
