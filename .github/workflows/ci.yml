name: Validate central review contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: review-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify exact Pi runtime closure
        working-directory: qualification/pi-runtime
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --silent
          node --input-type=module -e "const runtime = await import('@agwab/pi-workflow'); if (typeof runtime.runWorkflowSpec !== 'function' || typeof runtime.waitForRun !== 'function') process.exit(1);"
      - name: Validate policy and scripts
        run: |
          node --check scripts/emit-policy.mjs
          node --check scripts/emit-execution-plan.mjs
          node --check scripts/emit-execution-plan.test.mjs
          node --check scripts/validate-transport-handoff.mjs
          node --check scripts/review-yeti-local.mjs
          node --check scripts/review-yeti-mcp.mjs
          node --check scripts/ollama-qualification.mjs
          node --check scripts/openrouter-qualification.mjs
          node --check scripts/pi-openrouter-qualification.mjs
          node --check scripts/run-pi-qualification-row.mjs
          GITHUB_OUTPUT="$RUNNER_TEMP/policy-output" node scripts/emit-policy.mjs
          node scripts/emit-execution-plan.mjs --check
          grep -Eq '^action_ref<<' "$RUNNER_TEMP/policy-output" || { echo "::error::emit-policy.mjs did not emit action_ref"; exit 1; }
          bash -n scripts/validate-review-request.sh
          bash -n scripts/validate-caller-workflow.sh
          bash -n scripts/check-review-verdict.sh
          bash -n scripts/promote-v1.sh
          bash -n scripts/self-cancel-run.sh
          bash -n scripts/review-yeti-release.sh
          bash -n scripts/review-yeti-local
          bash -n scripts/resolve-release-channel.sh
          bash -n scripts/validate-release-provenance.sh
          bash -n scripts/emit-policy.test.sh
          bash -n scripts/validate-caller-workflow.test.sh
          bash -n scripts/promote-v1.test.sh
          bash -n scripts/validate-review-request.test.sh
          bash -n scripts/check-review-verdict.test.sh
          bash -n scripts/self-cancel-run.test.sh
          bash scripts/validate-caller-workflow.test.sh
          bash scripts/promote-v1.test.sh
          bash scripts/validate-review-request.test.sh
          bash scripts/check-review-verdict.test.sh
          bash scripts/self-cancel-run.test.sh
          bash scripts/emit-policy.test.sh
          bash scripts/release-channel.test.sh
          grep -Eq '^action_ref<<' "$RUNNER_TEMP/policy-output"
          grep -Eq '^repository<<' "$RUNNER_TEMP/policy-output"
          node --test scripts/review-yeti-smoke.test.mjs
          node --test scripts/emit-execution-plan.test.mjs
          node --test scripts/validate-transport-handoff.test.mjs
          node --test scripts/review-yeti-local.test.mjs
          node --test scripts/review-yeti-mcp.test.mjs
          node --test scripts/ollama-qualification.test.mjs
          node --test scripts/openrouter-qualification.test.mjs
          node --test scripts/pi-openrouter-qualification.test.mjs
          test -s policy/review-yeti.json
          grep -Fq '"action_channel_pattern":' policy/review-yeti.json
          grep -Fq '"name": "gemini"' policy/review-yeti.json
          grep -Fq '"name": "fireworks"' policy/review-yeti.json
          grep -Fq '"name": "ollama"' policy/review-yeti.json
          grep -Fq '"name": "synthetic"' policy/review-yeti.json
          grep -Fq '"name": "openrouter-fallback"' policy/review-yeti.json
          grep -Fq '"model": "~deepseek/deepseek-v4-flash-latest"' policy/review-yeti.json
          grep -Fq '"models": ["z-ai/glm-5.3-flash"]' policy/review-yeti.json
          grep -Fq '"allow_fallbacks": true' policy/review-yeti.json
          grep -Fq '"sort": "throughput"' policy/review-yeti.json
          grep -Fq '"p90": 40' policy/review-yeti.json
          grep -Fq '"p99": 3' policy/review-yeti.json
          jq -e '.review_yeti.transports[] | select(.name == "openrouter-fallback") | .provider_routing.ignore == ["morph", "fireworks"]' policy/review-yeti.json >/dev/null
          jq -e '.review_yeti.transports[] | select(.name == "openrouter-fallback") | .ignore_providers == ["morph", "fireworks"]' policy/review-yeti.json >/dev/null
          grep -Eq 'review-yeti.yml@main$' .github/workflows/self-review.yml
          grep -Fq 'OPENROUTER_API_KEY:' .github/workflows/review-yeti.yml
          grep -Fq 'secrets.OPENROUTER_REVIEW_FLEET_KEY' .github/workflows/review-yeti.yml
          grep -Fq 'OLLAMA_PR_REVIEW_API_KEY:' .github/workflows/review-yeti.yml
          grep -Fq 'secrets.OLLAMA_PR_REVIEW_API_KEY' .github/workflows/review-yeti.yml
          grep -Fq 'GEMINI_API_KEY:' .github/workflows/review-yeti.yml
          grep -Fq 'secrets.GEMINI_API_KEY' .github/workflows/review-yeti.yml
          grep -Fq 'SYNTHETIC_API_KEY:' .github/workflows/review-yeti.yml
          grep -Fq 'secrets.SYNTHETIC_API_KEY' .github/workflows/review-yeti.yml
          grep -Fq 'llm-base-url: https://openrouter.ai/api/v1' .github/workflows/review-yeti.yml
          grep -Fq "model: '~deepseek/deepseek-v4-flash-latest'" .github/workflows/review-yeti.yml
          grep -Fq 'action-sha:' .github/workflows/review-yeti.yml
          grep -Fq 'openrouter-data-collection:' .github/workflows/review-yeti.yml
          grep -Fq 'max-diff-chars:' .github/workflows/review-yeti.yml
          grep -Fq 'personas:' .github/workflows/review-yeti.yml
          grep -Fq 'context7-api-key:' .github/workflows/review-yeti.yml
          test -f .github/workflows/ollama-qualification.yml
          test -f .github/workflows/openrouter-qualification.yml
          grep -Fq 'workflow_dispatch:' .github/workflows/ollama-qualification.yml
          grep -Fq 'workflow_dispatch:' .github/workflows/openrouter-qualification.yml
          grep -Eq '^    timeout-minutes: 15$' .github/workflows/ollama-qualification.yml
          grep -Eq '^    timeout-minutes: 15$' .github/workflows/openrouter-qualification.yml
          if grep -Eq '^    timeout-minutes: (1[6-9]|[2-9][0-9]|[1-9][0-9]{2,})$' .github/workflows/ollama-qualification.yml; then
            echo "::error::qualification workflow may not exceed the 15-minute hard ceiling"
            exit 1
          fi
          if grep -Eq '^    timeout-minutes: (1[6-9]|[2-9][0-9]|[1-9][0-9]{2,})$' .github/workflows/openrouter-qualification.yml; then
            echo "::error::OpenRouter qualification workflow may not exceed the 15-minute hard ceiling"
            exit 1
          fi
          if grep -Eq '^  (schedule|pull_request|pull_request_target|repository_dispatch|workflow_run):' .github/workflows/ollama-qualification.yml; then
            echo "::error::Fireworks/Ollama comparison must remain manual and non-recurring"
            exit 1
          fi
          if grep -Eq '^  (schedule|pull_request|pull_request_target|repository_dispatch|workflow_run):' .github/workflows/openrouter-qualification.yml; then
            echo "::error::OpenRouter qualification must remain manual and non-recurring"
            exit 1
          fi
          grep -Fq 'publication=none' scripts/ollama-qualification.mjs
          grep -Fq 'authoritative_arm: '\''none'\''' scripts/ollama-qualification.mjs
          grep -Fq 'production_authority: '\''unchanged'\''' scripts/ollama-qualification.mjs
          grep -Fq "publication: 'none'" scripts/openrouter-qualification.mjs
          grep -Fq "authoritative_arm: 'none'" scripts/openrouter-qualification.mjs
          grep -Fq "production_authority: 'unchanged'" scripts/openrouter-qualification.mjs
          if grep -Fq 'continue-on-error: true' .github/workflows/ollama-qualification.yml; then
            echo "::error::comparison integrity failures must fail the workflow"
            exit 1
          fi
          grep -Fq 'healthy_transports' .github/workflows/review-yeti.yml
          grep -Fq 'transport-plan-b64:' .github/workflows/review-yeti.yml
          grep -Fq 'transport_plan_b64' scripts/emit-policy.mjs
          grep -Fq 'github.event.pull_request.head.sha' .github/workflows/review-yeti.yml
          grep -Fq 'github.event.pull_request.head.repo.full_name' .github/workflows/review-yeti.yml
          if grep -Eq '"action_sha(_override)?"|central-sha:' policy/review-yeti.json .github/workflows/self-review.yml; then
            echo "::error::per-repository SHA claims are forbidden; use the central release channel"
            exit 1
          fi
      - name: Reject malformed action_channel policy
        run: |
          tmp_negative="$(mktemp -d)"
          mkdir -p "$tmp_negative/scripts" "$tmp_negative/policy"
          cp scripts/emit-policy.mjs "$tmp_negative/scripts/emit-policy.mjs"
          jq '.review_yeti.action_channel = "main"' policy/review-yeti.json > "$tmp_negative/policy/review-yeti.json"
          if GITHUB_OUTPUT="$RUNNER_TEMP/policy-output-negative" node "$tmp_negative/scripts/emit-policy.mjs"; then
            echo "::error::emit-policy.mjs accepted a malformed action_channel (expected non-zero exit)"
            exit 1
          fi
          echo "Negative test passed: malformed action_channel was rejected."
