name: Validate central review contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: review-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Validate policy and scripts
        run: |
          node --check scripts/emit-policy.mjs
          GITHUB_OUTPUT="$RUNNER_TEMP/policy-output" node scripts/emit-policy.mjs
          grep -Eq '^action_ref<<' "$RUNNER_TEMP/policy-output" || { echo "::error::emit-policy.mjs did not emit action_ref"; exit 1; }
          bash -n scripts/validate-review-request.sh
          bash -n scripts/validate-caller-workflow.sh
          bash -n scripts/check-review-verdict.sh
          bash -n scripts/promote-v1.sh
          bash -n scripts/self-cancel-run.sh
          bash -n scripts/review-yeti-release.sh
          bash -n scripts/resolve-release-channel.sh
          bash -n scripts/validate-release-provenance.sh
          bash -n scripts/emit-policy.test.sh
          bash -n scripts/validate-caller-workflow.test.sh
          bash -n scripts/promote-v1.test.sh
          bash -n scripts/validate-review-request.test.sh
          bash -n scripts/check-review-verdict.test.sh
          bash -n scripts/self-cancel-run.test.sh
          bash scripts/validate-caller-workflow.test.sh
          bash scripts/promote-v1.test.sh
          bash scripts/validate-review-request.test.sh
          bash scripts/check-review-verdict.test.sh
          bash scripts/self-cancel-run.test.sh
          bash scripts/emit-policy.test.sh
          bash scripts/release-channel.test.sh
          grep -Eq '^action_ref<<' "$RUNNER_TEMP/policy-output"
          grep -Eq '^repository<<' "$RUNNER_TEMP/policy-output"
          node --test scripts/review-yeti-smoke.test.mjs
          test -s policy/review-yeti.json
          grep -Fq '"action_channel_pattern":' policy/review-yeti.json
          grep -Fq '"name": "fireworks"' policy/review-yeti.json
          grep -Fq '"name": "ollama"' policy/review-yeti.json
          grep -Fq '"name": "openrouter-fallback"' policy/review-yeti.json
          grep -Fq '"allow_fallbacks": true' policy/review-yeti.json
          grep -Fq '"quantizations": ["bf16", "fp16"]' policy/review-yeti.json
          grep -Fq '"sort": "throughput"' policy/review-yeti.json
          grep -Fq '"p90": 40' policy/review-yeti.json
          grep -Fq '"p99": 3' policy/review-yeti.json
          grep -Fq '"fireworks"' policy/review-yeti.json
          grep -Eq 'review-yeti.yml@main$' .github/workflows/self-review.yml
          grep -Fq 'OPENROUTER_API_KEY:' .github/workflows/review-yeti.yml
          grep -Fq 'secrets.OPENROUTER_PR_REVIEW_API_KEY' .github/workflows/review-yeti.yml
          grep -Fq 'OLLAMA_PR_REVIEW_API_KEY:' .github/workflows/review-yeti.yml
          grep -Fq 'secrets.OLLAMA_PR_REVIEW_API_KEY' .github/workflows/review-yeti.yml
          grep -Fq 'openrouter-data-collection:' .github/workflows/review-yeti.yml
          grep -Fq 'openrouter-ignore-providers:' .github/workflows/review-yeti.yml
          grep -Fq 'openrouter-provider-routing:' .github/workflows/review-yeti.yml
          grep -Fq 'github.event.pull_request.head.sha' .github/workflows/review-yeti.yml
          grep -Fq 'github.event.pull_request.head.repo.full_name' .github/workflows/review-yeti.yml
          if grep -Eq '"action_sha(_override)?"|central-sha:' policy/review-yeti.json .github/workflows/self-review.yml; then
            echo "::error::per-repository SHA claims are forbidden; use the central release channel"
            exit 1
          fi
      - name: Reject malformed action_channel policy
        run: |
          tmp_negative="$(mktemp -d)"
          mkdir -p "$tmp_negative/scripts" "$tmp_negative/policy"
          cp scripts/emit-policy.mjs "$tmp_negative/scripts/emit-policy.mjs"
          jq '.review_yeti.action_channel = "main"' policy/review-yeti.json > "$tmp_negative/policy/review-yeti.json"
          if GITHUB_OUTPUT="$RUNNER_TEMP/policy-output-negative" node "$tmp_negative/scripts/emit-policy.mjs"; then
            echo "::error::emit-policy.mjs accepted a malformed action_channel (expected non-zero exit)"
            exit 1
          fi
          echo "Negative test passed: malformed action_channel was rejected."
