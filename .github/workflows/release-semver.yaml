name: Release SemVer Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DigitalOcean Container Registry
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Authenticate doctl registry
        run: doctl registry login

      - name: Build and push SemVer Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: registry.digitalocean.com/calltelemetry/ct-review-bot:${{ github.ref_name }}
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot

      - name: Configure K8s cluster kubeconfig
        run: doctl kubernetes cluster kubeconfig save cluster-ny1

      - name: Deploy image update to DOKS
        run: |
          kubectl set image deployment/ct-review-bot ct-review-bot=registry.digitalocean.com/calltelemetry/ct-review-bot:${GITHUB_REF_NAME} -n ct-review-system
          kubectl rollout status deployment/ct-review-bot -n ct-review-system
