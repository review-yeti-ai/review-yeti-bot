name: Automated SemVer Release & DOKS Deployment

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CLUSTER_NAME: cluster-ny1
  REGISTRY: registry.digitalocean.com/calltelemetry

jobs:
  semver-release:
    name: Build SemVer Release & Deploy to DOKS
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Tag / Version
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Release version: ${VERSION}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit & Integration Tests
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry (DOCR)
        run: doctl registry login

      - name: Build and Push Tagged Docker Image (DOCR)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/ct-review-bot:${{ env.VERSION }}
            ${{ env.REGISTRY }}/ct-review-bot:latest

      - name: Save DOKS kubeconfig
        run: doctl kubernetes cluster kubeconfig save ${{ env.CLUSTER_NAME }}

      - name: Deploy SemVer Release to DOKS
        run: |
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl set image deployment/ct-review-bot ct-review-bot=${{ env.REGISTRY }}/ct-review-bot:${{ env.VERSION }}
          kubectl rollout status deployment/ct-review-bot --timeout=180s

      - name: Create GitHub Release Artifact
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          generate_release_notes: true
