name: Merge a pull request as the GitHub App

# Squash and merge records the pull request author's identity, and rebase and merge records the merging user's,
# so merging with a personal or shared account puts that identity into the history. This job merges with the
# review GitHub App's installation token and the rebase method, so the commits keep their (neutral) authors and the
# committer is the App. Branch protection still applies: the App is not an administrator.

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: "Pull request number to merge (all required checks must already be green)"
        type: string
        required: true

permissions:
  contents: read

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.REVIEW_YETI_DISPATCH_APP_ID }}
          private-key: ${{ secrets.REVIEW_YETI_DISPATCH_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
      - name: Merge
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ inputs.pull_request }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${PR}" =~ ^[0-9]+$ ]] || { echo "::error::pull_request must be a number"; exit 1; }
          gh pr merge "${PR}" --repo "${GITHUB_REPOSITORY}" --rebase
