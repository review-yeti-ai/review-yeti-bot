name: Release

# Manual release cut: runs the full test battery, tags the version, creates
# the GitHub Release with build provenance attestation, then fast-forwards
# the floating channel tag (default v1). This workflow is the ONLY mover of
# the channel tag — no human should move it by hand after this lands.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to cut, e.g. v1.2.5"
        required: true
        type: string
      channel:
        description: "Floating channel tag to fast-forward, e.g. v1"
        required: false
        type: string
        default: "v1"

concurrency:
  group: release
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_PREFER_OFFLINE: "true"

jobs:
  validate-inputs:
    name: Validate inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Validate version and channel format
        run: |
          version="${{ inputs.version }}"
          channel="${{ inputs.channel }}"

          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '$version' is invalid. Expected format vMAJOR.MINOR.PATCH, e.g. v1.2.5"
            exit 1
          fi

          if [[ ! "$channel" =~ ^v[0-9]+$ ]]; then
            echo "::error::channel '$channel' is invalid. Expected format vMAJOR, e.g. v1"
            exit 1
          fi

          echo "version=$version is valid"
          echo "channel=$channel is valid"

  battery:
    name: Full test battery
    needs: validate-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Full test battery (test:all)
        run: npm run test:all

  release:
    name: Tag, release, and move channel
    needs: battery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Configure git identity
        run: |
          git config user.name "review-yeti-release-bot"
          git config user.email "release-bot@users.noreply.github.com"

      - name: Create annotated release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git tag -a "$VERSION" "$GITHUB_SHA" -m "Release $VERSION"
          git push origin "refs/tags/$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            --target "$GITHUB_SHA"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            action.yml
            dist/**

      - name: Fast-forward channel tag
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          git push origin "+${GITHUB_SHA}:refs/tags/${CHANNEL}"

      - name: Post-verify channel tag points at release SHA
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          resolved_sha="$(git ls-remote origin "refs/tags/${CHANNEL}" | cut -f1)"
          if [ "$resolved_sha" != "$GITHUB_SHA" ]; then
            echo "::error::channel tag ${CHANNEL} resolved to ${resolved_sha}, expected ${GITHUB_SHA}"
            exit 1
          fi
          echo "channel ${CHANNEL} verified at ${resolved_sha}"

      - name: Write step summary
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          {
            echo "## Release complete"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Version | \`${VERSION}\` |"
            echo "| SHA | \`${GITHUB_SHA}\` |"
            echo "| Channel | \`${CHANNEL}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
