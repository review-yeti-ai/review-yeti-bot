name: Review Bot (Blacksmith Runner)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  repository_dispatch:
    types: [review-requested, re-review-requested, dispatch-review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Execute AI Review Pipeline
    runs-on: blacksmith-2vcpu-ubuntu-2204
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: 'openrouter/auto'
      ENABLE_FLOWCHART: 'true'
      MAX_TURNS: '20'
      REASONING_EFFORT: 'low'
      ACTIVE_PERSONAS: ${{ toJson(github.event.client_payload.activePersonas) }}
      MCP_CONFIG_JSON: ${{ secrets.MCP_CONFIG_JSON }}
      CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      PRODUCTLANE_API_KEY: ${{ secrets.PRODUCTLANE_API_KEY }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
    steps:
      - name: Checkout Repository (Blacksmith Git Caching)
        uses: useblacksmith/checkout@v1
        with:
          ref: ${{ github.event.client_payload.ref || github.event.pull_request.head.sha || github.ref }}

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Multi-Layer Caching
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            .next/cache
            .cache
            ~/.npm
          key: ${{ runner.os }}-multi-layer-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-multi-layer-

      - name: Fast Dependency Installation
        run: npm ci --prefer-offline --no-audit

      - name: Execute Review Pipeline
        run: node .github/workflows/pipelines/review-pipeline.js
