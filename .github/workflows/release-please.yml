name: Reviewed SemVer Release PR

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    name: Open or update release PR
    runs-on: ubuntu-latest
    steps:
      # v5.0.0 uses the Node 24 action runtime; pin the action to an immutable
      # commit instead of a moving tag.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # The organization currently disables PR creation by GITHUB_TOKEN.
          # Keep the built-in token as a fallback for repositories where that
          # policy is enabled; this repository uses RELEASE_PLEASE_TOKEN.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
