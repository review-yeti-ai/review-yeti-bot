name: Release Please

# Conventional commits drive versioning automatically: release-please maintains
# a release PR on main that accumulates the changelog (feat -> minor,
# fix/perf -> patch, feat!/BREAKING CHANGE -> major). Merging that PR creates
# the semver tag + GitHub Release, which triggers release.yml's full-battery
# gate before the v1 channel moves. Humans make exactly one decision per
# release: merging the release PR.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: node
