name: v1 promotion drift alarm

# ADR-free standing patrol: every consumer repo's required Review Yeti check
# checks out the mutable `v1` branch at job start. If `v1` drifts from `main`
# (failed promotion, manual push, reverted merge), every merge in the org
# silently pins to stale validator/policy bytes. This workflow compares the
# two refs on a schedule and opens/updates one issue on drift. It never
# moves `v1` itself — promotion stays the exclusive writer.

on:
  # Hourly schedule retired: 24 runs/day polling loop replaced by on-demand dispatch
  workflow_dispatch: {}

permissions:
  contents: read
  # Both halves of this patrol write issues: the drift path opens a `v1-drift`
  # issue, and the convergence path comments on and closes it. With contents-only
  # permissions both are 403, so the alarm could never report drift and went red
  # on `set -euo pipefail` precisely when v1 and main agreed -- a patrol that
  # cannot patrol, whose only visible signal was a false red.
  issues: write

concurrency:
  group: v1-drift-alarm
  cancel-in-progress: false

jobs:
  drift-check:
    name: Compare v1 against main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare promoted v1 to main tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          v1="$(gh api repos/exampleorg/example-review-actions/commits/v1 --jq .sha)"
          main="$(gh api repos/exampleorg/example-review-actions/commits/main --jq .sha)"
          # compare/BASE...HEAD: ahead_by counts commits HEAD (main) has that BASE (v1)
          # lacks -- which is how far v1 trails. behind_by is the opposite direction and
          # reported 0 while v1 was genuinely stale, contradicting the alarm's own trigger.
          behind="$(gh api "repos/exampleorg/example-review-actions/compare/v1...main" --jq .ahead_by)"

          echo "v1=$v1"
          echo "main=$main"
          echo "main ahead of v1 by $behind commit(s)"

          if [ "$v1" = "$main" ]; then
            echo "IN SYNC"
            exit 0
          fi

          marker_url="https://github.com/exampleorg/example-review-actions/compare/v1...main"
          title="v1 promotion drift: v1 is $behind commit(s) behind main"
          body="The mutable \`v1\` branch that every consumer's required Review Yeti check resolves at job start is **$behind commit(s) behind \`main\`**. Consumers are validating against stale validator/policy bytes.\n\nv1 = $v1\nmain = $main\n\nPromotion is manual: \`gh workflow run promote-v1.yml -R exampleorg/example-review-actions --field sha=$main\` (or re-run the latest promotion attempt). Never force \`v1\` by hand."

          # The issue is a convenience, not the alarm. Issues are disabled on this
          # repository, so every POST here returns HTTP 410 and `set -e` killed the step
          # before it could report anything -- the alarm failed with an opaque git error
          # instead of naming the drift it had just measured. Filing is best effort now.
          existing=0
          if ! existing="$(gh api "repos/exampleorg/example-review-actions/issues?state=open&labels=v1-drift" --jq 'length' 2>/dev/null)"; then
            existing=0
            echo "::warning::could not read drift issues (Issues may be disabled); relying on this failing check as the alarm"
          fi

          if [ "${existing:-0}" -gt 0 ]; then
            echo "Drift issue already open — not duplicating."
          elif ! gh api repos/exampleorg/example-review-actions/issues \
            --method POST \
            -f title="$title" \
            -f body="$body" \
            -f labels[]="v1-drift" \
            --jq '.number' 2>/dev/null; then
            echo "::warning::could not file a drift issue (Issues may be disabled); relying on this failing check as the alarm"
          fi

          # Explicit: `::error::` annotates but does not fail a step. Without this the
          # alarm exited 0 whenever the issue POST succeeded -- green while v1 was stale.
          echo "::error::v1 is $behind commit(s) behind main — promotion required"
          exit 1

      - name: Close stale drift issue on convergence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v1="$(gh api repos/exampleorg/example-review-actions/commits/v1 --jq .sha)"
          main="$(gh api repos/exampleorg/example-review-actions/commits/main --jq .sha)"
          [ "$v1" = "$main" ] || exit 0

          # No open drift issue is the healthy steady state, not an error.
          open_issues="$(gh api "repos/exampleorg/example-review-actions/issues?state=open&labels=v1-drift" --jq '.[].number' || true)"
          [ -n "$open_issues" ] || { echo "v1 == main and no open drift issue — nothing to close."; exit 0; }

          for num in $open_issues; do
            gh api "repos/exampleorg/example-review-actions/issues/$num/comments" \
              --method POST -f body="v1 == main again at $v1 — drift resolved, closing." --silent
            gh api "repos/exampleorg/example-review-actions/issues/$num" \
              --method PATCH -f state=closed --silent
          done