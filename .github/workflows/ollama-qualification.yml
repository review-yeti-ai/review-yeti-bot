name: One-time Fireworks/Ollama comparison

# This workflow is intentionally manual and isolated. It is never a consumer review trigger,
# never a canary, and never a scheduled/recurring monitor. It has read-only permissions and the
# comparison script runs both provider-pinned arms over the same committed thirteen-fixture matrix,
# current testing charter, and synthetic prompt identity without a GitHub comment, check, review
# verdict, or merge decision. Production remains the only authoritative review path.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type QUALIFY to authorize one bounded comparison'
        required: true
        type: string
      repository:
        description: 'Immutable target repository, owner/name'
        required: true
        type: string
      pr_number:
        description: 'Target pull request number'
        required: true
        type: string
      base_sha:
        description: 'Exact target PR base commit SHA'
        required: true
        type: string
      head_sha:
        description: 'Exact target PR head commit SHA'
        required: true
        type: string
      bot_sha:
        description: 'Exact review-yeti-bot commit SHA to qualify'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  qualify:
    name: Paired Fireworks/Ollama evidence (no publication)
    runs-on: ubuntu-latest
    # Both provider-pinned arms are dispatched in parallel by the parent script. Each child has
    # an 8-minute wall-clock kill guard, and this 15-minute runner ceiling is the final backstop.
    # It is intentionally short: a qualification run must never become a 90-minute CI review.
    timeout-minutes: 15
    env:
      QUALIFY_CONFIRM: ${{ inputs.confirm }}
      QUALIFY_REPOSITORY: ${{ inputs.repository }}
      QUALIFY_PR_NUMBER: ${{ inputs.pr_number }}
      QUALIFY_BASE_SHA: ${{ inputs.base_sha }}
      QUALIFY_HEAD_SHA: ${{ inputs.head_sha }}
      QUALIFY_BOT_SHA: ${{ inputs.bot_sha }}
      QUALIFY_CENTRAL_SHA: ${{ github.sha }}
      QUALIFY_BOT_ROOT: ${{ github.workspace }}/review-yeti-bot
      FIREWORKS_PR_REVIEW_API_KEY: ${{ secrets.FIREWORKS_PR_REVIEW_API_KEY }}
      OLLAMA_PR_REVIEW_API_KEY: ${{ secrets.OLLAMA_PR_REVIEW_API_KEY }}
      OPENROUTER_PR_REVIEW_API_KEY: ${{ secrets.OPENROUTER_REVIEW_FLEET_KEY }}
    steps:
      # REL-539 / ADR 0511: verifyPullRequest() (scripts/ollama-qualification.mjs)
      # only ever performs a single READ — `GET /repos/{repository}/pulls/{prNumber}`
      # for exact-head verification — before dispatching the two read-only
      # qualification arms. `inputs.repository` is operator-supplied
      # "owner/name"; the ct-readonly-reader App is installed on the
      # exampleorg org only, so fail loud (not silently mis-scope) on any
      # other owner before minting.
      - name: Resolve read-only App token scope
        id: ro_scope
        env:
          TARGET_REPOSITORY: ${{ inputs.repository }}
        run: |
          set -euo pipefail
          owner="${TARGET_REPOSITORY%%/*}"
          name="${TARGET_REPOSITORY#*/}"
          if [ "$owner" != "exampleorg" ]; then
            echo "::error::ollama-qualification only qualifies PRs on exampleorg-owned repositories (got owner '${owner}')." >&2
            exit 1
          fi
          echo "repo_name=${name}" >> "$GITHUB_OUTPUT"

      - name: Mint read-only cross-repo token
        id: ro_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.CT_READONLY_APP_ID }}
          private-key: ${{ secrets.CT_READONLY_APP_PRIVATE_KEY }}
          owner: exampleorg
          repositories: ${{ steps.ro_scope.outputs.repo_name }}

      - name: Checkout central qualification tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: example-review-actions
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # review-yeti-ai/review-yeti-bot is public; the default token is sufficient.
      - name: Checkout exact Review Yeti action commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: review-yeti-ai/review-yeti-bot
          ref: ${{ inputs.bot_sha }}
          path: review-yeti-bot
          token: ${{ github.token }}
          persist-credentials: false
          fetch-depth: 1

      - name: Install isolated qualification dependencies
        working-directory: review-yeti-bot
        run: npm ci --ignore-scripts --no-audit --no-fund --silent

      - name: Announce bounded parallel dispatch
        run: |
          echo '::notice::Dispatching the Fireworks and Ollama qualification arms in parallel.'
          echo '::notice::Each arm has an 8-minute hard wall-clock deadline; workflow maximum is 15 minutes.'
          echo '::notice::Timeouts produce a failed sanitized receipt; they never trigger publication or provider mutation.'

      - name: Run bounded paired qualification
        id: qualification
        working-directory: example-review-actions
        env:
          QUALIFICATION_GH_TOKEN: ${{ steps.ro_token.outputs.token }}
        run: node scripts/ollama-qualification.mjs

      - name: Upload sanitized qualification receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ollama-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ollama-qualification/ollama-qualification-receipt.json
          if-no-files-found: warn
          retention-days: 14

      - name: State the non-authoritative boundary
        if: always()
        run: |
          echo 'Qualification was read-only evidence only.'
          echo 'Production remained authoritative; neither comparison arm could comment, check, decide, merge, or mutate provider state.'
