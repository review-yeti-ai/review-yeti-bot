self-hosted-runner:
  labels:
    - blacksmith-2vcpu-ubuntu-2404-arm

config-variables: null

# actionlint 1.7.12 does not yet model GitHub's cross-repository reusable-workflow
# `github.job_workflow_sha` context. GitHub exposes it for called jobs; the workflow validates it
# at runtime.
paths:
  .github/workflows/review-yeti.yml:
    ignore:
      - 'property "job_workflow_sha" is not defined in object type .+'
