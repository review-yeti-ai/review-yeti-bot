# review-yeti-ai/review-yeti-bot — Action review policy (read from PR base ref).
# Context7 is on by default for this repo when CONTEXT7_API_KEY is set.
version: 4

# The bounded investigation engine is production-authoritative. These are trusted-base limits;
# Action inputs may only lower them and cannot disable investigation or raise the hard ceilings.
review:
  investigation:
    max_calls: 12
    max_read_lines: 400
    max_search_matches: 50
    max_result_bytes: 8000
    max_repeated_calls: 2
    max_candidate_findings: 5
    max_verifier_calls_per_finding: 3
    max_turns: 4
    # Bounded read-only evidence tools (file_read / file_find / code_search / file_read_diff).
    # These are local reads against the immutable base+head path index plus one GitHub blob GET
    # per distinct file read. They do not spend lane-call-budget, which counts provider HTTP
    # calls only. Action inputs evidence-max-* override these.
    evidence:
      max_calls: 100
      max_scan_files: 60
      max_result_bytes: 32000
      max_find_results: 200

mcp:
  context7:
    enabled: true
    # Optional: force libraries to look up (otherwise inferred from the diff).
    # libraries: []
    # max_snippets: 5

# No artificial cheap throttle — full safety ceiling (matches action default).
limits:
  max_diff_bytes: 2000000
  max_investigation_turns: 2 # bounded dependency-evidence follow-up turns per persona pass

# Durable persona coverage is evaluated against the trusted-base enabled roster.
# complete => normal verdict; partial => PARTIAL_REVIEW/BLOCKED; incomplete => INCOMPLETE_REVIEW/BLOCKED.
coverage_policy:
  quorum: two_thirds
  min_personas: 3
  mandatory_personas: [security]
  provider_diversity_min: 2

# OpenRouter client policy for the Action path (base-ref only).
# Action inputs / repo vars override these when set.
github_action:
  openrouter:
    # Use Auto Router as the primary; the fixed DeepSeek model below is the failover.
    # deepseek/deepseek-v4-flash-latest is NOT a valid OpenRouter id.
    model: openrouter/auto-beta
    # Retry the primary once, then use this ordered fallback for transient provider failures.
    fallback_models:
      - deepseek/deepseek-v4-flash-0731
    # Hard per-request timeout. Lanes that do not return in time fail as timeout.
    timeout_ms: 30000
    # Optional Auto Router policy:
    # allowed_models: []
    # cost_quality_tradeoff: 5
    # data_collection: deny
