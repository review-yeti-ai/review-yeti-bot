apiVersion: v1
kind: Namespace
metadata:
  name: ct-llm-gateway
  labels:
    app.kubernetes.io/name: ct-llm-gateway
    app.kubernetes.io/part-of: ct-review
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ct-llm-gateway-pilot
  namespace: ct-llm-gateway
spec:
  hard:
    limits.cpu: 1200m
    limits.memory: 1280Mi
    pods: "3"
    requests.cpu: 600m
    requests.memory: 640Mi
    persistentvolumeclaims: "0"
