# Bifrost internal pilot. Secrets are supplied through the existing
# bifrost-runtime Kubernetes Secret; no credential value belongs in this file.
replicaCount: 1

image:
  repository: docker.io/maximhq/bifrost
  pullPolicy: IfNotPresent
  # Bifrost v1.5.13, linux/amd64 manifest pinned on 2026-09-02.
  tag: v1.5.13@sha256:424907512de223022836d6e61ff4e83bdcf0ad19a2caea1684663ae2ed23d91f

serviceAccount:
  create: true
  automount: false

podSecurityContext:
  fsGroup: 1000
  runAsUser: 1000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsUser: 1000
  runAsNonRoot: true

rbac:
  podDiscovery:
    enabled: false

strategy:
  type: Recreate

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: false

terminationGracePeriodSeconds: 120
lifecycle:
  preStop:
    exec:
      command: ["sh", "-c", "sleep 15"]

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: haproxy-ct-dev
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/ingress.class: haproxy-ct-dev
  hosts:
    - host: llm-gateway.example.com
      paths:
        - path: /v1
          pathType: Prefix
  tls:
    - secretName: llm-gateway-exampleorg-com-tls
      hosts:
        - llm-gateway.example.com

bifrost:
  envLabel: pilot
  logLevel: info
  logStyle: json
  setupToken: env.BIFROST_SETUP_TOKEN

  encryptionKeySecret:
    name: bifrost-runtime
    key: encryption-key

  client:
    dropExcessRequests: false
    initialPoolSize: 20
    allowedOrigins:
      - https://llm-gateway.example.com
    enableLogging: true
    disableContentLogging: true
    dumpErrorsInConsoleLogs: false
    logRetentionDays: 30
    enforceAuthOnInference: true
    maxRequestBodySizeMb: 10
    allowDirectKeys: false

  providers:
    ollama:
      keys:
        - name: ollama-team
          value: env.OLLAMA_API_KEY
          models:
            - "*"
          weight: 1
          ollama_key_config:
            url: https://ollama.com
      concurrency_and_buffer_size:
        concurrency: 10
        buffer_size: 100
      network_config:
        default_request_timeout_in_seconds: 600
        stream_idle_timeout_in_seconds: 90
        max_retries: 0

  providerSecrets:
    ollama:
      existingSecret: bifrost-runtime
      key: ollama-api-key
      envVar: OLLAMA_API_KEY

  plugins:
    telemetry:
      enabled: true
      version: 1
      config:
        metrics_enabled: true
        custom_labels:
          - workload

    logging:
      enabled: true
      version: 1
      config:
        disable_content_logging: true
        logging_headers: []

    governance:
      enabled: true
      version: 1
      config:
        is_vk_mandatory: true
        required_headers: []
        is_enterprise: false

    semanticCache:
      enabled: false

    otel:
      enabled: false

  governance:
    authConfig:
      isEnabled: true
      # Keep Basic auth on dashboard/management routes. Inference clients use
      # their scoped virtual key as the only credential.
      existingSecret: bifrost-runtime
      usernameKey: admin-username
      passwordKey: admin-password

  cluster:
    enabled: false
    discovery:
      enabled: false

storage:
  mode: postgres
  persistence:
    enabled: false
  configStore:
    enabled: true
    type: postgres
    maxIdleConns: 2
    maxOpenConns: 10
    connMaxIdleTime: 5m
  logsStore:
    enabled: true
    type: postgres
    maxIdleConns: 2
    maxOpenConns: 10
    connMaxIdleTime: 5m

postgresql:
  enabled: false
  external:
    enabled: true
    host: private-db-exampleorg-ny1-dec-23-backup-do-user-6532506-0.e.db.ondigitalocean.com
    port: 25060
    user: bifrost_gateway
    database: bifrost_gateway
    sslMode: require
    existingSecret: bifrost-runtime
    passwordKey: postgres-password

vectorStore:
  enabled: false
  type: none

env:
  - name: BIFROST_SETUP_TOKEN
    valueFrom:
      secretKeyRef:
        name: bifrost-runtime
        key: setup-token
  - name: OTEL_RESOURCE_ATTRIBUTES
    value: service.name=ct-llm-gateway,deployment.environment=pilot,service.namespace=ct-review
