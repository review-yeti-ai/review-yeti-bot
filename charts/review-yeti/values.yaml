# Default values for review-yeti.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global configuration
global:
  imageRegistry: ""
  imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Custom Resource Definition installation
# Set to true to install the PRReviewJob CRD as part of the chart templates.
# GitOps users managing CRDs out-of-band (e.g., via ArgoCD) can set this to false.
crd:
  install: true

# Review Yeti Dispatcher / Admission Webhook Service
# Receives webhook admission dispatches from GitHub Action shims or direct webhooks.
dispatcher:
  enabled: true
  replicaCount: 2

  image:
    repository: ghcr.io/review-yeti-ai/review-yeti-dispatcher
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""

  serviceAccount:
    create: true
    annotations: {}
    name: ""
    automountServiceAccountToken: false

  podAnnotations: {}
  podLabels: {}

  # Non-root pod security context enforcing standard unprivileged UID/GID
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  # Container security context with read-only rootfs and privilege escalation disabled
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    capabilities:
      drop:
        - ALL

  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
    annotations: {}

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  probes:
    startup:
      httpGet:
        path: /health
        port: http
      periodSeconds: 2
      timeoutSeconds: 1
      failureThreshold: 30
    readiness:
      httpGet:
        path: /ready
        port: http
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 3
    liveness:
      httpGet:
        path: /health
        port: http
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3

  config:
    nodeEnv: production
    host: "0.0.0.0"
    port: 3000
    # false by default. Admission accepts app-gate the moment this is true, and an
    # accepted publishing dispatch that cannot complete leaves the head with no
    # check run at all -- a required gate that blocks with nothing red. Turn it on
    # deliberately, per environment, once the lane is proven.
    allowAppGate: false
    # Zero-downtime rollout fence. Keep false until all central app-gate producers
    # supply their admitted one-based generation, then enable service enforcement.
    requireExpectedGeneration: false
    repositoryIds: ""
    ownerIds: ""
    workflowRefs: ""
    workflowShas: ""

  nodeSelector: {}
  tolerations: []
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - dispatcher
            topologyKey: kubernetes.io/hostname

# Review Yeti Operator (reconciles PRReviewJob CRD into ephemeral worker jobs)
operator:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/review-yeti-ai/review-yeti-operator
    pullPolicy: IfNotPresent
    tag: ""

  serviceAccount:
    create: true
    annotations: {}
    name: ""
    automountServiceAccountToken: true

  podAnnotations: {}
  podLabels: {}

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    capabilities:
      drop:
        - ALL

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  probes:
    startup:
      httpGet:
        path: /healthz
        port: health
      periodSeconds: 2
      timeoutSeconds: 1
      failureThreshold: 30
    readiness:
      httpGet:
        path: /readyz
        port: health
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 3
    liveness:
      httpGet:
        path: /healthz
        port: health
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3

  config:
    metricsAddr: ":8080"
    healthAddr: ":8081"
    # One six-persona panel can consume six requests from the shared ten-request
    # provider account. Keep admission account-wide and leave four slots for
    # other gateway consumers; operators with isolated capacity may raise this.
    maxConcurrentJobs: 1
    # How long a terminal PRReviewJob (Succeeded/Failed/Expired) is kept
    # before the operator deletes it -- Kubernetes garbage collection then
    # cascades the delete to the worker Job it owns (REL-896).
    terminalRetentionSeconds: 3600
    # Hard cap applied even when a terminal review's fail-closed GitHub check
    # publication has been delegated to the dispatcher's trusted reaper and
    # has not resolved (see reconcileFailurePublication /
    # DelegatedToTrustedService in the v1alpha2 controller); nothing ever
    # resolves that state back, so this cap is what actually bounds the leak.
    terminalMaxRetentionSeconds: 86400

  nodeSelector: {}
  tolerations: []
  affinity: {}

# Ephemeral Worker Pod Sizing and Defaults
# These settings configure the worker batch/v1 Jobs spawned by the operator.
worker:
  image:
    repository: ghcr.io/review-yeti-ai/review-yeti-worker
    pullPolicy: IfNotPresent
    tag: ""

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      # Set to "" (or "none") to run workers with no CPU limit; the memory
      # limit is always kept.
      cpu: 1000m
      memory: 1Gi

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  storage:
    size: 1Gi
    storageClassName: ""

  activeDeadlineSeconds: 840
  # ttlSecondsAfterFinished is the TTL a *succeeded* worker Job is patched
  # down to once the operator observes success (REL-896). A worker is always
  # built with failedTtlSecondsAfterFinished first, since the outcome is not
  # known yet at build time.
  ttlSecondsAfterFinished: 0
  # failedTtlSecondsAfterFinished keeps a failed worker's Job (and therefore
  # its Pod/logs) around for one hour by default, instead of the immediate
  # collection every outcome previously got.
  failedTtlSecondsAfterFinished: 3600

# Ingress Configuration
# Exposes the dispatcher endpoint externally to receive webhook requests.
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: review-bot.example.com
  path: /api/admission/dispatch
  pathType: Prefix
  tls:
    enabled: false
    secretName: review-yeti-tls

# GitHub App and LLM Provider Secrets
# Supports both chart-managed secrets and referencing external secrets (Vault, SealedSecrets, etc.).
secrets:
  # Set create: true to generate a Kubernetes Secret from the parameters below.
  # If existingSecretName is provided, this secret is skipped and existingSecretName is mounted.
  create: true
  existingSecretName: ""

  # GitHub App Credentials
  appId: ""
  installationId: ""
  privateKey: ""

  # Dispatcher Authentication Secret
  dispatchToken: ""

  # LLM Provider API Keys
  openRouterApiKey: ""
  openRouterBaseUrl: ""

# App-gate publishing lane transport (ADR 0527).
#
# Both gatewayBaseUrl and model are EMPTY by default and are deliberately not
# defaulted: an unset transport leaves the operator's publishing config incomplete,
# so BuildWorkerJob refuses every app-gate review rather than dispatching one
# against a gateway nobody chose. Bifrost is the only admitted transport -- there is
# no second provider and no failover (see ADR 0527), so this lane fails closed.
#
# The secret reference may default, because a Secret *name* is not a transport
# choice; it points at the Doppler-projected credential below.
publishing:
  gatewayBaseUrl: ""
  model: ""
  # Optional HTTPS failure callback; empty preserves legacy check-only workers.
  # Enable only after the CRD, API/ingress, dispatcher and worker rollout.
  completionUrl: ""
  gatewaySecretName: "review-yeti-gateway-credentials"
  gatewaySecretKey: "REVIEW_YETI_BIFROST_API_KEY"
  # REL-677 / ADR 0329: index-at-review-time Zoekt grounding, on by default for the app-gate
  # lane. The operator (k8s-operator/pkg/job/job.go, k8s-operator/main.go) forwards this value
  # verbatim to the worker -- and *only* when it is set to something -- so leaving it empty here
  # opts a deployment out entirely rather than defaulting to enabled; that "unset stays unset"
  # contract is deliberate and covered by TestPublishingConfigFromEnvReadsZoektPassthrough and
  # TestBuildWorkerJobForwardsZoektGroundingEnvOnlyWhenSet, so it is not something to change here.
  # Set to "false" to opt back out without removing the line (the worker's `ZOEKT_GROUNDING_ENABLED
  # === 'true'` check is strict, so any other value behaves as off).
  zoektGroundingEnabled: "true"
  # Kill switch: forwarded verbatim alongside zoektGroundingEnabled above when non-empty; empty by
  # default so it never overrides the enabled value unless explicitly set.
  zoektGroundingDisabled: ""
  # REL-1079: deterministic diff shrinking (worker flag REVIEW_YETI_DIFF_SHRINK). Empty by
  # default, so nothing is forwarded and every change is sent in full. The operator forwards a
  # non-empty value verbatim to app-gate workers only; the worker reads it as off/on or a
  # comma-separated owner/repo allowlist, e.g. "acme/app,acme/api".
  # Revert path: set back to "" (a line break in the value refuses app-gate Jobs).
  diffShrink: ""
  # REL-1084: incremental re-review on synchronize (worker flag REVIEW_YETI_INCREMENTAL). Empty by
  # default, so nothing is forwarded and every review is full. The operator forwards a non-empty
  # value verbatim to app-gate workers only; the worker reads it as off/on or a comma-separated
  # owner/repo allowlist, e.g. "acme/app,acme/api". The prior-review age limit is service config
  # (REVIEW_YETI_INCREMENTAL_MAX_AGE_HOURS on the dispatch service, default 72).
  # Revert path: set back to "" (a line break in the value refuses app-gate Jobs).
  incremental: ""
  # REL-1082: risk-ordered review budget per lane (worker flag REVIEW_YETI_BUDGET). Empty by
  # default, so nothing is forwarded and every lane gets today's content. The operator forwards
  # a non-empty value verbatim to app-gate workers only; the worker reads it as off/on/all or a
  # comma-separated owner/repo allowlist, e.g. "acme/app,acme/api".
  # Revert path: set back to "" (a line break in the value refuses app-gate Jobs).
  reviewBudget: ""
  # REL-1085: per-file verdict cache (worker flag REVIEW_YETI_VERDICT_CACHE). Empty by default, so
  # nothing is forwarded and nothing is served from or recorded in the cache. The operator forwards
  # a non-empty value verbatim to app-gate workers only; the worker reads it as off/on or a
  # comma-separated owner/repo allowlist, e.g. "acme/app,acme/api". The source-record age limit is
  # service config (REVIEW_YETI_VERDICT_CACHE_MAX_AGE_HOURS on the dispatch service, default 72).
  # Revert path: set back to "" (a line break in the value refuses app-gate Jobs).
  verdictCache: ""
  # REL-1083: map-reduce review for huge diffs (worker flag REVIEW_YETI_MAP_REDUCE). Empty by
  # default, so nothing is forwarded and every lane is reviewed in one call. The operator forwards
  # a non-empty value verbatim to app-gate workers only, together with the review's terminal
  # deadline (REVIEW_TERMINAL_DEADLINE) so the worker caps its chunk calls by the time left.
  # The worker reads it as off/on/all or a comma-separated owner/repo allowlist.
  # Revert path: set back to "" (a line break in the value refuses app-gate Jobs).
  mapReduce: ""
  # REL-1083: map-reduce trigger (worker REVIEW_YETI_MAP_REDUCE_MIN_CHARS), in characters of
  # packed lane content. A lane is chunked only when it is larger than this; smaller lanes stay
  # one call, packed by the W5 budget. Empty by default: nothing is forwarded and the worker uses
  # its default, the W5 hard cap (160000). Forwarded only when mapReduce is set.
  mapReduceMinChars: ""
  # REL-1139 (ct-meta ADR 0687, proposed): skip the MODERATOR call on a run where every lane
  # completed with an empty APPROVE, coverage was full and no security-sensitive file changed
  # (worker flag REVIEW_YETI_SKIP_EMPTY_MODERATION). The arbiter always runs; lanes are never
  # skipped. Empty by default, so nothing is forwarded and the moderator always runs; workers log
  # moderator_shadow_skip_eligible on every run either way. The operator forwards a non-empty value
  # verbatim to app-gate workers only; the worker reads it like REVIEW_YETI_INCREMENTAL: off/on/all
  # or a comma-separated owner/repo allowlist. Do not enable it before ADR 0687 is accepted.
  # Revert path: set back to "" (a line break in the value refuses app-gate Jobs).
  skipEmptyModeration: ""
  # Per-run publish credentials are owned by k8s/review-job-dispatcher.yaml.tpl,
  # which already defines that component's ServiceAccount, Role, RoleBinding and
  # Deployment. Defining them here too would give the same resources two owners.

# Doppler-operator credential projection.
#
# Off by default: enabling it requires the Doppler Kubernetes Operator to be
# installed in the cluster and a service-token Secret (doppler.tokenSecretName)
# present in this namespace. When enabled, the operator continuously syncs the
# named Doppler config into a managed Secret, so rotating the Bifrost virtual
# key upstream repairs the cluster on the next resync instead of requiring a
# redeploy -- a chart-pinned literal would go stale silently.
doppler:
  enabled: false
  # Doppler project and config holding the gateway credential. Empty by default:
  # this repository is public, and a concrete project name maps the operator's
  # secret-store layout for anyone reading it. Set them in the private deployment
  # values, alongside gatewayBaseUrl and model.
  project: ""
  config: ""
  host: "https://api.doppler.com"
  verifyTLS: true
  # 60s matches the credential projection already running alongside this operator.
  resyncSeconds: 60
  # Service-token Secret (key: serviceToken). Provisioned out of band; the chart
  # never renders a Doppler token into a manifest.
  tokenSecretName: "doppler-token-secret"
  # Secret the operator writes and the review worker reads.
  managedSecretName: "review-yeti-gateway-credentials"
  anthropicApiKey: ""
  openaiApiKey: ""
