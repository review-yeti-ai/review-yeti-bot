apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "review-yeti.fullname" . }}-worker-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "review-yeti.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "review-yeti.fullname" . }}-worker-manager-binding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "review-yeti.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
subjects:
  - kind: ServiceAccount
    name: default
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "review-yeti.fullname" . }}-worker-manager
