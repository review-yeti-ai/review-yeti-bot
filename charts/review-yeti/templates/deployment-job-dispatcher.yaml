{{- if .Values.jobDispatcher.enabled -}}
{{/*
The job dispatcher claims admitted reviews and projects PRReviewJob resources. It
was previously applied outside Helm, which meant the chart could not give it the
GitHub App credentials the publishing lane needs -- so `publishing.runSecrets`
could be enabled while the component that consumes it silently had nothing
(REL-586).

It is a distinct component from `.Values.dispatcher`, the action-dispatch API.
Same image, different entrypoint and different service account; only this one
provisions run secrets.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.jobDispatcher.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "review-yeti.labels" . | nindent 4 }}
    app.kubernetes.io/component: job-dispatcher
spec:
  # Exactly one. The engine claims work under a database lease, so a second
  # replica would contend for the same rows rather than add throughput.
  replicas: 1
  selector:
    matchLabels:
      {{- include "review-yeti.jobDispatcher.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "review-yeti.jobDispatcher.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.jobDispatcher.serviceAccountName }}
      securityContext:
        {{- toYaml .Values.jobDispatcher.podSecurityContext | nindent 8 }}
      containers:
        - name: job-dispatcher
          # Required rather than defaulted to the chart appVersion: this Deployment
          # already runs a pinned digest outside Helm, and silently substituting a
          # tag would make adopting it into the chart a version change too.
          image: {{ required "jobDispatcher.image is required when jobDispatcher.enabled is true (pin the digest already running)" .Values.jobDispatcher.image | quote }}
          imagePullPolicy: {{ .Values.jobDispatcher.imagePullPolicy }}
          command: ["node", "dist/reviewJobDispatcherIndex.js"]
          envFrom:
            - configMapRef:
                name: {{ .Values.jobDispatcher.configMapName }}
          env:
            {{- if .Values.publishing.runSecrets.enabled }}
            # Required to mint per-run publish tokens. Without them the engine
            # refuses app-gate dispatches rather than projecting a Job whose worker
            # could never publish -- which, in a fail-closed lane, would surface as
            # a failed check on the pull request rather than a dispatch error.
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jobDispatcher.appSecretName }}
                  key: GITHUB_APP_ID
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jobDispatcher.appSecretName }}
                  key: GITHUB_APP_PRIVATE_KEY
            {{- end }}
          resources:
            {{- toYaml .Values.jobDispatcher.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.jobDispatcher.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
