{{- if and .Values.secrets.create (not .Values.secrets.existingSecretName) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "review-yeti.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "review-yeti.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP_ID: {{ .Values.secrets.appId | default "" | quote }}
  INSTALLATION_ID: {{ .Values.secrets.installationId | default "" | quote }}
  PRIVATE_KEY: {{ .Values.secrets.privateKey | default "" | quote }}
  DISPATCH_TOKEN: {{ .Values.secrets.dispatchToken | default "" | quote }}
  OPENROUTER_API_KEY: {{ .Values.secrets.openRouterApiKey | default "" | quote }}
  {{- if .Values.secrets.openRouterBaseUrl }}
  OPENROUTER_BASE_URL: {{ .Values.secrets.openRouterBaseUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  {{- end }}
{{- end }}
