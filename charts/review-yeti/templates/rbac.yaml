{{- if .Values.dispatcher.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "review-yeti.dispatcher.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "review-yeti.labels" . | nindent 4 }}
    app.kubernetes.io/component: dispatcher
  {{- with .Values.dispatcher.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.dispatcher.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- if and .Values.dispatcher.serviceAccount.create .Values.operator.serviceAccount.create }}
---
{{- end }}
{{- if .Values.operator.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "review-yeti.operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "review-yeti.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
  {{- with .Values.operator.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.operator.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- if and (or .Values.dispatcher.serviceAccount.create .Values.operator.serviceAccount.create) .Values.operator.enabled }}
---
{{- end }}
{{- if .Values.operator.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "review-yeti.operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "review-yeti.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
rules:
  - apiGroups: ["review-yeti.ai"]
    resources: ["prreviewjobs"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["review-yeti.ai"]
    resources: ["prreviewjobs/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "review-yeti.operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "review-yeti.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
subjects:
  - kind: ServiceAccount
    name: {{ include "review-yeti.operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "review-yeti.operator.fullname" . }}
{{- end }}
{{- if and .Values.dispatcher.serviceAccount.create .Values.publishing.runSecrets.enabled }}
---
# The job dispatcher provisions one Secret per publishing run, holding a token
# minted from the installed GitHub App (REL-586). Scoped as tightly as the API
# allows: namespace-local, secrets only, and no `get`/`list` -- it writes run
# credentials and must not be able to read any other Secret in the namespace,
# including the App private key it is given by env.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "review-yeti.dispatcher.serviceAccountName" . }}-run-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "review-yeti.labels" . | nindent 4 }}
    app.kubernetes.io/component: dispatcher
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "review-yeti.dispatcher.serviceAccountName" . }}-run-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "review-yeti.labels" . | nindent 4 }}
    app.kubernetes.io/component: dispatcher
subjects:
  - kind: ServiceAccount
    name: {{ include "review-yeti.dispatcher.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "review-yeti.dispatcher.serviceAccountName" . }}-run-secrets
{{- end }}
