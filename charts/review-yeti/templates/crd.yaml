{{- /*
  The PRReviewJob CRD is not maintained here. files/review-yeti.ai_prreviewjobs.yaml
  is a byte-identical copy of the controller-gen output in
  k8s-operator/config/crd/bases (copied by `make generate` in k8s-operator), and
  tests/unit/chartCrdGenerated.test.ts fails if the two ever differ. Only the
  chart labels are added at render time.
*/ -}}
{{- if .Values.crd.install -}}
{{- $crd := .Files.Get "files/review-yeti.ai_prreviewjobs.yaml" | fromYaml -}}
{{- if or (not $crd) (hasKey $crd "Error") -}}
{{- fail "files/review-yeti.ai_prreviewjobs.yaml is missing or unparseable" -}}
{{- end -}}
{{- $_ := set $crd.metadata "labels" (include "review-yeti.labels" . | fromYaml) -}}
{{ toYaml $crd }}
{{- end }}
