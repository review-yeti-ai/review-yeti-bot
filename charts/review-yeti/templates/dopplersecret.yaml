{{- if .Values.doppler.enabled -}}
{{/*
Projects the Bifrost gateway credential into this namespace through the Doppler
Kubernetes Operator rather than a hand-applied Secret.

Why the operator and not a chart-managed value: the gateway credential is a
Bifrost *virtual key*, and a virtual key can be revoked upstream at any time. A
value pasted into values.yaml goes stale silently -- exactly the failure this
system already hit, where the cluster copy of REVIEW_YETI_BIFROST_API_KEY was a
revoked key returning "virtual key not found" while the GitHub copy still
worked, so nothing observed the rot. The operator re-reads Doppler every
resyncSeconds, so rotating the key upstream repairs the cluster without a
redeploy.

The managed Secret is consumed by the review worker; this template only
projects it. It deliberately does not grant the worker anything else.
*/}}
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: {{ .Values.doppler.managedSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "review-yeti.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials
spec:
  project: {{ .Values.doppler.project | quote }}
  config: {{ .Values.doppler.config | quote }}
  host: {{ .Values.doppler.host | quote }}
  verifyTLS: {{ .Values.doppler.verifyTLS }}
  resyncSeconds: {{ .Values.doppler.resyncSeconds }}
  tokenSecret:
    name: {{ .Values.doppler.tokenSecretName }}
    namespace: {{ .Release.Namespace }}
  managedSecret:
    name: {{ .Values.doppler.managedSecretName }}
    namespace: {{ .Release.Namespace }}
    type: Opaque
    labels:
      {{- include "review-yeti.labels" . | nindent 6 }}
      app.kubernetes.io/component: credentials
{{- end }}
