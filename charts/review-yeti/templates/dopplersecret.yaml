{{- if .Values.doppler.enabled -}}
{{- if or (empty .Values.doppler.project) (empty .Values.doppler.config) -}}
{{- fail "doppler.project and doppler.config are required when doppler.enabled is true (set them in private deployment values; this chart ships no defaults)" -}}
{{- end -}}
{{/*
Projects the Cloudflare AI Gateway Run credential into this namespace through Doppler
Kubernetes Operator rather than a hand-applied Secret.

Why the operator and not a chart-managed value: the gateway credential can be
revoked upstream at any time. The operator re-reads Doppler every resyncSeconds,
so rotating the referenced credential repairs the cluster without a redeploy.

The managed Secret is consumed by the review worker; this template only
projects it. It deliberately does not grant the worker anything else.
*/}}
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: {{ .Values.doppler.managedSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "review-yeti.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials
spec:
  project: {{ .Values.doppler.project | quote }}
  config: {{ .Values.doppler.config | quote }}
  host: {{ .Values.doppler.host | quote }}
  verifyTLS: {{ .Values.doppler.verifyTLS }}
  resyncSeconds: {{ .Values.doppler.resyncSeconds }}
  tokenSecret:
    name: {{ .Values.doppler.tokenSecretName }}
    namespace: {{ .Release.Namespace }}
  managedSecret:
    name: {{ .Values.doppler.managedSecretName }}
    namespace: {{ .Release.Namespace }}
    type: Opaque
    labels:
      {{- include "review-yeti.labels" . | nindent 6 }}
      app.kubernetes.io/component: credentials
{{- end }}
