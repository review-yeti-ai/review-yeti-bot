---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.15.0
  name: prreviewjobs.review-yeti.ai
spec:
  group: review-yeti.ai
  names:
    kind: PRReviewJob
    listKind: PRReviewJobList
    plural: prreviewjobs
    shortNames:
    - prj
    singular: prreviewjob
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.repo
      name: Repo
      type: string
    - jsonPath: .spec.prNumber
      name: PR
      type: integer
    - jsonPath: .spec.terminalDeadline
      name: Deadline
      type: date
    name: v1alpha2
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PRReviewJobSpec is an immutable, non-secret projection of an authenticated review run.
              The CRD schema rejects all fields not declared here and every spec update
              except the one-way cancelRequested transition (REL-1073).
            properties:
              baseSha:
                pattern: ^[a-f0-9]{40}$
                type: string
              cancelReason:
                description: |-
                  CancelReason records the reason why cancellation was requested. It may be
                  set only in the same update that sets cancelRequested to true.
                maxLength: 256
                minLength: 1
                type: string
              cancelRequested:
                description: |-
                  CancelRequested indicates that the review run was superseded or explicitly cancelled.
                  It is the only spec field that may change after creation, and only from
                  absent/false to true (REL-1073).
                type: boolean
              configDigest:
                pattern: ^[a-f0-9]{64}$
                type: string
              deliveryId:
                maxLength: 512
                minLength: 1
                type: string
              executionAttempt:
                description: |-
                  ExecutionAttempt is the explicit execution identity for this run. It is
                  optional so the upgraded operator can continue processing CRs persisted by
                  older dispatchers, which recover the value from the validated Secret name.
                format: int32
                maximum: 2147483647
                minimum: 1
                type: integer
              headSha:
                pattern: ^[a-f0-9]{40}$
                type: string
              policyDigest:
                pattern: ^[a-f0-9]{64}$
                type: string
              prNumber:
                format: int32
                minimum: 1
                type: integer
              preparedReview:
                description: |-
                  PreparedReview is an immutable, non-secret PreparedReviewExecution.v1 JSON
                  envelope containing config and transport. Presence opts into authoritative
                  result reporting in addition to the worker's existing raw review check.
                  The dispatcher and worker verify the config digest; the operator transports
                  the exact envelope without selecting providers or changing credentials.
                maxLength: 262144
                minLength: 1
                type: string
              publicationMode:
                enum:
                - disabled
                - app-gate
                type: string
              qualificationModel:
                description: |-
                  QualificationModel is required by explicit qualification profiles and is
                  never accepted for the default receipt-only worker.
                maxLength: 256
                minLength: 1
                type: string
              qualificationProfile:
                description: |-
                  QualificationProfile is optional. An omitted profile preserves the
                  production-safe receipt-only worker contract. The only admitted
                  non-default profiles are the manual, non-publishing full-panel and
                  read-only same-head lanes.
                enum:
                - full-panel
                - same-head
                type: string
              receivedAt:
                format: date-time
                type: string
              repo:
                pattern: ^[A-Za-z0-9](?:[A-Za-z0-9_.-]*[A-Za-z0-9])?/[A-Za-z0-9](?:[A-Za-z0-9_.-]*[A-Za-z0-9])?$
                type: string
              repositoryId:
                format: int64
                minimum: 1
                type: integer
              runId:
                pattern: ^run_[a-f0-9]{32}$
                type: string
              runSecretName:
                pattern: ^ct-review-run-[a-f0-9]{32}(-a[1-9][0-9]*)?$
                type: string
              runnerMode:
                description: |-
                  RunnerMode defines whether the worker image is an immutable prebaked container
                  or a generic runner image that executes runtime install steps. Defaults to prebaked.
                enum:
                - prebaked
                - generic
                type: string
              terminalDeadline:
                format: date-time
                type: string
              workerImage:
                description: |-
                  The real control here is DIGEST PINNING, not a registry allowlist.


                  The previous pattern named exactly two registries. That is both too narrow
                  and too weak, and the weakness is the more serious half:
                    too weak  — `ghcr.io/review-yeti-ai/<anything>:<anytag>` was permitted, so a
                                mutable tag on the vendor registry passed while a digest-pinned
                                image from any other registry was rejected. A tenant could not
                                pin from their own registry, and the vendor namespace allowed
                                tags. That inverts the control.
                    too narrow — it hardcoded two CallTelemetry-controlled registries, so a
                                self-hosted install could not pull from its own registry at
                                all. Self-hosting was impossible by construction.


                  This accepts any registry, and requires every non-node image to be pinned to
                  a sha256 digest. `node:<tag>` remains allowed because the generic-runner mode
                  executes runtime install steps and is not the review worker.
                  TRUST ASSUMPTION, load-bearing: this constrains INTEGRITY (an image
                  reference is immutable), not PROVENANCE (who published it). Any registry is
                  accepted, so whoever can create or patch a PRReviewJob chooses the code the
                  worker executes. Correct for a self-hosted install where the submitter owns
                  the cluster; NOT sufficient for a multi-tenant deployment where a
                  less-trusted principal can write these resources. Multi-tenant installs
                  MUST restrict PRReviewJob create/patch via RBAC and SHOULD add publisher
                  verification or an admission-time registry policy.
                  Bounded like its siblings: the pattern's host group and its optional path
                  group both match '/' and '-', so a long adversarial reference makes the
                  matcher backtrack quadratically (measured: 25 KB -> ~240 ms, and the
                  operator validates on every reconcile). A real image reference is far below
                  this, so the bound costs nothing legitimate and removes the blowup.
                maxLength: 512
                pattern: ^(?:[a-z0-9](?:[a-z0-9._/-]*[a-z0-9])?(?::[0-9]{1,5})?(?:/[a-zA-Z0-9._/-]+)?@sha256:[a-f0-9]{64}|node:[a-zA-Z0-9_.-]+@sha256:[a-f0-9]{64}|node:[a-zA-Z0-9_.-]+)$
                type: string
            required:
            - baseSha
            - configDigest
            - deliveryId
            - headSha
            - policyDigest
            - prNumber
            - publicationMode
            - receivedAt
            - repo
            - repositoryId
            - runId
            - runSecretName
            - terminalDeadline
            - workerImage
            type: object
            x-kubernetes-validations:
            - message: PRReviewJob spec is immutable except for a one-way cancelRequested
                false-to-true transition
              rule: self == oldSelf || (has(self.cancelRequested) && self.cancelRequested
                && !(has(oldSelf.cancelRequested) && oldSelf.cancelRequested))
            - message: PRReviewJob spec fields other than cancelRequested and cancelReason
                are immutable
              rule: self.runId == oldSelf.runId && self.deliveryId == oldSelf.deliveryId
                && self.repositoryId == oldSelf.repositoryId && self.repo == oldSelf.repo
                && self.prNumber == oldSelf.prNumber && self.headSha == oldSelf.headSha
                && self.baseSha == oldSelf.baseSha && self.receivedAt == oldSelf.receivedAt
                && self.terminalDeadline == oldSelf.terminalDeadline && self.policyDigest
                == oldSelf.policyDigest && self.configDigest == oldSelf.configDigest
                && self.publicationMode == oldSelf.publicationMode && self.workerImage
                == oldSelf.workerImage && self.runSecretName == oldSelf.runSecretName
                && has(self.executionAttempt) == has(oldSelf.executionAttempt) &&
                (!has(self.executionAttempt) || self.executionAttempt == oldSelf.executionAttempt)
                && has(self.preparedReview) == has(oldSelf.preparedReview) && (!has(self.preparedReview)
                || self.preparedReview == oldSelf.preparedReview) && has(self.runnerMode)
                == has(oldSelf.runnerMode) && (!has(self.runnerMode) || self.runnerMode
                == oldSelf.runnerMode) && has(self.qualificationProfile) == has(oldSelf.qualificationProfile)
                && (!has(self.qualificationProfile) || self.qualificationProfile ==
                oldSelf.qualificationProfile) && has(self.qualificationModel) == has(oldSelf.qualificationModel)
                && (!has(self.qualificationModel) || self.qualificationModel == oldSelf.qualificationModel)
            - message: terminalDeadline must be between 15 and 60 minutes after receivedAt
              rule: duration('900s') <= (timestamp(self.terminalDeadline) - timestamp(self.receivedAt))
                && (timestamp(self.terminalDeadline) - timestamp(self.receivedAt))
                <= duration('3600s')
            - message: qualificationProfile and qualificationModel must both be omitted
                for receipt-only workers or use an explicit qualification profile
                with a non-auto model
              rule: (!has(self.qualificationProfile) && !has(self.qualificationModel))
                || (self.qualificationProfile in ['full-panel', 'same-head'] && has(self.qualificationModel)
                && self.qualificationModel != 'auto' && self.qualificationModel !=
                'openrouter/auto')
            - message: preparedReview requires the prebaked app-gate lane
              rule: '!has(self.preparedReview) || (self.publicationMode == ''app-gate''
                && (!has(self.runnerMode) || self.runnerMode == ''prebaked''))'
          status:
            description: |-
              PRReviewJobStatus contains execution references and a bounded timing receipt;
              PostgreSQL remains lifecycle authority.
            properties:
              cancelObservedAt:
                format: date-time
                type: string
              cancelRequestedAt:
                format: date-time
                type: string
              completionTime:
                format: date-time
                type: string
              conditions:
                items:
                  description: "Condition contains details for one aspect of the current
                    state of this API Resource.\n---\nThis struct is intended for
                    direct use as an array at the field path .status.conditions.  For
                    example,\n\n\n\ttype FooStatus struct{\n\t    // Represents the
                    observations of a foo's current state.\n\t    // Known .status.conditions.type
                    are: \"Available\", \"Progressing\", and \"Degraded\"\n\t    //
                    +patchMergeKey=type\n\t    // +patchStrategy=merge\n\t    // +listType=map\n\t
                    \   // +listMapKey=type\n\t    Conditions []metav1.Condition `json:\"conditions,omitempty\"
                    patchStrategy:\"merge\" patchMergeKey:\"type\" protobuf:\"bytes,1,rep,name=conditions\"`\n\n\n\t
                    \   // other fields\n\t}"
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: |-
                        type of condition in CamelCase or in foo.example.com/CamelCase.
                        ---
                        Many .condition.type values are consistent across resources like Available, but because arbitrary conditions can be
                        useful (see .node.status.conditions), the ability to deconflict is important.
                        The regex it matches is (dns1123SubdomainFmt/)?(qualifiedNameFmt)
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              jobName:
                type: string
              leaseName:
                type: string
              message:
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: PRReviewJobPhase is the bounded Kubernetes execution
                  phase.
                enum:
                - Queued
                - Running
                - Succeeded
                - Failed
                - Expired
                - Cancelled
                type: string
              pvcName:
                type: string
              startTime:
                format: date-time
                type: string
              timing:
                description: |-
                  DispatchTimingStatus is a durable, bounded lifecycle receipt. It contains
                  timestamps only; prompts, provider responses, credentials, and review
                  contents must never be written to the CR status.
                properties:
                  completedAt:
                    format: date-time
                    type: string
                  imageObservedAt:
                    format: date-time
                    type: string
                  jobCreatedAt:
                    format: date-time
                    type: string
                  podScheduledAt:
                    format: date-time
                    type: string
                  processStartedAt:
                    format: date-time
                    type: string
                  receivedAt:
                    format: date-time
                    type: string
                type: object
              workerTermination:
                description: |-
                  WorkerTermination is the forensic record of the worker Pod's exit,
                  captured before the worker Job's TTL is allowed to collect the Pod.
                properties:
                  containerName:
                    maxLength: 63
                    type: string
                  exitCode:
                    description: |-
                      ExitCode is absent when the Pod ended before its container ever ran
                      (for example an eviction or a deadline hit while the image was pulling).
                    format: int32
                    type: integer
                  finishedAt:
                    format: date-time
                    type: string
                  message:
                    maxLength: 1024
                    type: string
                  nodeName:
                    maxLength: 253
                    type: string
                  observedAt:
                    format: date-time
                    type: string
                  podName:
                    maxLength: 253
                    type: string
                  podReason:
                    description: PodReason is the Pod-level reason (Evicted, DeadlineExceeded,
                      ...).
                    maxLength: 128
                    type: string
                  reason:
                    description: |-
                      Reason is the container termination reason (Completed, Error, OOMKilled,
                      ContainerCannotRun, ...).
                    maxLength: 128
                    type: string
                  signal:
                    format: int32
                    type: integer
                  startedAt:
                    format: date-time
                    type: string
                required:
                - observedAt
                - podName
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
