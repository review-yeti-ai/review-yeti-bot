name: Review Yeti (GitHub App)

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: review-yeti-app-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write
  statuses: write

jobs:
  review:
    name: AI Panel Code Review (GitHub App)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate Review Yeti App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.REVIEW_YETI_APP_ID }}
          private-key: ${{ secrets.REVIEW_YETI_APP_PRIVATE_KEY }}

      - name: Run Review Yeti Panel
        id: review-yeti
        uses: review-yeti-ai/review-yeti-bot@v1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          model: 'deepseek/deepseek-v4-flash-0731'

      - name: Report Review Outcome
        if: always() && steps.review-yeti.outputs.verdict != ''
        run: |
          echo "### Review Yeti Check Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Verdict**: ${{ steps.review-yeti.outputs.verdict }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Findings**: ${{ steps.review-yeti.outputs.findings-count }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Gate Decision**: ${{ steps.review-yeti.outputs.gate-decision }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Files Reviewed**: ${{ steps.review-yeti.outputs.files-reviewed }}" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.review-yeti.outputs.verdict }}" = "BLOCK" ]; then
            echo "::error::Review Yeti issued a BLOCK verdict. Check the PR check runs for details."
            exit 1
          fi
