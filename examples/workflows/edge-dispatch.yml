name: Review Yeti Edge Dispatch

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: review-yeti-edge-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write   # Required for GitHub Actions OIDC federation with the Review Yeti edge
  contents: read
  pull-requests: read

jobs:
  dispatch:
    name: Dispatch Review to the Edge
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch Review Job to the Edge
        id: dispatch
        uses: review-yeti-ai/review-yeti-bot@v1
        with:
          execution-backend: 'edge'
          dispatch-url: ${{ vars.REVIEW_YETI_DISPATCH_URL || 'https://review-yeti.example.com/api/dispatch/action' }}
          publish-mode: 'app-gate'

      - name: Dispatch Confirmation
        run: |
          echo "### Review Yeti Edge Dispatch" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ steps.dispatch.outputs.review-status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Gate Decision**: ${{ steps.dispatch.outputs.gate-decision }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Rationale**: ${{ steps.dispatch.outputs.rationale }}" >> $GITHUB_STEP_SUMMARY
          echo "Review execution offloaded to the Cloudflare edge. The PR check will update when the review finishes."
