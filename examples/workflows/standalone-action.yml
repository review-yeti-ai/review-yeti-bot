name: Review Yeti Standalone

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: review-yeti-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: AI Panel Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run Review Yeti Review
        id: review-yeti
        uses: review-yeti-ai/review-yeti-bot@v1
        with:
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          model: 'deepseek/deepseek-v4-flash-0731'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Review Summary & Quality Gate
        if: always() && steps.review-yeti.outputs.verdict != ''
        run: |
          echo "### Review Yeti Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Verdict**: ${{ steps.review-yeti.outputs.verdict }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Findings**: ${{ steps.review-yeti.outputs.findings-count }}" >> $GITHUB_STEP_SUMMARY
          echo "- **P0 (Blocker)**: ${{ steps.review-yeti.outputs.p0-count }}" >> $GITHUB_STEP_SUMMARY
          echo "- **P1 (High)**: ${{ steps.review-yeti.outputs.p1-count }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ steps.review-yeti.outputs.review-status }}" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.review-yeti.outputs.verdict }}" = "BLOCK" ]; then
            echo "::error::Review Yeti detected blocking issues (Verdict: BLOCK). Review findings on the PR."
            exit 1
          fi
