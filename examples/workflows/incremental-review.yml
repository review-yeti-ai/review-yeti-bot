name: Review Yeti Incremental

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: review-yeti-inc-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  actions: read    # Required to download prior Review Yeti run artifacts for repair delta calculation

jobs:
  review:
    name: Incremental Repair Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run Incremental Review Yeti
        id: review-yeti
        uses: review-yeti-ai/review-yeti-bot@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          model: 'deepseek/deepseek-v4-flash-0731'
          incremental-review: 'true'
          max-incremental-diff-chars: '60000'
          max-incremental-chain: '5'

      - name: Review Summary
        if: always() && steps.review-yeti.outputs.verdict != ''
        run: |
          echo "### Incremental Review Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Verdict**: ${{ steps.review-yeti.outputs.verdict }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Findings**: ${{ steps.review-yeti.outputs.findings-count }}" >> $GITHUB_STEP_SUMMARY
          echo "- **P0**: ${{ steps.review-yeti.outputs.p0-count }}" >> $GITHUB_STEP_SUMMARY
          echo "- **P1**: ${{ steps.review-yeti.outputs.p1-count }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ steps.review-yeti.outputs.review-status }}" >> $GITHUB_STEP_SUMMARY
