# Review Yeti Strict Security Policy (.ct-review.yaml)
# Enforces assertive multi-provider consensus (quorum: 2) and blocks PR merges on any P1/P0 finding.

version: 3
profile: "assertive"
quorum: 2
confidence_threshold: 80
mascot: true

enforcement_policy:
  require_all_reviews: true
  failure_action: "fail_closed"

reviews:
  profile: "assertive"
  reviewer_effort: "max"
  confidence_threshold: 80
  request_changes_workflow: true
  high_level_summary: true
  sequence_diagrams: true

rules:
  - id: "no-unparameterized-queries"
    rule: "All database access must use parameterized queries or typed ORM methods. Raw SQL string interpolation is strictly prohibited."
    severity: "P1"
    scope: ["**"]
  - id: "enforce-auth-checks"
    rule: "Every public route handler and RPC mutation must invoke authentication and authorization middleware prior to business logic execution."
    severity: "P1"
    scope: ["src/api/**", "src/controllers/**", "src/routes/**"]
  - id: "no-hardcoded-secrets"
    rule: "API keys, bearer tokens, private keys, and cryptographic secrets must never be committed as literals."
    severity: "P0"
    scope: ["**"]

personas:
  - id: "security"
    enabled: true
    required: true
    charter: "builtin:security"
    paths: ["**"]
    providers: ["openrouter-deepseek", "openrouter-claude"]
  - id: "compliance"
    enabled: true
    required: true
    charter: "Enforce strict PII masking, cryptographic integrity, and immutable audit trails across all mutated data models."
    paths: ["**"]
    providers: ["openrouter-deepseek", "openrouter-claude"]
  - id: "devops"
    enabled: true
    required: false
    charter: "builtin:devops"
    paths: ["Dockerfile*", "k8s/**", "helm/**", ".github/**"]
    providers: ["openrouter-deepseek", "openrouter-claude"]

reviewers:
  execution: "personas"
  fallback: "ordered"
  overall_timeout_s: 900
  providers:
    - id: "openrouter-deepseek"
      enabled: true
      model: "deepseek/deepseek-v4-flash-0731"
      effort: "max"
      review_timeout_s: 240
      arbiter_timeout_s: 180
    - id: "openrouter-claude"
      enabled: true
      model: "openrouter/anthropic/claude-3.7-sonnet"
      effort: "high"
      review_timeout_s: 240
      arbiter_timeout_s: 180
  arbiter:
    order: ["openrouter-claude", "openrouter-deepseek"]
