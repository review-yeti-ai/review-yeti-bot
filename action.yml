name: 'AI PR Review Panel'
description: 'Reviews a pull request with a panel of AI reviewer personas and posts a single consolidated comment.'
author: 'JBJMLLC'

branding:
  icon: 'check-circle'
  color: 'purple'

inputs:
  openrouter-api-key:
    description: 'OpenRouter API key for multi-model routing.'
    required: false
    default: ''
  fireworks-api-key:
    description: 'Fireworks AI API key for fast direct inference.'
    required: false
    default: ''
  ollama-api-key:
    description: 'Ollama API key for Ollama Cloud or endpoint.'
    required: false
    default: ''
  synthetic-api-key:
    description: 'Synthetic API key for the direct GLM fallback endpoint.'
    required: false
    default: ''
  anthropic-api-key:
    description: 'Anthropic API key for direct Claude reviews.'
    required: false
    default: ''
  gemini-api-key:
    description: 'Google Gemini API key for direct Gemini reviews.'
    required: false
    default: ''
  openai-api-key:
    description: 'OpenAI API key for direct GPT reviews.'
    required: false
    default: ''
  api-key:
    description: 'Generic API key alias (auto-maps to OpenRouter or default provider). Auto-discovers from environment if omitted.'
    required: false
    default: ''
  llm-api-key:
    description: >-
      Legacy OpenRouter API key input.
    required: false
    default: ''
  llm-base-url:
    description: 'Trusted workflow/base-config OpenRouter base URL. Must normalize exactly to https://openrouter.ai/api/v1.'
    required: false
    default: 'https://openrouter.ai/api/v1'
  model:
    description: 'Trusted workflow/base-config OpenRouter model control. Defaults to direct DeepSeek V4 Flash 0731; GLM 5.3 Flash is the explicit fallback.'
    required: false
    default: 'deepseek/deepseek-v4-flash-0731'
  action-sha:
    description: >-
      Exact 40-hex commit SHA of the Review Yeti action source. Required when review-engine is
      pi-workflow so runtime provenance is bound to the immutable action source.
    required: false
    default: ''
  review-engine:
    description: >-
      Trusted review scheduler bootstrap: legacy or pi-workflow. The Pi workflow path requires
      callers to provision Node 24 before invoking this composite Action, installs the reviewed
      dependency graph with npm ci from Review Yeti's lockfile, and never resolves Pi packages
      from the consumer repository. Legacy remains the default until governed callers migrate.
    required: false
    default: 'legacy'
  execution-backend:
    description: >-
      Review execution location: local runs the existing panel on this runner; doks only admits
      the immutable request to the Review Yeti DOKS queue. DOKS callers must grant
      permissions: id-token: write and rely on the later Review Yeti App gate for a terminal result.
    required: false
    default: 'local'
  doks-dispatch-url:
    description: 'Fixed Review Yeti DOKS admission endpoint. Only the canonical HTTPS endpoint is accepted.'
    required: false
    default: 'https://review-bot.calltelemetry.com/api/dispatch/action'
  doks-publish-mode:
    description: >-
      DOKS publication policy: disabled admits a nonpublishing qualification run; app-gate is
      reserved for an allowlisted trusted workflow after the App gate is separately activated.
    required: false
    default: 'disabled'
  openrouter-allowed-models:
    description: >-
      Trusted workflow/base-config OpenRouter model allowlist, as comma-separated model IDs.
      Defaults to the direct DeepSeek V4 Flash 0731 plus GLM 5.3 Flash pair; this is not read from PR-head config.
    required: false
    default: ''
  openrouter-cost-quality-tradeoff:
    description: >-
      Legacy trusted routing-quality integer (0-10), retained for policy compatibility. Direct
      DeepSeek/GLM routing does not send this auto-router control; this is not read from PR-head config.
    required: false
    default: ''
  openrouter-data-collection:
    description: >-
      Trusted workflow/base-config OpenRouter provider data_collection policy. Must remain deny;
      this is not read from PR-head config.
    required: false
    default: 'deny'
  personas:
    description: >-
      Comma-separated reviewer persona ids, or a JSON array. Defaults to the five default-enabled reviewers.
      Available: security, performance, architecture, style, testing, documentation,
      accessibility, database, devops, i18n, dependencies, licensing.
    required: false
    default: ''
  max-diff-chars:
    description: 'Optional per-persona diff override. Empty uses model-aware capacity and full-coverage partitioning.'
    required: false
    default: ''
  max-personas:
    description: 'Maximum reviewers a resolved roster may contain. Each is one model request per push, so this bounds what a configuration change can spend.'
    required: false
    default: '25'
  max-review-assignments:
    description: 'Hard pre-dispatch cap on partition-by-persona model assignments for one run.'
    required: false
    default: '24'
  incremental-review:
    description: >-
      Reuse complete exact-parent Review Yeti evidence and review only a bounded repair delta.
      Requires actions: read. Any missing or invalid evidence falls back to the full PR diff.
    required: false
    default: 'false'
  max-incremental-diff-chars:
    description: 'Maximum trusted repair-delta size; larger follow-up changes fall back to the full PR diff.'
    required: false
    default: '60000'
  incremental-trusted-workflow:
    description: >-
      Comma-separated exact reusable-workflow references that may appear in the parent artifact's
      completed GitHub run. Reuse also requires incremental-trusted-workflow-sha to match the
      resolved workflow commit recorded by GitHub.
    required: false
    default: ''
  incremental-trusted-workflow-sha:
    description: >-
      Exact 40-character commit SHA of the reusable workflow trusted for this run. A matching
      workflow path without this immutable provenance binding cannot authorize evidence reuse.
    required: false
    default: ''
  max-incremental-chain:
    description: >-
      Maximum hops of trusted repair-delta reuse chained since the last full review. A candidate
      parent report at or beyond this depth is not reused; the run falls back to a full review.
    required: false
    default: '5'
  incremental-artifact-repo:
    description: >-
      Repository whose Actions artifacts hold prior run reports. Set this to the executing
      repository (for example github.repository) on a central repository_dispatch execution path,
      where run reports are uploaded by the workflow that runs the review, not by the repository
      being reviewed. Defaults to the reviewed pull request's own repository.
    required: false
    default: ''
  incremental-trusted-events:
    description: >-
      Comma-separated GitHub event names a candidate parent run may have been triggered by.
      Central repository_dispatch execution must add repository_dispatch explicitly; it is never
      trusted by default.
    required: false
    default: 'pull_request,pull_request_target'
  config-ref:
    description: >-
      Git ref to read .ct-review.yaml and .ct-review/personas from. Defaults to the pull
      request's base branch. Reviewer charters are prompts run with your API key, so they are
      deliberately not read from the pull request's own head.
    required: false
    default: ''
  pr-number:
    description: 'Pull request to review. Defaults to the PR that triggered the workflow.'
    required: false
    default: ''
  repo:
    description: 'Repository owning the pull request, as owner/name. Defaults to the current repository.'
    required: false
    default: ''
  github-token:
    description: 'Token used to read the diff and post the review comment. The default workflow token is sufficient for same-repository reviews.'
    required: false
    default: ${{ github.token }}
  transports:
    description: 'JSON array of healthy Review Yeti candidate transports.'
    required: false
    default: ''
  transport-plan-b64:
    description: 'Base64 encoded JSON transport plan.'
    required: false
    default: ''
  dispatch-mode:
    description: 'Persona transport assignment mode: ordered preserves one shared fallback list; striped assigns weighted primary transports per lane.'
    required: false
    default: 'ordered'
  context7-api-key:
    description: 'Context7 API key for documentation evidence retrieval.'
    required: false
    default: ''
  honcho-api-key:
    description: 'Honcho API key for cloud cognitive memory synchronization.'
    required: false
    default: ''
  honcho-base-url:
    description: 'Base URL for Honcho memory API.'
    required: false
    default: ''
  honcho-workspace:
    description: 'Honcho workspace namespace for team memory.'
    required: false
    default: ''
  honcho-peer:
    description: 'Honcho writer peer ID for Review Yeti.'
    required: false
    default: ''
  honcho-observed:
    description: 'Honcho observed peer ID for repository contributors.'
    required: false
    default: ''
  honcho-recall-peers:
    description: 'Comma-separated list of Honcho writer peers to recall decisions from.'
    required: false
    default: ''
  honcho-recall-distance:
    description: 'Maximum distance bound for Honcho semantic search (default 0.35).'
    required: false
    default: ''
  memory-provider:
    description: 'Memory backend provider: sqlite, honcho, composite, postgres, auto.'
    required: false
    default: ''
  # Deprecated compatibility inputs retained for callers on the pre-v1 contract. The central
  # workflow now passes the supported policy/transport inputs above; these are intentionally
  # accepted and ignored so an older caller can finish its migration without changing review
  # semantics or producing an unknown-input warning.
  target-config:
    description: 'Deprecated compatibility input; trusted configuration is resolved by the action.'
    required: false
    default: ''
  openrouter-ignore-providers:
    description: 'Deprecated compatibility input; provider admission is carried by the transport plan.'
    required: false
    default: ''
  openrouter-provider-routing:
    description: 'Deprecated compatibility input; provider admission is carried by the transport plan.'
    required: false
    default: ''
  openrouter-timeout-ms:
    description: 'Deprecated compatibility input; transport timeouts are carried by the transport plan.'
    required: false
    default: ''
  openrouter-ttft-ms:
    description: 'Deprecated compatibility input; transport admission is handled by the caller.'
    required: false
    default: ''
  openrouter-max-attempts:
    description: 'Deprecated compatibility input; retry policy is handled by the transport plan.'
    required: false
    default: ''
  lane-deadline-ms:
    description: 'Deprecated compatibility input; lane budgets are enforced by the caller policy.'
    required: false
    default: ''
  lane-call-budget:
    description: 'Deprecated compatibility input; lane budgets are enforced by the caller policy.'
    required: false
    default: ''
  max-investigation-turns:
    description: 'Deprecated compatibility input; investigation limits are enforced by the caller policy.'
    required: false
    default: ''
  max-file-diff-chars:
    description: 'Deprecated compatibility input; use max-diff-chars.'
    required: false
    default: ''
  max-passes:
    description: 'Deprecated compatibility input; pass limits are enforced by the caller policy.'
    required: false
    default: ''
  exclude:
    description: 'Deprecated compatibility input; persona selection is controlled by personas.'
    required: false
    default: ''

outputs:
  verdict:
    description: 'SHIP, FIX_FIRST, BLOCK, or NO_VERDICT when the review cannot complete safely.'
    value: ${{ steps.review.outputs.verdict || steps.doks-dispatch.outputs.verdict }}
  findings-count:
    description: 'Total findings across all personas.'
    value: ${{ steps.review.outputs.findings-count || steps.doks-dispatch.outputs.findings-count }}
  review-status:
    description: 'Overall review outcome: SHIP, FIX_FIRST, BLOCK, or DISPATCHED while the App gate is pending.'
    value: ${{ steps.review.outputs.review-status || steps.doks-dispatch.outputs.review-status }}
  gate-decision:
    description: 'Exact-head gate result: PASS, BLOCK, or PENDING after remote admission.'
    value: ${{ steps.review.outputs.gate-decision || steps.doks-dispatch.outputs.gate-decision }}
  merge-eligible:
    description: 'Whether the exact-head review is eligible for merge.'
    value: ${{ steps.review.outputs.merge-eligible || steps.doks-dispatch.outputs.merge-eligible }}
  dispatch-reflection-status:
    description: 'Provider dispatch reflection status for the exact-head run.'
    value: ${{ steps.review.outputs.dispatch-reflection-status }}
  review-dispatch-reflection-status:
    description: 'Legacy-prefixed alias for provider dispatch reflection status.'
    value: ${{ steps.review.outputs.dispatch-reflection-status }}
  provider-receipt-digest:
    description: 'SHA-256 digest of the exact-head review receipt.'
    value: ${{ steps.review.outputs.provider-receipt-digest }}
  review-dispatch-provider-receipt-digest:
    description: 'Legacy-prefixed alias for the exact-head provider receipt digest.'
    value: ${{ steps.review.outputs.provider-receipt-digest }}
  run-report-path:
    description: 'Path to the exact-head review run report JSON.'
    value: ${{ steps.review.outputs.run-report-path }}
  provider-telemetry-digest:
    description: 'SHA-256 digest of the reporting-only provider telemetry receipt.'
    value: ${{ steps.review.outputs.provider-telemetry-digest }}
  provider-telemetry-path:
    description: 'Path to the reporting-only provider telemetry receipt JSON.'
    value: ${{ steps.review.outputs.provider-telemetry-path }}
  rationale:
    description: 'Executive rationale summarizing why this verdict was chosen.'
    value: ${{ steps.review.outputs.rationale || steps.doks-dispatch.outputs.rationale }}
  total-findings:
    description: 'Total findings across all evaluated reviewers.'
    value: ${{ steps.review.outputs.total-findings || steps.doks-dispatch.outputs.total-findings }}
  p0-count:
    description: 'Count of P0 (blocking) findings.'
    value: ${{ steps.review.outputs.p0-count || steps.doks-dispatch.outputs.p0-count }}
  p1-count:
    description: 'Count of P1 (high-priority) findings.'
    value: ${{ steps.review.outputs.p1-count || steps.doks-dispatch.outputs.p1-count }}
  p2-count:
    description: 'Count of P2 (nit) findings.'
    value: ${{ steps.review.outputs.p2-count || steps.doks-dispatch.outputs.p2-count }}
  personas-completed:
    description: 'Persona lanes that completed successfully.'
    value: ${{ steps.review.outputs.personas-completed }}
  files-reviewed:
    description: 'Changed files the reviewers were shown.'
    value: ${{ steps.review.outputs.files-reviewed }}
  files-omitted:
    description: 'Changed files the diff budget excluded. Non-zero means the verdict covers only part of the change.'
    value: ${{ steps.review.outputs.files-omitted }}
  diff-fallback-used:
    description: 'true when the GitHub diff API 406d or predictably would have (over 300 files / 20,000 lines) and fetch-pr-diff.sh used a local clone or the files API instead.'
    value: ${{ steps.diff.outputs.used-fallback }}
  diff-fallback-mode:
    description: 'none, git-clone, forward-merge-conflict-delta, or gh-files-api -- which diff-acquisition tier actually produced the reviewed diff.'
    value: ${{ steps.diff.outputs.fallback-mode }}

runs:
  using: composite
  steps:
    - name: Validate execution backend
      shell: bash
      env:
        EXECUTION_BACKEND: ${{ inputs.execution-backend }}
      run: |
        set -euo pipefail
        case "$EXECUTION_BACKEND" in
          local|doks) ;;
          *)
            echo "::error::execution-backend must be local or doks"
            exit 1
            ;;
        esac

    - name: Resolve target pull request
      id: target
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_PR: ${{ inputs.pr-number }}
        EVENT_PR: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        REPO="${INPUT_REPO:-${{ github.repository }}}"
        PR="${INPUT_PR:-$EVENT_PR}"

        if [ -z "$PR" ] || [ "$PR" = "null" ]; then
          echo "::error::No pull request number available. Run this action on a pull_request event, or set the pr-number input."
          exit 1
        fi

        echo "repo=$REPO" >> "$GITHUB_OUTPUT"
        echo "pr=$PR" >> "$GITHUB_OUTPUT"
        echo "repository-id=$(gh api "repos/$REPO" --jq .id)" >> "$GITHUB_OUTPUT"
        gh pr view "$PR" --repo "$REPO" --json headRefOid,baseRefOid \
          --jq '"head-sha=\(.headRefOid)\nbase-sha=\(.baseRefOid)"' >> "$GITHUB_OUTPUT"
        # Used only to detect a forward-merge PR (scripts/fetch-pr-diff.sh),
        # so the conflict-resolution delta can be reviewed instead of the
        # full three-dot diff against base.
        gh pr view "$PR" --repo "$REPO" --json title \
          --jq '"title<<CT_REVIEW_PR_TITLE\n\(.title)\nCT_REVIEW_PR_TITLE"' >> "$GITHUB_OUTPUT"
        echo "Reviewing $REPO#$PR via ${{ inputs.execution-backend }}"

    - name: Dispatch review to DOKS
      id: doks-dispatch
      if: ${{ inputs.execution-backend == 'doks' }}
      shell: bash
      env:
        DOKS_DISPATCH_URL: ${{ inputs.doks-dispatch-url }}
        DOKS_OIDC_AUDIENCE: review-yeti-doks-dispatch
        DOKS_PUBLISH_MODE: ${{ inputs.doks-publish-mode }}
        ACTION_SHA: ${{ inputs.action-sha }}
        REPOSITORY_ID: ${{ steps.target.outputs.repository-id }}
        REPOSITORY: ${{ steps.target.outputs.repo }}
        PR_NUMBER: ${{ steps.target.outputs.pr }}
        HEAD_SHA: ${{ steps.target.outputs.head-sha }}
        BASE_SHA: ${{ steps.target.outputs.base-sha }}
        GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
        GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
      run: |
        set -euo pipefail
        node "$GITHUB_ACTION_PATH/scripts/dispatch-doks-action.mjs"

    # GitHub's diff media type (what `gh pr diff` requests) 406s once a pull
    # request exceeds 300 changed files or 20,000 changed lines. That used to
    # fail this whole step -- and the run, with no verdict -- on any large
    # forward-merge or backport. fetch-pr-diff.sh preemptively detects an
    # over-limit PR, falls back to a local diff (or the files API) when it
    # 406s anyway, and reorders the result so generated/lock/vendor/snapshot
    # and test files are the first ones the existing char-budget truncation
    # in review-pipeline.js omits if the diff is still too large to review in
    # full. See review-yeti-bot#REL-513.
    - name: Fetch pull request diff
      id: diff
      if: ${{ inputs.execution-backend != 'doks' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ steps.target.outputs.repo }}
        PR_NUMBER: ${{ steps.target.outputs.pr }}
        PR_HEAD_SHA: ${{ steps.target.outputs.head-sha }}
        PR_BASE_SHA: ${{ steps.target.outputs.base-sha }}
        PR_TITLE: ${{ steps.target.outputs.title }}
        DIFF_OUTPUT_PATH: ${{ runner.temp }}/ct-review.diff
      run: |
        set -euo pipefail
        "$GITHUB_ACTION_PATH/scripts/fetch-pr-diff.sh"
        echo "PR_HEAD_SHA=${PR_HEAD_SHA}" >> "$GITHUB_ENV"
        echo "PR_BASE_SHA=${PR_BASE_SHA}" >> "$GITHUB_ENV"

    # Installed under legacy-runtime/, not the Action checkout root and not the
    # consumer workspace. The lockfile is the two-package graph baked by
    # Dockerfile.legacy-runtime in CI. Installing into GITHUB_ACTION_PATH reifies
    # the application package.json and is the ~800 Mi review-job spike.
    - name: Install pipeline dependencies
      if: ${{ inputs.execution-backend != 'doks' }}
      shell: bash
      env:
        NPM_PREFIX: ${{ runner.temp }}/review-yeti-npm
        REVIEW_ENGINE: ${{ inputs.review-engine }}
        REVIEW_YETI_ACTION_SHA: ${{ inputs.action-sha }}
      run: |
        set -euo pipefail
        if ! command -v node >/dev/null || ! command -v npm >/dev/null; then
          echo "::error::Node and npm are required"
          exit 1
        fi
        echo "node $(node -v) npm $(npm -v)"
        case "${REVIEW_ENGINE:-legacy}" in
          pi-workflow)
            node "$GITHUB_ACTION_PATH/scripts/install-action-runtime.mjs"
            ;;
          legacy)
            # Lock-backed two-package graph. Never `npm install` into GITHUB_ACTION_PATH —
            # that reifies the application package.json (Next.js) and is the ~800 Mi spike.
            RUNTIME="$GITHUB_ACTION_PATH/legacy-runtime"
            if [ ! -f "$RUNTIME/package-lock.json" ]; then
              echo "::error::legacy-runtime/package-lock.json is missing from the Action checkout"
              exit 1
            fi
            # npm 11 treats an absolute --prefix as a package name. Run inside the
            # lock directory and pass `--prefix .` (same pattern as install-action-runtime.mjs).
            ( cd "$RUNTIME" && npm ci --prefix . --omit=dev --ignore-scripts --no-audit --no-fund )
            node "$GITHUB_ACTION_PATH/scripts/verify-legacy-runtime-graph.mjs" "$RUNTIME"
            echo "NODE_PATH=$RUNTIME/node_modules" >> "$GITHUB_ENV"
            ;;
          *)
            echo "::error::review-engine must be legacy or pi-workflow"
            exit 1
            ;;
        esac

    # Fetch configuration from the target repository's trusted base ref (the branch the PR aims at).
    # Reviewer charters are prompts run with the reviewer API key; they must not be injected by
    # the pull request under review. We download .ct-review.yaml and persona files directly via
    # the API, into a directory the pull request cannot write to. This also means the caller does
    # not need to check the repository out at all.
    - name: Fetch reviewer configuration from the trusted base ref
      if: ${{ inputs.execution-backend != 'doks' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        CONFIG_REF: ${{ inputs.config-ref }}
        BASE_REF: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        REPO="${{ steps.target.outputs.repo }}"
        REF="${CONFIG_REF:-${BASE_REF:-}}"
        DEST="${RUNNER_TEMP}/ct-review-config"
        mkdir -p "$DEST/.ct-review/personas"

        if [ -z "$REF" ]; then
          REF=$(gh api "repos/$REPO" --jq .default_branch)
        fi
        echo "Reading reviewer configuration from $REPO@$REF"

        for f in .reviewyeti.yaml .reviewyeti.yml .ct-review.yaml .ct-review.yml .coderabbit.yaml .coderabbit.yml; do
          if gh api "repos/$REPO/contents/$f?ref=$REF" -H "Accept: application/vnd.github.raw" > "$DEST/$f" 2>/dev/null; then
            echo "  found $f"
            break
          fi
          rm -f "$DEST/$f"
        done

        # The base .gitmodules is part of the trusted policy surface used to classify
        # submodule URL changes; do not read it from the pull-request checkout.
        if ! gh api "repos/$REPO/contents/.gitmodules?ref=$REF" -H "Accept: application/vnd.github.raw" > "$DEST/.gitmodules" 2>/dev/null; then
          rm -f "$DEST/.gitmodules"
        fi

        # Persona files are one markdown file per reviewer; enumerate the directory then fetch each.
        if gh api "repos/$REPO/contents/.ct-review/personas?ref=$REF" --jq '.[].name' > "${RUNNER_TEMP}/persona-names" 2>/dev/null; then
          while read -r name; do
            case "$name" in
              *.md|*.mdx)
                gh api "repos/$REPO/contents/.ct-review/personas/$name?ref=$REF" \
                  -H "Accept: application/vnd.github.raw" > "$DEST/.ct-review/personas/$name" 2>/dev/null \
                  && echo "  found persona $name"
                ;;
            esac
          done < "${RUNNER_TEMP}/persona-names"
        fi

    - name: Run review panel
      id: review
      if: ${{ inputs.execution-backend != 'doks' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key || inputs.api-key || inputs.llm-api-key }}
        OPENROUTER_BASE_URL: ${{ inputs.llm-base-url }}
        OPENROUTER_MODEL: ${{ inputs.model }}
        FIREWORKS_PR_REVIEW_API_KEY: ${{ inputs.fireworks-api-key || env.FIREWORKS_PR_REVIEW_API_KEY || env.FIREWORKS_API_KEY }}
        FIREWORKS_API_KEY: ${{ inputs.fireworks-api-key || env.FIREWORKS_API_KEY }}
        OLLAMA_PR_REVIEW_API_KEY: ${{ inputs.ollama-api-key || env.OLLAMA_PR_REVIEW_API_KEY || env.OLLAMA_API_KEY }}
        OLLAMA_API_KEY: ${{ inputs.ollama-api-key || env.OLLAMA_API_KEY }}
        SYNTHETIC_API_KEY: ${{ inputs.synthetic-api-key || env.SYNTHETIC_API_KEY }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key || env.ANTHROPIC_API_KEY }}
        GEMINI_API_KEY: ${{ inputs.gemini-api-key || env.GEMINI_API_KEY }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key || env.OPENAI_API_KEY }}
        OPENROUTER_PR_REVIEW_API_KEY: ${{ inputs.openrouter-api-key || env.OPENROUTER_PR_REVIEW_API_KEY }}
        REVIEW_YETI_TRANSPORTS: ${{ inputs.transports }}
        REVIEW_YETI_TRANSPORT_PLAN_B64: ${{ inputs.transport-plan-b64 }}
        REVIEW_YETI_DISPATCH_MODE: ${{ inputs.dispatch-mode }}
        CONTEXT7_API_KEY: ${{ inputs.context7-api-key }}
        LINEAR_API_KEY: ${{ inputs.linear-api-key || env.LINEAR_API_KEY }}
        HONCHO_API_KEY: ${{ inputs.honcho-api-key || env.HONCHO_API_KEY }}
        HONCHO_BASE_URL: ${{ inputs.honcho-base-url || env.HONCHO_BASE_URL }}
        HONCHO_WORKSPACE: ${{ inputs.honcho-workspace || env.HONCHO_WORKSPACE }}
        HONCHO_PEER: ${{ inputs.honcho-peer || env.HONCHO_PEER }}
        HONCHO_OBSERVED: ${{ inputs.honcho-observed || env.HONCHO_OBSERVED }}
        HONCHO_RECALL_PEERS: ${{ inputs.honcho-recall-peers || env.HONCHO_RECALL_PEERS }}
        HONCHO_RECALL_DISTANCE: ${{ inputs.honcho-recall-distance || env.HONCHO_RECALL_DISTANCE }}
        MEMORY_PROVIDER: ${{ inputs.memory-provider || env.MEMORY_PROVIDER }}
        OPENROUTER_ALLOWED_MODELS: ${{ inputs.openrouter-allowed-models }}
        OPENROUTER_COST_QUALITY_TRADEOFF: ${{ inputs.openrouter-cost-quality-tradeoff }}
        OPENROUTER_DATA_COLLECTION: ${{ inputs.openrouter-data-collection }}
        ACTIVE_PERSONAS: ${{ inputs.personas }}
        MAX_DIFF_CHARS: ${{ inputs.max-diff-chars }}
        MAX_PERSONAS: ${{ inputs.max-personas }}
        MAX_REVIEW_ASSIGNMENTS: ${{ inputs.max-review-assignments }}
        REVIEW_YETI_INCREMENTAL_REVIEW: ${{ inputs.incremental-review }}
        MAX_INCREMENTAL_DIFF_CHARS: ${{ inputs.max-incremental-diff-chars }}
        REVIEW_YETI_INCREMENTAL_TRUSTED_WORKFLOW: ${{ inputs.incremental-trusted-workflow }}
        REVIEW_YETI_INCREMENTAL_TRUSTED_WORKFLOW_SHA: ${{ inputs.incremental-trusted-workflow-sha }}
        MAX_INCREMENTAL_CHAIN: ${{ inputs.max-incremental-chain }}
        REVIEW_YETI_INCREMENTAL_ARTIFACT_REPO: ${{ inputs.incremental-artifact-repo }}
        REVIEW_YETI_INCREMENTAL_TRUSTED_EVENTS: ${{ inputs.incremental-trusted-events }}
        REVIEW_YETI_ACTION_SHA: ${{ inputs.action-sha }}
        PR_NUMBER: ${{ steps.target.outputs.pr }}
        PR_REPO: ${{ steps.target.outputs.repo }}
        CT_REVIEW_CONFIG_DIR: ${{ runner.temp }}/ct-review-config
        NODE_PATH: ${{ github.action_path }}/legacy-runtime/node_modules
      run: |
        # Keep the diff on disk. Exporting an entire PR as PR_DIFF can exceed the runner's
        # execve argument limit before Node starts.
        PR_DIFF_FILE="${RUNNER_TEMP}/ct-review.diff" \
          node "$GITHUB_ACTION_PATH/.github/workflows/pipelines/review-pipeline.js"
