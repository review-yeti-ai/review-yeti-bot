name: 'AI PR Review Panel'
description: 'Reviews a pull request with a panel of AI reviewer personas and posts a single consolidated comment.'
author: 'JBJMLLC'

branding:
  icon: 'check-circle'
  color: 'purple'

inputs:
  llm-api-key:
    description: >-
      OpenRouter API key. Without it the action fails closed and posts no successful verdict.
    required: false
    default: ''
  llm-base-url:
    description: 'Optional OpenRouter-compatible base URL. Defaults to https://openrouter.ai/api/v1.'
    required: false
    default: 'https://openrouter.ai/api/v1'
  model:
    description: 'Model identifier passed to the provider.'
    required: false
    default: 'openrouter/auto'
  personas:
    description: >-
      Comma-separated reviewer persona ids, or a JSON array. Defaults to all twelve.
      Available: security, performance, architecture, style, testing, documentation,
      accessibility, database, devops, i18n, dependencies, licensing.
    required: false
    default: ''
  max-diff-chars:
    description: 'Per-persona diff budget. Each persona is one request per push, so this bounds cost on large PRs.'
    required: false
    default: '24000'
  max-personas:
    description: 'Maximum reviewers a resolved roster may contain. Each is one model request per push, so this bounds what a configuration change can spend.'
    required: false
    default: '25'
  config-ref:
    description: >-
      Git ref to read .ct-review.yaml and .ct-review/personas from. Defaults to the pull
      request's base branch. Reviewer charters are prompts run with your API key, so they are
      deliberately not read from the pull request's own head.
    required: false
    default: ''
  pr-number:
    description: 'Pull request to review. Defaults to the PR that triggered the workflow.'
    required: false
    default: ''
  repo:
    description: 'Repository owning the pull request, as owner/name. Defaults to the current repository.'
    required: false
    default: ''
  github-token:
    description: 'Token used to read the diff and post the review comment. The default workflow token is sufficient for same-repository reviews.'
    required: false
    default: ${{ github.token }}

outputs:
  verdict:
    description: 'SHIP, FIX_FIRST, BLOCK, or NO_VERDICT when the review cannot complete safely.'
    value: ${{ steps.review.outputs.verdict }}
  findings-count:
    description: 'Total findings across all personas.'
    value: ${{ steps.review.outputs.findings-count }}
  p0-count:
    description: 'Count of P0 (exploitable or data-losing) findings.'
    value: ${{ steps.review.outputs.p0-count }}
  p1-count:
    description: 'Count of P1 (must fix before merge) findings.'
    value: ${{ steps.review.outputs.p1-count }}
  p2-count:
    description: 'Count of P2 (nit) findings.'
    value: ${{ steps.review.outputs.p2-count }}
  personas-completed:
    description: 'Persona lanes that completed successfully.'
    value: ${{ steps.review.outputs.personas-completed }}
  files-reviewed:
    description: 'Changed files the reviewers were shown.'
    value: ${{ steps.review.outputs.files-reviewed }}
  files-omitted:
    description: 'Changed files the diff budget excluded. Non-zero means the verdict covers only part of the change.'
    value: ${{ steps.review.outputs.files-omitted }}

runs:
  using: composite
  steps:
    - name: Resolve target pull request
      id: target
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_PR: ${{ inputs.pr-number }}
        EVENT_PR: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        REPO="${INPUT_REPO:-${{ github.repository }}}"
        PR="${INPUT_PR:-$EVENT_PR}"

        if [ -z "$PR" ] || [ "$PR" = "null" ]; then
          echo "::error::No pull request number available. Run this action on a pull_request event, or set the pr-number input."
          exit 1
        fi

        echo "repo=$REPO" >> "$GITHUB_OUTPUT"
        echo "pr=$PR" >> "$GITHUB_OUTPUT"
        echo "Reviewing $REPO#$PR"

    - name: Fetch pull request diff
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        gh pr diff "${{ steps.target.outputs.pr }}" \
          --repo "${{ steps.target.outputs.repo }}" > "${RUNNER_TEMP}/ct-review.diff"
        PR_HEAD_SHA="$(gh pr view "${{ steps.target.outputs.pr }}" --repo "${{ steps.target.outputs.repo }}" --json headRefOid --jq .headRefOid)"
        PR_BASE_SHA="$(gh pr view "${{ steps.target.outputs.pr }}" --repo "${{ steps.target.outputs.repo }}" --json baseRefOid --jq .baseRefOid)"
        echo "PR_HEAD_SHA=$PR_HEAD_SHA" >> "$GITHUB_ENV"
        echo "PR_BASE_SHA=$PR_BASE_SHA" >> "$GITHUB_ENV"
        echo "Fetched $(wc -l < "${RUNNER_TEMP}/ct-review.diff") diff lines."

    # Installed under the action path, not the consumer's workspace, so reviewing a repository
    # never leaves a stray node_modules in its checkout.
    - name: Install pipeline dependencies
      shell: bash
      run: npm install --prefix "$GITHUB_ACTION_PATH" js-yaml@4 --no-save --no-audit --no-fund --silent

    # Reviewer charters are prompts executed with the caller's API key. Reading them from the
    # pull request's own checkout would let a pull request rewrite the instructions reviewing it,
    # and declare as many reviewers as it likes. They are fetched from the base ref instead, over
    # the API, into a directory the pull request cannot write to. This also means the caller does
    # not need to check the repository out at all.
    - name: Fetch reviewer configuration from the trusted base ref
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        CONFIG_REF: ${{ inputs.config-ref }}
        BASE_REF: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        REPO="${{ steps.target.outputs.repo }}"
        REF="${CONFIG_REF:-${BASE_REF:-}}"
        DEST="${RUNNER_TEMP}/ct-review-config"
        mkdir -p "$DEST/.ct-review/personas"

        if [ -z "$REF" ]; then
          REF=$(gh api "repos/$REPO" --jq .default_branch)
        fi
        echo "Reading reviewer configuration from $REPO@$REF"

        for f in .ct-review.yaml .ct-review.yml .coderabbit.yaml .coderabbit.yml; do
          if gh api "repos/$REPO/contents/$f?ref=$REF" -H "Accept: application/vnd.github.raw" > "$DEST/$f" 2>/dev/null; then
            echo "  found $f"
            break
          fi
          rm -f "$DEST/$f"
        done

        # The base .gitmodules is part of the trusted policy surface used to classify
        # submodule URL changes; do not read it from the pull-request checkout.
        if ! gh api "repos/$REPO/contents/.gitmodules?ref=$REF" -H "Accept: application/vnd.github.raw" > "$DEST/.gitmodules" 2>/dev/null; then
          rm -f "$DEST/.gitmodules"
        fi

        # Persona files are one markdown file per reviewer; enumerate the directory then fetch each.
        if gh api "repos/$REPO/contents/.ct-review/personas?ref=$REF" --jq '.[].name' > "${RUNNER_TEMP}/persona-names" 2>/dev/null; then
          while read -r name; do
            case "$name" in
              *.md|*.mdx)
                gh api "repos/$REPO/contents/.ct-review/personas/$name?ref=$REF" \
                  -H "Accept: application/vnd.github.raw" > "$DEST/.ct-review/personas/$name" 2>/dev/null \
                  && echo "  found persona $name"
                ;;
            esac
          done < "${RUNNER_TEMP}/persona-names"
        fi

    - name: Run review panel
      id: review
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        OPENROUTER_API_KEY: ${{ inputs.llm-api-key }}
        OPENROUTER_BASE_URL: ${{ inputs.llm-base-url }}
        OPENROUTER_MODEL: ${{ inputs.model }}
        ACTIVE_PERSONAS: ${{ inputs.personas }}
        MAX_DIFF_CHARS: ${{ inputs.max-diff-chars }}
        MAX_PERSONAS: ${{ inputs.max-personas }}
        PR_NUMBER: ${{ steps.target.outputs.pr }}
        PR_REPO: ${{ steps.target.outputs.repo }}
        CT_REVIEW_CONFIG_DIR: ${{ runner.temp }}/ct-review-config
      run: |
        # Keep the diff on disk. Exporting an entire PR as PR_DIFF can exceed the runner's
        # execve argument limit before Node starts.
        PR_DIFF_FILE="${RUNNER_TEMP}/ct-review.diff" \
          node "$GITHUB_ACTION_PATH/.github/workflows/pipelines/review-pipeline.js"
