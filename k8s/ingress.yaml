apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ct-review-bot-ingress
  labels:
    app: ct-review-bot
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ct-review-bot-service
                port:
                  number: 3000
