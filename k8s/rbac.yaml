apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ct-job-runner-role
  namespace: ct-review-system
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ct-job-runner-binding
  namespace: ct-review-system
subjects:
  - kind: ServiceAccount
    name: ct-review-bot
    namespace: ct-review-system
roleRef:
  kind: Role
  name: ct-job-runner-role
  apiGroup: rbac.authorization.k8s.io
