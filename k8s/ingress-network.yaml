apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ct-review-bot
  namespace: ct-review-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: haproxy-ct-dev
  tls:
    - hosts: [review-bot.calltelemetry.com]
      secretName: review-bot-calltelemetry-com-tls
  rules:
    - host: review-bot.calltelemetry.com
      http:
        paths:
          - path: /webhook
            pathType: Prefix
            backend:
              service:
                name: ct-review-bot
                port:
                  number: 3000
          - path: /api/webhook/github
            pathType: Prefix
            backend:
              service:
                name: ct-review-bot
                port:
                  number: 3000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: ct-review-bot
                port:
                  number: 3000
          - path: /ready
            pathType: Exact
            backend:
              service:
                name: ct-review-bot
                port:
                  number: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: ct-review-system
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ct-review-bot-allowed
  namespace: ct-review-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ct-review-bot
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ct-dev
          podSelector:
            matchLabels:
              app.kubernetes.io/name: haproxy-ingress
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: omniroute
      ports:
        - protocol: TCP
          port: 20128
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: omniroute-allowed
  namespace: ct-review-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: omniroute
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ct-review-bot
      ports:
        - protocol: TCP
          port: 20128
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
