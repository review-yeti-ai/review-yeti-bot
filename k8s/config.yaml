apiVersion: v1
kind: ConfigMap
metadata:
  name: ct-review-bot-config
  namespace: ct-review-system
data:
  PORT: "3000"
  HOST: "0.0.0.0"
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  OMNIROUTE_BASE_URL: "http://omniroute.ct-review-system.svc.cluster.local:20128"
  CT_REVIEW_RUN_STORE: "/app/data/review-runs.json"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ct-review-bot-data
  namespace: ct-review-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ct-review-bot
  namespace: ct-review-system
spec:
  selector:
    app.kubernetes.io/name: ct-review-bot
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: omniroute
  namespace: ct-review-system
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: omniroute
  ports:
    - name: http
      port: 20128
      targetPort: http
