apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ct-review-bot
  namespace: jbjmllc-review-system
  labels:
    app: ct-review-bot
    instance: jbjmllc
  annotations:
    kubernetes.io/ingress.class: haproxy-ct-dev
    cert-manager.io/cluster-issuer: letsencrypt-prod
    haproxy.org/timeout-server: "120s"
    haproxy.org/timeout-client: "120s"
spec:
  tls:
    - hosts:
        - jbjmllc-review.calltelemetry.com
      secretName: jbjmllc-review-calltelemetry-com-tls
  rules:
    - host: jbjmllc-review.calltelemetry.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ct-review-bot
                port:
                  number: 3000
---
# Default deny all traffic in namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: jbjmllc-review-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Allow ingress from HAProxy + egress to DNS/HTTPS/OmniRoute
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ct-review-bot-allowed
  namespace: jbjmllc-review-system
spec:
  podSelector:
    matchLabels:
      app: ct-review-bot
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ct-dev
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # HTTPS outbound (GitHub API, AI providers)
    - to: []
      ports:
        - protocol: TCP
          port: 443
    # OmniRoute in ct-review-system (cross-namespace)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ct-review-system
          podSelector:
            matchLabels:
              app: omniroute
      ports:
        - protocol: TCP
          port: 20128
---
# Allow cert-manager ACME HTTP-01 solver
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acme-http01-solver-allowed
  namespace: jbjmllc-review-system
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ct-dev
      ports:
        - protocol: TCP
          port: 8089
  egress:
    - to: []
      ports:
        - protocol: TCP
          port: 443
