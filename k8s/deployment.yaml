apiVersion: apps/v1
kind: Deployment
metadata:
  name: ct-review-bot
  labels:
    app: ct-review-bot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ct-review-bot
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: ct-review-bot
    spec:
      containers:
        - name: ct-review-bot
          image: ct-review-bot:latest
          ports:
            - containerPort: 3000
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/router/status
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          envFrom:
            - configMapRef:
                name: ct-review-bot-config
            - secretRef:
                name: ct-review-bot-secret
          volumeMounts:
            - name: data-volume
              mountPath: /app/data
      volumes:
        - name: data-volume
          emptyDir: {}
